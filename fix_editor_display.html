<!-- 修复编辑器显示问题 -->
<script>
// 修复暴力方案的编辑器显示问题
(function() {
    console.log('🔧 修复编辑器显示问题');
    
    function fixEditorDisplay() {
        console.log('🔨 开始修复编辑器显示...');
        
        // 等待暴力方案完成
        setTimeout(() => {
            const container = document.getElementById('editor');
            if (!container) {
                console.log('❌ 找不到编辑器容器');
                return;
            }
            
            // 查找编辑区域
            const editArea = container.querySelector('textarea');
            const previewArea = container.querySelector('div[style*="padding: 16px"]');
            
            if (!editArea) {
                console.log('❌ 找不到编辑区域，重新创建');
                recreateEditor(container);
                return;
            }
            
            console.log('✅ 找到编辑区域');
            console.log('📊 编辑区域显示状态: ' + editArea.style.display);
            console.log('📊 预览区域显示状态: ' + (previewArea ? previewArea.style.display : '不存在'));
            
            // 强制显示编辑区域
            editArea.style.display = 'block';
            editArea.style.flex = '1';
            editArea.style.width = '100%';
            editArea.style.height = '100%';
            
            if (previewArea) {
                previewArea.style.display = 'none';
            }
            
            console.log('✅ 编辑器显示已修复');
            
            // 确保Tab切换功能正常
            fixTabSwitching(container, editArea, previewArea);
            
        }, 7000); // 等待7秒，确保暴力方案完成
    }
    
    function recreateEditor(container) {
        console.log('🔨 重新创建编辑器...');
        
        // 清空容器
        container.innerHTML = '';
        container.style.cssText = `
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            background: white;
            display: flex;
            flex-direction: column;
        `;
        
        // 创建Tab栏
        const tabBar = document.createElement('div');
        tabBar.style.cssText = `
            display: flex;
            border-bottom: 1px solid #e1e5e9;
            background: #f8f9fa;
            height: 40px;
            flex-shrink: 0;
        `;
        
        // Write Tab
        const writeTab = document.createElement('button');
        writeTab.textContent = 'Write';
        writeTab.id = 'writeTab';
        writeTab.style.cssText = `
            padding: 8px 16px;
            border: none;
            background: white;
            cursor: pointer;
            border-bottom: 2px solid #007bff;
            color: #333;
            font-weight: 500;
        `;
        
        // Preview Tab
        const previewTab = document.createElement('button');
        previewTab.textContent = 'Preview';
        previewTab.id = 'previewTab';
        previewTab.style.cssText = `
            padding: 8px 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #666;
            font-weight: 500;
        `;
        
        // 内容区域
        const contentArea = document.createElement('div');
        contentArea.style.cssText = `
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        `;
        
        // 编辑区域
        const editArea = document.createElement('textarea');
        editArea.id = 'editArea';
        editArea.style.cssText = `
            flex: 1;
            border: none;
            padding: 16px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            outline: none;
            display: block;
        `;
        editArea.value = `# 编辑器修复成功！

现在可以正常编辑了：

## 功能测试
- ✅ Write标签：显示编辑器
- ✅ Preview标签：显示预览
- ✅ Tab切换：正常工作

请在这里编辑你的内容...`;
        
        // 预览区域
        const previewArea = document.createElement('div');
        previewArea.id = 'previewArea';
        previewArea.style.cssText = `
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: none;
            background: white;
        `;
        
        // 组装界面
        tabBar.appendChild(writeTab);
        tabBar.appendChild(previewTab);
        contentArea.appendChild(editArea);
        contentArea.appendChild(previewArea);
        container.appendChild(tabBar);
        container.appendChild(contentArea);
        
        // 设置Tab切换
        fixTabSwitching(container, editArea, previewArea);
        
        console.log('✅ 编辑器重新创建完成');
    }
    
    function fixTabSwitching(container, editArea, previewArea) {
        console.log('🔧 修复Tab切换功能...');
        
        const writeTab = container.querySelector('#writeTab') || container.querySelector('button:first-child');
        const previewTab = container.querySelector('#previewTab') || container.querySelector('button:last-child');
        
        if (!writeTab || !previewTab) {
            console.log('❌ 找不到Tab按钮');
            return;
        }
        
        // 移除现有事件监听器
        writeTab.replaceWith(writeTab.cloneNode(true));
        previewTab.replaceWith(previewTab.cloneNode(true));
        
        // 重新获取元素
        const newWriteTab = container.querySelector('button:first-child');
        const newPreviewTab = container.querySelector('button:last-child');
        
        // Write Tab点击
        newWriteTab.addEventListener('click', function() {
            console.log('📝 点击Write标签');
            
            // 更新Tab样式
            newWriteTab.style.background = 'white';
            newWriteTab.style.borderBottom = '2px solid #007bff';
            newWriteTab.style.color = '#333';
            
            newPreviewTab.style.background = 'transparent';
            newPreviewTab.style.borderBottom = 'none';
            newPreviewTab.style.color = '#666';
            
            // 显示编辑区域
            if (editArea) {
                editArea.style.display = 'block';
                console.log('✅ 编辑区域已显示');
            }
            if (previewArea) {
                previewArea.style.display = 'none';
                console.log('✅ 预览区域已隐藏');
            }
        });
        
        // Preview Tab点击
        newPreviewTab.addEventListener('click', function() {
            console.log('👁️ 点击Preview标签');
            
            // 更新Tab样式
            newPreviewTab.style.background = 'white';
            newPreviewTab.style.borderBottom = '2px solid #007bff';
            newPreviewTab.style.color = '#333';
            
            newWriteTab.style.background = 'transparent';
            newWriteTab.style.borderBottom = 'none';
            newWriteTab.style.color = '#666';
            
            // 更新预览内容
            if (editArea && previewArea) {
                updatePreview(editArea.value, previewArea);
            }
            
            // 显示预览区域
            if (editArea) {
                editArea.style.display = 'none';
                console.log('✅ 编辑区域已隐藏');
            }
            if (previewArea) {
                previewArea.style.display = 'block';
                console.log('✅ 预览区域已显示');
            }
        });
        
        console.log('✅ Tab切换功能已修复');
    }
    
    function updatePreview(markdown, previewArea) {
        let html = markdown
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/`(.*?)`/g, '<code>$1</code>')
            .replace(/^- (.*$)/gim, '<li>$1</li>')
            .replace(/\n/g, '<br>');
        
        html = html.replace(/(<li>.*?<\/li>)/g, '<ul>$1</ul>');
        
        previewArea.innerHTML = `
            <style>
                h1 { color: #333; margin: 16px 0 8px 0; }
                h2 { color: #555; margin: 12px 0 6px 0; }
                h3 { color: #777; margin: 8px 0 4px 0; }
                strong { color: #007bff; }
                em { color: #28a745; }
                code { background: #f8f9fa; padding: 2px 4px; border-radius: 3px; }
                ul { margin: 8px 0; padding-left: 20px; }
                li { margin: 4px 0; }
            </style>
            ${html}
        `;
    }
    
    // 重写调试按钮
    window.simpleDebug = function() {
        console.log('🔧 手动修复编辑器显示');
        fixEditorDisplay();
    };
    
    // 开始修复
    fixEditorDisplay();
    
    console.log('🔧 编辑器显示修复系统已启动');
})();
</script>
