<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未保存内容提示功能测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">未保存内容提示功能测试</h1>
        
        <!-- 测试说明 -->
        <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-8">
            <div class="flex">
                <div class="flex-shrink-0">
                    <span class="material-icons-outlined text-blue-400">info</span>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-blue-700">
                        <strong>测试说明：</strong>
                    </p>
                    <ul class="mt-2 text-sm text-blue-600 list-disc list-inside">
                        <li>在文本框中输入内容，然后尝试点击"切换页面"按钮</li>
                        <li>系统应该弹出保存提示对话框</li>
                        <li>可以选择"保存"、"不保存"或"取消"</li>
                        <li>保存后或选择不保存后，页面会切换</li>
                        <li>选择取消会停留在当前页面</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <!-- 模拟编辑器 -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-gray-800">模拟文档编辑器</h2>
                <div class="flex space-x-2">
                    <button id="save-btn" class="hidden px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition-colors">
                        <span class="material-icons-outlined mr-1 text-sm">save</span>
                        保存
                    </button>
                    <span id="page-title" class="text-lg font-medium text-gray-600">测试文档</span>
                </div>
            </div>
            
            <textarea 
                id="editor" 
                class="w-full h-64 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                placeholder="在此输入内容进行测试..."
            ></textarea>
            
            <div class="mt-4 text-sm text-gray-500">
                <span id="status-indicator">状态：无更改</span>
            </div>
        </div>
        
        <!-- 测试按钮 -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">测试操作</h3>
            <div class="flex flex-wrap gap-4">
                <button id="navigate-btn" class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
                    <span class="material-icons-outlined mr-2">navigate_next</span>
                    切换页面（测试导航守卫）
                </button>
                
                <button id="manual-save-btn" class="px-6 py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors">
                    <span class="material-icons-outlined mr-2">save</span>
                    手动保存
                </button>
                
                <button id="reset-btn" class="px-6 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors">
                    <span class="material-icons-outlined mr-2">refresh</span>
                    重置状态
                </button>
                
                <button id="mark-saved-btn" class="px-6 py-3 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors">
                    <span class="material-icons-outlined mr-2">check</span>
                    标记为已保存
                </button>
            </div>
        </div>
        
        <!-- 日志区域 -->
        <div class="bg-gray-900 text-green-400 rounded-lg p-4 mt-6">
            <h3 class="text-lg font-semibold mb-2">调试日志</h3>
            <div id="log-area" class="font-mono text-sm h-32 overflow-y-auto">
                <div>系统初始化中...</div>
            </div>
        </div>
    </div>

    <!-- 未保存内容守卫组件 -->
    <script>
    /**
     * 通用的未保存内容检测和提示系统
     */
    window.UnsavedChangesGuard = {
        hasUnsavedChanges: false,
        originalContent: new Map(),
        monitoredElements: new Set(),
        currentFilePath: null,
        saveCallback: null,
        
        init: function() {
            this.log('🛡️ 初始化未保存内容守卫系统');
            this.createSavePromptDialog();
            this.bindGlobalEvents();
        },
        
        createSavePromptDialog: function() {
            if (document.getElementById('unsavedChangesDialog')) {
                return;
            }
            
            const dialog = document.createElement('div');
            dialog.id = 'unsavedChangesDialog';
            dialog.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden';
            dialog.innerHTML = `
                <div class="bg-white rounded-lg p-6 max-w-md mx-4 shadow-xl">
                    <div class="flex items-center mb-4">
                        <span class="material-icons-outlined text-orange-500 mr-3">warning</span>
                        <h3 class="text-lg font-semibold text-gray-800">保存更改</h3>
                    </div>
                    <p class="text-gray-600 mb-6">
                        您有未保存的更改，是否要保存这些更改？
                    </p>
                    <div class="flex justify-end space-x-3">
                        <button id="unsavedChanges_cancel" class="px-4 py-2 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                            取消
                        </button>
                        <button id="unsavedChanges_dontSave" class="px-4 py-2 text-red-600 border border-red-300 rounded-lg hover:bg-red-50 transition-colors">
                            不保存
                        </button>
                        <button id="unsavedChanges_save" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
                            保存
                        </button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(dialog);
            
            // 绑定按钮事件
            document.getElementById('unsavedChanges_cancel').addEventListener('click', () => {
                this.hideDialog();
                this.navigationCallback = null;
                this.log('❌ 用户取消导航');
            });
            
            document.getElementById('unsavedChanges_dontSave').addEventListener('click', () => {
                this.hideDialog();
                this.hasUnsavedChanges = false;
                this.log('⚠️ 用户选择不保存，继续导航');
                if (this.navigationCallback) {
                    this.navigationCallback();
                }
            });
            
            document.getElementById('unsavedChanges_save').addEventListener('click', () => {
                this.hideDialog();
                this.log('💾 用户选择保存并继续');
                this.saveAndContinue();
            });
        },
        
        showDialog: function() {
            const dialog = document.getElementById('unsavedChangesDialog');
            if (dialog) {
                dialog.classList.remove('hidden');
                this.log('📋 显示保存提示对话框');
            }
        },
        
        hideDialog: function() {
            const dialog = document.getElementById('unsavedChangesDialog');
            if (dialog) {
                dialog.classList.add('hidden');
            }
        },
        
        bindGlobalEvents: function() {
            window.addEventListener('beforeunload', (e) => {
                if (this.hasUnsavedChanges) {
                    e.preventDefault();
                    e.returnValue = '您有未保存的更改，确定要离开吗？';
                    this.log('⚠️ 页面卸载前检测到未保存更改');
                    return e.returnValue;
                }
            });
        },
        
        registerEditor: function(element, filePath, saveCallback) {
            if (!element) {
                this.log('❌ 注册编辑器失败：元素不存在');
                return;
            }
            
            this.log(`📝 注册编辑器监控：${filePath || '测试文档'}`);
            
            this.monitoredElements.add(element);
            this.currentFilePath = filePath;
            this.saveCallback = saveCallback;
            
            const originalContent = element.value || element.textContent || '';
            this.originalContent.set(element, originalContent);
            
            const handleChange = () => {
                this.checkForChanges();
            };
            
            if (element.tagName === 'TEXTAREA' || element.tagName === 'INPUT') {
                element.addEventListener('input', handleChange);
                element.addEventListener('change', handleChange);
            } else {
                element.addEventListener('input', handleChange);
                element.addEventListener('blur', handleChange);
            }
            
            element.setAttribute('data-unsaved-guard', 'true');
        },
        
        checkForChanges: function() {
            let hasChanges = false;
            
            for (const element of this.monitoredElements) {
                const currentContent = element.value || element.textContent || '';
                const originalContent = this.originalContent.get(element) || '';
                
                if (currentContent !== originalContent) {
                    hasChanges = true;
                    break;
                }
            }
            
            const wasChanged = this.hasUnsavedChanges;
            this.hasUnsavedChanges = hasChanges;
            
            if (wasChanged !== hasChanges) {
                this.onStateChange(hasChanges);
            }
        },
        
        onStateChange: function(hasUnsavedChanges) {
            this.log(`📝 未保存状态变更：${hasUnsavedChanges ? '有未保存更改' : '无未保存更改'}`);
            this.updateUnsavedIndicator(hasUnsavedChanges);
        },
        
        updateUnsavedIndicator: function(hasUnsavedChanges) {
            const saveBtn = document.getElementById('save-btn');
            const statusIndicator = document.getElementById('status-indicator');
            const pageTitle = document.getElementById('page-title');
            
            if (saveBtn) {
                if (hasUnsavedChanges) {
                    saveBtn.classList.remove('hidden');
                } else {
                    saveBtn.classList.add('hidden');
                }
            }
            
            if (statusIndicator) {
                statusIndicator.textContent = hasUnsavedChanges ? '状态：有未保存更改' : '状态：无更改';
                statusIndicator.className = hasUnsavedChanges ? 
                    'text-orange-600 font-medium' : 'text-gray-500';
            }
            
            if (pageTitle) {
                const title = pageTitle.textContent;
                if (hasUnsavedChanges && !title.includes('*')) {
                    pageTitle.textContent = title + ' *';
                } else if (!hasUnsavedChanges && title.includes('*')) {
                    pageTitle.textContent = title.replace(' *', '');
                }
            }
        },
        
        canNavigate: function(callback) {
            if (!this.hasUnsavedChanges) {
                this.log('✅ 无未保存更改，允许导航');
                callback();
                return true;
            }
            
            this.log('🛡️ 检测到未保存更改，显示保存提示');
            this.navigationCallback = callback;
            this.showDialog();
            return false;
        },
        
        saveAndContinue: function() {
            if (this.saveCallback) {
                this.log('💾 执行保存操作');
                
                const saveResult = this.saveCallback();
                
                if (saveResult && typeof saveResult.then === 'function') {
                    saveResult.then(() => {
                        this.hasUnsavedChanges = false;
                        this.log('✅ 异步保存成功，继续导航');
                        if (this.navigationCallback) {
                            this.navigationCallback();
                        }
                    }).catch((error) => {
                        this.log('❌ 保存失败：' + error.message);
                        alert('保存失败，请重试');
                    });
                } else {
                    this.hasUnsavedChanges = false;
                    this.log('✅ 同步保存完成，继续导航');
                    if (this.navigationCallback) {
                        this.navigationCallback();
                    }
                }
            } else {
                this.log('⚠️ 没有设置保存回调函数');
                if (this.navigationCallback) {
                    this.navigationCallback();
                }
            }
        },
        
        markAsSaved: function() {
            this.log('✅ 手动标记为已保存');
            
            for (const element of this.monitoredElements) {
                const currentContent = element.value || element.textContent || '';
                this.originalContent.set(element, currentContent);
            }
            
            this.hasUnsavedChanges = false;
            this.updateUnsavedIndicator(false);
        },
        
        reset: function() {
            this.log('🔄 重置未保存内容守卫状态');
            this.hasUnsavedChanges = false;
            this.originalContent.clear();
            this.monitoredElements.clear();
            this.currentFilePath = null;
            this.saveCallback = null;
            this.navigationCallback = null;
            this.updateUnsavedIndicator(false);
        },
        
        log: function(message) {
            console.log(message);
            const logArea = document.getElementById('log-area');
            if (logArea) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.textContent = `[${timestamp}] ${message}`;
                logArea.appendChild(logEntry);
                logArea.scrollTop = logArea.scrollHeight;
            }
        }
    };

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
        window.UnsavedChangesGuard.init();
        
        // 注册编辑器
        const editor = document.getElementById('editor');
        window.UnsavedChangesGuard.registerEditor(editor, 'test-document.md', function() {
            return new Promise((resolve) => {
                window.UnsavedChangesGuard.log('💾 模拟保存操作...');
                setTimeout(() => {
                    window.UnsavedChangesGuard.log('✅ 模拟保存完成');
                    resolve();
                }, 1000);
            });
        });
        
        // 绑定测试按钮事件
        document.getElementById('navigate-btn').addEventListener('click', function() {
            window.UnsavedChangesGuard.canNavigate(function() {
                window.UnsavedChangesGuard.log('🚀 页面导航成功！');
                alert('页面导航成功！（这是模拟的页面切换）');
            });
        });
        
        document.getElementById('manual-save-btn').addEventListener('click', function() {
            if (window.UnsavedChangesGuard.saveCallback) {
                window.UnsavedChangesGuard.saveAndContinue();
            } else {
                alert('没有设置保存回调函数');
            }
        });
        
        document.getElementById('reset-btn').addEventListener('click', function() {
            window.UnsavedChangesGuard.reset();
            document.getElementById('editor').value = '';
        });
        
        document.getElementById('mark-saved-btn').addEventListener('click', function() {
            window.UnsavedChangesGuard.markAsSaved();
        });
        
        window.UnsavedChangesGuard.log('🎉 测试页面初始化完成');
    });
    </script>
</body>
</html>
