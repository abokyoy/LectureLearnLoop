<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识点详情修复测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">知识点详情修复测试</h1>
        
        <!-- 测试按钮 -->
        <div class="mb-6">
            <button onclick="testKnowledgePointDetail()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                测试知识点详情显示
            </button>
        </div>
        
        <!-- 模拟知识点详情层 -->
        <div id="knowledgePointDetailLayer" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-lg max-w-4xl max-h-[90vh] w-full mx-4 flex flex-col">
                <!-- 详情头部 -->
                <div class="flex items-center justify-between p-6 border-b">
                    <div class="flex items-center">
                        <span class="material-icons-outlined text-blue-600 mr-3">psychology</span>
                        <div>
                            <h3 id="detailTitle" class="text-xl font-bold text-gray-800">测试知识点</h3>
                            <p id="detailSubject" class="text-sm text-gray-600">机器学习</p>
                        </div>
                    </div>
                    <button onclick="closeKnowledgePointDetail()" class="text-gray-500 hover:text-gray-700">
                        <span class="material-icons-outlined">close</span>
                    </button>
                </div>
                
                <!-- 详情内容 -->
                <div class="flex-1 overflow-hidden flex">
                    <!-- 左侧：基本信息和统计 -->
                    <div class="w-1/3 p-6 border-r bg-gray-50">
                        <div class="space-y-4">
                            <!-- 基本信息 -->
                            <div class="bg-white p-4 rounded-lg">
                                <h4 class="font-bold text-gray-800 mb-3">基本信息</h4>
                                <div class="space-y-2 text-sm">
                                    <p><span class="text-gray-600">描述:</span> <span id="detailDescription">这是一个测试知识点的描述</span></p>
                                    <p><span class="text-gray-600">掌握度:</span> <span id="detailMastery" class="text-yellow-500">75%</span></p>
                                </div>
                            </div>
                            
                            <!-- 统计信息 -->
                            <div class="bg-white p-4 rounded-lg">
                                <h4 class="font-bold text-gray-800 mb-3">统计信息</h4>
                                <div class="grid grid-cols-2 gap-3 text-sm">
                                    <div class="text-center p-2 bg-red-50 rounded">
                                        <div id="detailErrorCount" class="text-lg font-bold text-red-600">5 <span class="text-base font-normal">道</span></div>
                                        <div class="text-gray-600">练习记录</div>
                                    </div>
                                    <div class="text-center p-2 bg-yellow-50 rounded">
                                        <div id="detailFavoriteCount" class="text-lg font-bold text-yellow-600">2 <span class="text-base font-normal">道</span></div>
                                        <div class="text-gray-600">收藏题目</div>
                                    </div>
                                    <div class="text-center p-2 bg-green-50 rounded">
                                        <div id="detailNotesCount" class="text-lg font-bold text-green-600">3 <span class="text-base font-normal">篇</span></div>
                                        <div class="text-gray-600">关联笔记</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 右侧：详细内容 -->
                    <div class="flex-1 flex flex-col">
                        <!-- 标签页 -->
                        <div class="flex border-b">
                            <button class="px-4 py-2 border-b-2 border-blue-500 text-blue-600 font-semibold">关联题目</button>
                            <button class="px-4 py-2 text-gray-600 hover:text-gray-800">关联笔记</button>
                        </div>
                        
                        <!-- 内容区域 -->
                        <div class="flex-1 overflow-y-auto p-6">
                            <div id="detailQuestions" class="space-y-4">
                                <!-- 题目将在这里显示 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 测试结果 -->
        <div id="testResult" class="mt-6"></div>
    </div>

    <script>
        // 模拟题目数据
        const mockQuestions = [
            {
                content: "1. 原题：\n如果在训练过程中观察到损失值居高不下且难以下降，可能是以下哪些因素导致的？\n选项：A) 学习率过高 B) 学习率过低 C) 数据质量差 D) 模型复杂度不足",
                type: "选择题",
                practice_count: 5,
                last_result: false,
                last_practice_time: "2025-09-16 09:25:35",
                is_favorite: false,
                mastery_level: 2
            },
            {
                content: "在模型训练过程中，通常通过____来评估模型参数的好坏。",
                type: "填空题",
                practice_count: 3,
                last_result: true,
                last_practice_time: "2025-09-16 06:34:05",
                is_favorite: true,
                mastery_level: 4
            }
        ];

        function testKnowledgePointDetail() {
            // 显示详情层
            document.getElementById('knowledgePointDetailLayer').classList.remove('hidden');
            
            // 加载题目
            loadKnowledgePointQuestions();
            
            document.getElementById('testResult').innerHTML = '<div class="bg-green-50 border border-green-200 rounded-lg p-4"><p class="text-green-800">✅ 知识点详情层已打开，正在测试题目格式化...</p></div>';
        }

        function closeKnowledgePointDetail() {
            document.getElementById('knowledgePointDetailLayer').classList.add('hidden');
            document.getElementById('testResult').innerHTML = '<div class="bg-blue-50 border border-blue-200 rounded-lg p-4"><p class="text-blue-800">ℹ️ 知识点详情层已关闭</p></div>';
        }

        async function loadKnowledgePointQuestions() {
            const questionsContainer = document.getElementById('detailQuestions');
            questionsContainer.innerHTML = '<div class="text-gray-600 text-center py-8">正在加载关联题目...</div>';
            
            try {
                // 模拟API调用延迟
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // 模拟成功响应
                const result = {
                    success: true,
                    questions: mockQuestions
                };
                
                if (result.success && result.questions && result.questions.length > 0) {
                    // 题目类型颜色
                    const typeColors = {
                        '选择题': 'bg-blue-100 text-blue-800',
                        '填空题': 'bg-green-100 text-green-800',
                        '判断题': 'bg-purple-100 text-purple-800',
                        '简答题': 'bg-orange-100 text-orange-800'
                    };
                    
                    const questionsHtml = result.questions.map((question, index) => {
                        const realId = '3'; // 模拟知识点ID
                        
                        // 熟练度星星
                        const stars = '★'.repeat(question.mastery_level) + '☆'.repeat(5 - question.mastery_level);
                        
                        // 最后答题结果
                        const resultText = question.last_result ? '正确' : '错误';
                        const resultColor = question.last_result ? 'text-green-600' : 'text-red-600';
                        
                        // 收藏图标
                        const favoriteIcon = question.is_favorite ? 'star' : 'star_border';
                        const favoriteColor = question.is_favorite ? 'text-yellow-500' : 'text-gray-600';
                        
                        // 格式化题目内容（安全调用）
                        const formattedContent = (typeof formatQuestionContent === 'function') 
                            ? formatQuestionContent(question.content) 
                            : question.content.replace(/\n/g, '<br>');
                        
                        return `
                            <div class="p-4 border border-gray-200 rounded-lg hover:border-green-500 transition-colors">
                                <!-- 题目头部 -->
                                <div class="flex items-start justify-between mb-3">
                                    <div class="flex-1 mr-4">
                                        <div class="flex items-center mb-2">
                                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-1 rounded-full mr-2">题目 ${index + 1}</span>
                                            <span class="${typeColors[question.type] || 'bg-gray-100 text-gray-800'} text-xs px-2 py-1 rounded">${question.type}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-1">
                                        <button class="p-1.5 rounded-full hover:bg-gray-100 text-gray-600" onclick="viewQuestion('${realId}', '${question.content.replace(/'/g, "\\'")}');" title="查看题目">
                                            <span class="material-icons-outlined text-sm">visibility</span>
                                        </button>
                                        <button class="p-1.5 rounded-full hover:bg-gray-100 text-gray-600" onclick="editQuestion('${realId}', '${question.content.replace(/'/g, "\\'")}');" title="编辑题目">
                                            <span class="material-icons-outlined text-sm">edit</span>
                                        </button>
                                        <button class="p-1.5 rounded-full hover:bg-gray-100 ${favoriteColor}" onclick="toggleFavorite('${realId}', '${question.content.replace(/'/g, "\\'")}');" title="${question.is_favorite ? '取消收藏' : '收藏题目'}">
                                            <span class="material-icons-outlined text-sm">${favoriteIcon}</span>
                                        </button>
                                    </div>
                                </div>
                                
                                <!-- 题目内容 -->
                                <div class="mb-3">
                                    <div class="text-gray-800 leading-relaxed">${formattedContent}</div>
                                </div>
                                
                                <!-- 题目统计信息 -->
                                <div class="flex flex-wrap items-center gap-4 text-sm text-gray-600 pt-3 border-t border-gray-100">
                                    <div class="flex items-center">
                                        <span class="material-icons-outlined text-sm mr-1">grade</span>
                                        <span>熟练度: <span class="text-yellow-500">${stars}</span></span>
                                    </div>
                                    <div class="flex items-center">
                                        <span class="material-icons-outlined text-sm mr-1">history</span>
                                        <span>上次: <span class="${resultColor}">${resultText}</span></span>
                                    </div>
                                    <div class="flex items-center">
                                        <span class="material-icons-outlined text-sm mr-1">repeat</span>
                                        <span>练习: ${question.practice_count}次</span>
                                    </div>
                                    <div class="flex items-center">
                                        <span class="material-icons-outlined text-sm mr-1">schedule</span>
                                        <span>${question.last_practice_time}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    questionsContainer.innerHTML = questionsHtml;
                    
                    document.getElementById('testResult').innerHTML = '<div class="bg-green-50 border border-green-200 rounded-lg p-4"><p class="text-green-800">✅ 题目加载成功！格式化正常工作</p></div>';
                } else {
                    questionsContainer.innerHTML = '<div class="text-gray-600 text-center py-8">暂无关联题目</div>';
                }
            } catch (error) {
                console.error('加载题目失败:', error);
                questionsContainer.innerHTML = '<div class="text-red-600 text-center py-8">加载题目失败</div>';
                document.getElementById('testResult').innerHTML = `<div class="bg-red-50 border border-red-200 rounded-lg p-4"><p class="text-red-800">❌ 测试失败: ${error.message}</p></div>`;
            }
        }

        // 格式化题目内容
        function formatQuestionContent(content) {
            if (!content) return '题目内容为空';
            
            // 处理换行和格式
            let formatted = content
                .replace(/\n/g, '<br>')  // 换行转为<br>
                .replace(/\r/g, '')      // 移除回车符
                .trim();
            
            // 检测并格式化选择题
            if (formatted.includes('选项：') || formatted.includes('A)') || formatted.includes('A.')) {
                formatted = formatMultipleChoice(formatted);
            }
            
            // 检测并格式化填空题
            if (formatted.includes('____') || formatted.includes('___')) {
                formatted = formatFillInBlank(formatted);
            }
            
            return formatted;
        }

        // 格式化选择题
        function formatMultipleChoice(content) {
            // 分离题目和选项
            let parts = content.split(/选项：|选项:/);
            if (parts.length < 2) {
                // 尝试其他分割方式
                parts = content.split(/(?=A[\.\)])/);
            }
            
            if (parts.length >= 2) {
                const question = parts[0].trim();
                const options = parts.slice(1).join('').trim();
                
                // 格式化选项
                const formattedOptions = options
                    .replace(/([A-D][\.\)])/g, '<br><strong>$1</strong>')
                    .replace(/^<br>/, ''); // 移除开头的<br>
                
                return `
                    <div class="mb-3">
                        <div class="font-medium text-gray-900 mb-2">${question}</div>
                        <div class="ml-4 text-gray-700 leading-relaxed">${formattedOptions}</div>
                    </div>
                `;
            }
            
            return content;
        }

        // 格式化填空题
        function formatFillInBlank(content) {
            return content.replace(/_{3,}/g, '<span class="inline-block bg-blue-100 text-blue-800 px-2 py-1 rounded mx-1 min-w-[60px] text-center">____</span>');
        }

        // 模拟操作函数
        function viewQuestion(id, content) {
            alert(`查看题目 (ID: ${id})\n内容: ${content.substring(0, 50)}...`);
        }

        function editQuestion(id, content) {
            alert(`编辑题目 (ID: ${id})\n内容: ${content.substring(0, 50)}...`);
        }

        function toggleFavorite(id, content) {
            alert(`切换收藏状态 (ID: ${id})\n内容: ${content.substring(0, 50)}...`);
        }
    </script>
</body>
</html>
