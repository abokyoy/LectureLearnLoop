<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- D3.js for mindmap visualization -->

</head>
<body class="bg-gray-100">

                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">Python编程</h3>
                    <div class="flex items-center justify-center space-x-2 text-sm text-gray-600">

                    </div>
                </div>
            </div>

            <!-- 大语言模型 -->
            <div class="subject-card bg-white rounded-xl border-2 border-gray-200 hover:border-purple-400 hover:shadow-lg cursor-pointer transition-all duration-300 p-6" 
                 data-subject="大语言模型" onclick="selectSubject('大语言模型')">
                <div class="text-center">
                    <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-icons-outlined text-2xl text-purple-600">psychology</span>

                    <div class="flex items-center justify-center space-x-2 text-sm text-gray-600">

                    </div>

                        <span class="inline-flex items-center text-sm text-green-600 font-medium">

                        </span>
                    </div>
                </div>
            </div>

            <!-- 机器学习 -->
            <div class="subject-card bg-white rounded-xl border-2 border-gray-200 hover:border-orange-400 hover:shadow-lg cursor-pointer transition-all duration-300 p-6"

                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <span class="inline-flex items-center text-sm text-orange-600 font-medium">

<!-- 知识脑图页面 -->
<div id="mindmapPage" class="min-h-screen p-8 hidden">
    <div class="max-w-6xl mx-auto">
        <!-- 头部 -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-4">
                <button onclick="backToSubjects()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                    ← 返回
                </button>
                <h1 id="mindmapTitle" class="text-2xl font-bold text-gray-800">知识脑图</h1>
            </div>
        </div>

        <!-- 脑图容器 -->
        <div class="bg-white rounded-lg shadow-lg p-4 min-h-96 relative">
            <!-- 脑图工具栏 -->
            <div class="flex items-center justify-between mb-4 pb-2 border-b">
                <div class="flex items-center space-x-4">
                    <input type="text" id="searchInput" placeholder="搜索知识点..." 
                           class="px-3 py-1 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="searchNodes()" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">搜索</button>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="zoomIn()" class="bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded text-sm">放大</button>
                    <button onclick="zoomOut()" class="bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded text-sm">缩小</button>
                    <button onclick="resetView()" class="bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded text-sm">重置</button>
                </div>
            </div>
            
            <!-- 脑图SVG -->
            <div id="mindmapContainer" class="w-full" style="height: 500px;">
                <svg id="mindmapSvg" width="100%" height="100%"></svg>
            </div>
            
            <!-- 加载状态 -->
            <div id="loadingState" class="absolute inset-0 bg-white bg-opacity-90 flex items-center justify-center hidden">
                <div class="text-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mx-auto mb-4"></div>
                    <p class="text-gray-600">正在生成知识脑图...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 简单直接的日志函数
function log(message) {
    const timestamp = new Date().toLocaleTimeString();
    const logMessage = `[${timestamp}] ${message}`;
    
    console.log(logMessage);
    
    const debugLog = document.getElementById('debugLog');
    if (debugLog) {
        if (debugLog.innerHTML.includes('等待操作...')) {
            debugLog.innerHTML = '';
        }
        
        const logDiv = document.createElement('div');
        logDiv.className = 'text-green-400 mb-1';
        logDiv.textContent = logMessage;
        debugLog.appendChild(logDiv);
        
        debugLog.scrollTop = debugLog.scrollHeight;
    }
    
    // 记录到后端
    if (window.bridge && window.bridge.logFrontendMessage) {
        try {
            window.bridge.logFrontendMessage(logMessage);
        } catch (e) {
            console.error('后端日志记录失败:', e);
        }
    }
}

// 清空日志
function clearLog() {
    const debugLog = document.getElementById('debugLog');
    if (debugLog) {
        debugLog.innerHTML = '<div class="text-blue-400">日志已清空...</div>';
    }
}

// 选择学科
function selectSubject(subjectName) {
    log(`🎯 点击了学科: ${subjectName}`);
    
    // 隐藏学科选择页面
    document.getElementById('subjectSelectionPage').classList.add('hidden');
    
    // 显示脑图页面
    document.getElementById('mindmapPage').classList.remove('hidden');
    
    // 更新标题
    document.getElementById('mindmapTitle').textContent = `${subjectName} - 知识脑图`;
    
    log(`✅ 已进入 ${subjectName} 脑图页面`);
    
    // 调用后端API生成脑图
    generateMindmap(subjectName);
}

// 返回学科选择
function backToSubjects() {
    log('🔙 返回学科选择页面');
    
    document.getElementById('mindmapPage').classList.add('hidden');
    document.getElementById('subjectSelectionPage').classList.remove('hidden');
    
    log('✅ 已返回学科选择页面');
}

// 全局变量
let currentMindmapData = null;
let svg = null;
let g = null;
let zoom = null;
let simulation = null;

// 生成脑图
async function generateMindmap(subjectName) {
    log(`🧠 开始生成 ${subjectName} 的知识脑图`);
    showLoading();
    
    try {
        if (window.bridge && window.bridge.getOrGenerateMindmap) {
            log(`📡 调用后端API获取脑图数据...`);
            const response = await window.bridge.getOrGenerateMindmap(subjectName);
            log(`📡 API响应: ${response.substring(0, 200)}...`);
            
            const result = JSON.parse(response);
            
            if (result.success && result.mindmap && result.mindmap.data) {
                log(`✅ 使用真实LLM生成的脑图数据`);
                log(`📊 节点数: ${result.mindmap.data.nodes?.length || 0}`);
                log(`🔗 连线数: ${result.mindmap.data.edges?.length || 0}`);
                
                currentMindmapData = result.mindmap.data;
                
                // 验证数据格式
                if (validateMindmapData(currentMindmapData)) {
                    renderMindmap();
                } else {
                    log(`⚠️ 真实数据格式有问题，使用修复后的数据`);
                    currentMindmapData = fixMindmapData(currentMindmapData, subjectName);
                    renderMindmap();
                }
            } else {
                log(`❌ 脑图生成失败: ${result.error || '数据格式错误'}`);
                log(`🔄 回退到模拟数据`);
                showMockMindmap(subjectName);
            }
        } else {
            log('⚠️ 后端API不可用，显示模拟脑图');
            showMockMindmap(subjectName);
        }
    } catch (error) {
        log(`❌ 生成脑图时出错: ${error.message}`);
        log(`🔄 回退到模拟数据`);
        showMockMindmap(subjectName);
    }
    
    hideLoading();
}

// 验证脑图数据格式
function validateMindmapData(data) {
    if (!data || !data.nodes || !Array.isArray(data.nodes)) {
        log('❌ 缺少nodes数组');
        return false;
    }
    
    if (data.nodes.length === 0) {
        log('❌ nodes数组为空');
        return false;
    }
    
    // 检查节点格式
    for (let node of data.nodes) {
        if (!node.id || !node.name) {
            log(`❌ 节点缺少必要字段: ${JSON.stringify(node)}`);
            return false;
        }
    }
    
    log('✅ 脑图数据格式验证通过');
    return true;
}

// 修复脑图数据
function fixMindmapData(data, subjectName) {
    log('🔧 开始修复脑图数据');
    
    const fixedData = {
        nodes: [],
        edges: []
    };
    
    // 添加中心节点
    fixedData.nodes.push({
        id: 'center',
        name: subjectName,
        type: 'center',
        x: 400,
        y: 250
    });
    
    // 处理原始节点
    if (data.nodes && Array.isArray(data.nodes)) {
        data.nodes.forEach((node, index) => {
            const fixedNode = {
                id: node.id || `node_${index}`,
                name: node.name || `节点${index + 1}`,
                type: node.type || 'knowledge_point',
                x: node.x || Math.random() * 600 + 100,
                y: node.y || Math.random() * 400 + 100
            };
            fixedData.nodes.push(fixedNode);
            
            // 连接到中心节点
            fixedData.edges.push({
                source: 'center',
                target: fixedNode.id
            });
        });
    }
    
    // 处理原始连线
    if (data.edges && Array.isArray(data.edges)) {
        data.edges.forEach(edge => {
            if (edge.source && edge.target) {
                fixedData.edges.push({
                    source: edge.source,
                    target: edge.target
                });
            }
        });
    }
    
    log(`🔧 修复完成: ${fixedData.nodes.length}个节点, ${fixedData.edges.length}条连线`);
    return fixedData;
}

// 显示模拟脑图
function showMockMindmap(subjectName) {
    log('📊 显示模拟脑图数据');
    
    // 创建模拟数据
    const mockData = {
        nodes: [
            { id: 'center', name: subjectName, type: 'center', x: 400, y: 250 },
            { id: 'node1', name: '基础概念', type: 'category', x: 200, y: 150 },
            { id: 'node2', name: '核心算法', type: 'category', x: 600, y: 150 },
            { id: 'node3', name: '实践应用', type: 'category', x: 200, y: 350 },
            { id: 'node4', name: '高级技巧', type: 'category', x: 600, y: 350 },
            { id: 'kp1', name: '数据类型', type: 'knowledge_point', x: 100, y: 100 },
            { id: 'kp2', name: '变量作用域', type: 'knowledge_point', x: 300, y: 100 },
            { id: 'kp3', name: '排序算法', type: 'knowledge_point', x: 500, y: 100 },
            { id: 'kp4', name: '搜索算法', type: 'knowledge_point', x: 700, y: 100 }
        ],
        edges: [
            { source: 'center', target: 'node1' },
            { source: 'center', target: 'node2' },
            { source: 'center', target: 'node3' },
            { source: 'center', target: 'node4' },
            { source: 'node1', target: 'kp1' },
            { source: 'node1', target: 'kp2' },
            { source: 'node2', target: 'kp3' },
            { source: 'node2', target: 'kp4' }
        ]
    };
    
    currentMindmapData = mockData;
    renderMindmap();
}

// 渲染脑图
function renderMindmap() {
    if (!currentMindmapData || !currentMindmapData.nodes) {
        log('❌ 脑图数据无效');
        return;
    }
    
    log(`📊 开始渲染脑图，节点数: ${currentMindmapData.nodes.length}`);
    
    // 初始化SVG
    initSvg();
    
    const nodes = currentMindmapData.nodes.map(d => ({...d}));
    const edges = currentMindmapData.edges || [];
    
    // 清空之前的内容
    g.selectAll('*').remove();
    
    // 创建力导向图
    simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(edges).id(d => d.id).distance(100))
        .force('charge', d3.forceManyBody().strength(-300))
        .force('center', d3.forceCenter(400, 250))
        .force('collision', d3.forceCollide().radius(40));
    
    // 绘制连线
    const links = g.append('g')
        .selectAll('line')
        .data(edges)
        .enter().append('line')
        .attr('stroke', '#999')
        .attr('stroke-opacity', 0.6)
        .attr('stroke-width', 2);
    
    // 绘制节点组
    const nodeGroups = g.append('g')
        .selectAll('g')
        .data(nodes)
        .enter().append('g')
        .attr('class', 'node-group')
        .style('cursor', 'pointer')
        .call(d3.drag()
            .on('start', dragstarted)
            .on('drag', dragged)
            .on('end', dragended));
    
    // 节点圆圈
    nodeGroups.append('circle')
        .attr('r', d => d.type === 'center' ? 30 : d.type === 'category' ? 25 : 20)
        .attr('fill', d => {
            if (d.type === 'center') return '#3B82F6';
            if (d.type === 'category') return '#10B981';
            return '#F59E0B';
        })
        .attr('stroke', '#fff')
        .attr('stroke-width', 2);
    
    // 节点文本
    nodeGroups.append('text')
        .attr('dy', '.35em')
        .attr('text-anchor', 'middle')
        .style('fill', 'white')
        .style('font-size', d => d.type === 'center' ? '14px' : '12px')
        .style('font-weight', 'bold')
        .text(d => d.name.length > 6 ? d.name.substring(0, 6) + '...' : d.name);
    
    // 节点点击事件
    nodeGroups.on('click', (event, d) => {
        log(`🔍 点击了节点: ${d.name} (${d.type})`);
        if (d.type === 'knowledge_point') {
            showKnowledgePointDetail(d);
        }
    });
    
    // 更新位置
    simulation.on('tick', () => {
        links
            .attr('x1', d => d.source.x)
            .attr('y1', d => d.source.y)
            .attr('x2', d => d.target.x)
            .attr('y2', d => d.target.y);
        
        nodeGroups
            .attr('transform', d => `translate(${d.x},${d.y})`);
    });
    
    log('✅ 脑图渲染完成');
}

// 初始化SVG
function initSvg() {
    if (svg) return;
    
    svg = d3.select('#mindmapSvg');
    g = svg.append('g');
    
    // 初始化缩放
    zoom = d3.zoom()
        .scaleExtent([0.1, 3])
        .on('zoom', (event) => {
            g.attr('transform', event.transform);
        });
    
    svg.call(zoom);
}

// 拖拽函数
function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
}

function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
}

function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
}

// 显示知识点详情
async function showKnowledgePointDetail(node) {
    log(`🔍 获取知识点详情: ${node.name} (ID: ${node.id})`);
    
    try {
        if (window.bridge && window.bridge.getKnowledgePointDetail && node.type === 'knowledge_point') {
            // 提取真实的知识点ID（去掉kp_前缀）
            const realId = node.id.startsWith('kp_') ? node.id.substring(3) : node.id;
            
            const response = await window.bridge.getKnowledgePointDetail(realId);
            const result = JSON.parse(response);
            
            if (result.success && result.detail) {
                const detail = result.detail;
                alert(`知识点详情：\n名称：${detail.name || node.name}\n描述：${detail.description || '暂无描述'}\n掌握度：${detail.mastery_score || 0}%\n来源：${detail.source || '未知'}`);
                log(`✅ 成功获取知识点详情`);
            } else {
                alert(`知识点详情：\n名称：${node.name}\n类型：${node.type}\nID：${node.id}\n\n⚠️ 无法获取详细信息: ${result.error || '数据不存在'}`);
                log(`⚠️ 获取详情失败: ${result.error}`);
            }
        } else {
            // 显示基本信息
            alert(`节点信息：\n名称：${node.name}\n类型：${node.type}\nID：${node.id}`);
            log(`ℹ️ 显示基本节点信息`);
        }
    } catch (error) {
        log(`❌ 获取知识点详情失败: ${error.message}`);
        alert(`知识点详情：\n名称：${node.name}\n类型：${node.type}\nID：${node.id}\n\n❌ 获取详情时出错: ${error.message}`);
    }
}

// 脑图工具函数
function showLoading() {
    document.getElementById('loadingState').classList.remove('hidden');
}

function hideLoading() {
    document.getElementById('loadingState').classList.add('hidden');
}

function zoomIn() {
    if (svg && zoom) {
        svg.transition().call(zoom.scaleBy, 1.5);
        log('🔍 放大脑图');
    }
}

function zoomOut() {
    if (svg && zoom) {
        svg.transition().call(zoom.scaleBy, 1 / 1.5);
        log('🔍 缩小脑图');
    }
}

function resetView() {
    if (svg && zoom) {
        svg.transition().call(zoom.transform, d3.zoomIdentity);
        log('🔍 重置脑图视图');
    }
}

function searchNodes() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) {
        log('⚠️ 请输入搜索关键词');
        return;
    }
    
    log(`🔍 搜索节点: ${query}`);
    
    if (g) {
        // 重置所有节点样式
        g.selectAll('.node-group circle')
            .attr('stroke', '#fff')
            .attr('stroke-width', 2);
        
        // 高亮匹配的节点
        g.selectAll('.node-group')
            .each(function(d) {
                const circle = d3.select(this).select('circle');
                if (d.name.toLowerCase().includes(query.toLowerCase())) {
                    circle.attr('stroke', '#F59E0B').attr('stroke-width', 4);
                    log(`✅ 找到匹配节点: ${d.name}`);
                }
            });
    }
}

// 页面加载完成
document.addEventListener('DOMContentLoaded', function() {
    log('🚀 页面加载完成');
    log('📋 检查环境...');
    log(`- window.bridge: ${window.bridge ? '可用' : '不可用'}`);
    log(`- 学科卡片数量: ${document.querySelectorAll('.subject-card').length}`);
    log('✅ 初始化完成，请点击学科卡片');
});
