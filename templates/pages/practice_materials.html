<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识脑图练习</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <!-- D3.js for mindmap visualization -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body class="bg-gray-100">

<!-- 学科选择页面 -->
<div id="subjectSelectionPage" class="min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <!-- 标题 -->

        <!-- 学科卡片 -->

            <div class="subject-card bg-white rounded-xl border-2 border-gray-200 hover:border-blue-400 hover:shadow-lg cursor-pointer transition-all duration-300 p-6" 
                 data-subject="Python编程" onclick="selectSubject('Python编程')">
                <div class="text-center">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-icons-outlined text-2xl text-blue-600">code</span>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">Python编程</h3>
                    <div class="flex items-center justify-center space-x-2 text-sm text-gray-600">

                        <span>4 个知识点</span>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <span class="inline-flex items-center text-sm text-blue-600 font-medium">

                            <span class="material-icons-outlined ml-1 text-sm">arrow_forward</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- 大语言模型 -->
            <div class="subject-card bg-white rounded-xl border-2 border-gray-200 hover:border-purple-400 hover:shadow-lg cursor-pointer transition-all duration-300 p-6" 
                 data-subject="大语言模型" onclick="selectSubject('大语言模型')">
                <div class="text-center">
                    <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-icons-outlined text-2xl text-purple-600">psychology</span>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">大语言模型</h3>
                    <div class="flex items-center justify-center space-x-2 text-sm text-gray-600">
                        <span class="material-icons-outlined text-sm">lightbulb</span>
                        <span>4 个知识点</span>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <span class="inline-flex items-center text-sm text-purple-600 font-medium">
                            点击进入脑图

                </div>
            </div>

            <!-- 数据结构 -->
            <div class="subject-card bg-white rounded-xl border-2 border-gray-200 hover:border-green-400 hover:shadow-lg cursor-pointer transition-all duration-300 p-6" 
                 data-subject="数据结构" onclick="selectSubject('数据结构')">
                <div class="text-center">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-icons-outlined text-2xl text-green-600">account_tree</span>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">数据结构</h3>
                    <div class="flex items-center justify-center space-x-2 text-sm text-gray-600">
                        <span class="material-icons-outlined text-sm">lightbulb</span>
                        <span>11 个知识点</span>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <span class="inline-flex items-center text-sm text-green-600 font-medium">
                            点击进入脑图

                        </span>
                    </div>
                </div>
            </div>

            <!-- 机器学习 -->
            <div class="subject-card bg-white rounded-xl border-2 border-gray-200 hover:border-orange-400 hover:shadow-lg cursor-pointer transition-all duration-300 p-6" 
                 data-subject="机器学习" onclick="selectSubject('机器学习')">
                <div class="text-center">
                    <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-icons-outlined text-2xl text-orange-600">smart_toy</span>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">机器学习</h3>
                    <div class="flex items-center justify-center space-x-2 text-sm text-gray-600">
                        <span class="material-icons-outlined text-sm">lightbulb</span>
                        <span>25 个知识点</span>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <span class="inline-flex items-center text-sm text-orange-600 font-medium">
                            点击进入脑图
                            <span class="material-icons-outlined ml-1 text-sm">arrow_forward</span>
                        </span>

                </div>
            </div>

        <!-- 调试面板 -->
        <div class="bg-gray-900 text-green-400 rounded-lg p-4 font-mono text-sm">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-green-300 font-bold">🖥️ 调试日志</h3>
                <button onclick="clearLog()" class="bg-red-600 text-white px-3 py-1 rounded text-xs">清空</button>
            </div>
            <div id="debugLog" class="max-h-64 overflow-y-auto">

</div>

<!-- 知识脑图页面 -->
<div id="mindmapPage" class="min-h-screen p-8 hidden">
    <div class="max-w-7xl mx-auto">
        <!-- 头部 -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center space-x-4">
                <button onclick="backToSubjects()" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                    ← 返回
                </button>
                <h1 id="mindmapTitle" class="text-2xl font-bold text-gray-800">知识脑图</h1>
                <div id="cacheStatus" class="text-sm text-gray-600"></div>
            </div>
            <div class="flex items-center space-x-2">
                <!-- 刷新缓存按钮 -->
                <button id="refreshCacheBtn" onclick="refreshMindmapCache()" 
                        class="bg-orange-500 text-white px-3 py-2 rounded-lg hover:bg-orange-600 transition-colors flex items-center space-x-1">
                    <span class="material-icons-outlined text-sm">refresh</span>
                    <span>刷新</span>
                </button>
                <!-- 全屏按钮 -->
                <button id="fullscreenBtn" onclick="toggleFullscreen()" 
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors flex items-center space-x-2">
                    <span class="material-icons-outlined text-lg">fullscreen</span>
                    <span>全屏</span>
                </button>
            </div>
        </div>

        <!-- 脑图容器 -->
        <div id="mindmapContainer" class="bg-white rounded-lg shadow-lg p-4 relative" style="min-height: 700px;">
            <!-- 脑图工具栏 -->
            <div class="flex items-center justify-between mb-4 pb-2 border-b">
                <div class="flex items-center space-x-4">
                    <input type="text" id="searchInput" placeholder="搜索知识点..." 
                           class="px-3 py-1 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="searchNodes()" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">搜索</button>
                    <div class="text-xs text-gray-500 flex items-center space-x-1">
                        <span>💡</span>
                        <span>点击</span>
                        <div class="w-3 h-3 bg-blue-500 rounded-full"></div>
                        <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                        <span>筛选子节点</span>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="clearFilterBtn" onclick="restoreAllNodes()" 
                            class="bg-purple-500 text-white px-3 py-1 rounded text-sm hover:bg-purple-600 hidden">
                        清除筛选
                    </button>
                    <button onclick="zoomIn()" class="bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded text-sm">放大</button>
                    <button onclick="zoomOut()" class="bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded text-sm">缩小</button>
                    <button onclick="resetView()" class="bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded text-sm">重置</button>
                    <!-- 全屏模式下的退出按钮 -->
                    <button id="exitFullscreenBtn" onclick="exitFullscreen()" 
                            class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 hidden">
                        <span class="material-icons-outlined text-sm">fullscreen_exit</span>
                    </button>
                </div>
            </div>
            
            <!-- 脑图SVG -->
            <div id="mindmapSvgContainer" class="w-full" style="height: 600px;">
                <svg id="mindmapSvg" width="100%" height="100%"></svg>
            </div>
            
            <!-- 加载状态 -->
            <div id="loadingState" class="absolute inset-0 bg-white bg-opacity-90 flex items-center justify-center hidden">
                <div class="text-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500 mx-auto mb-4"></div>
                    <p class="text-gray-600">正在生成知识脑图...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 全屏模式样式 -->
<style>
.fullscreen-mode {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    z-index: 9999 !important;
    background: white !important;
    padding: 20px !important;
    margin: 0 !important;
    max-width: none !important;
}

.fullscreen-mode #mindmapSvgContainer {
    height: calc(100vh - 140px) !important;
}

.fullscreen-mode .max-w-7xl {
    max-width: none !important;
}

/* 关系文字样式 */
.link-label {
    font-family: 'Arial', sans-serif;
    text-shadow: 1px 1px 3px rgba(255,255,255,0.8), -1px -1px 3px rgba(255,255,255,0.8);
    pointer-events: none; /* 防止文字阻挡鼠标事件 */
}

/* 箭头样式 */
marker path {
    stroke: #666;
    stroke-width: 1;
}
</style>

<script>
// 全局变量
let currentSubjectName = '';
let filteredNodeId = null; // 当前筛选的节点ID
let originalNodesVisibility = new Map(); // 保存原始节点可见性状态

// 简单直接的日志函数
function log(message) {
    const timestamp = new Date().toLocaleTimeString();
    const logMessage = `[${timestamp}] ${message}`;
    
    console.log(logMessage);
    
    const debugLog = document.getElementById('debugLog');
    if (debugLog) {
        if (debugLog.innerHTML.includes('等待操作...')) {
            debugLog.innerHTML = '';
        }
        
        const logDiv = document.createElement('div');
        logDiv.className = 'text-green-400 mb-1';
        logDiv.textContent = logMessage;
        debugLog.appendChild(logDiv);
        
        debugLog.scrollTop = debugLog.scrollHeight;
    }
    
    // 记录到后端
    if (window.bridge && window.bridge.logFrontendMessage) {
        try {
            window.bridge.logFrontendMessage(logMessage);
        } catch (e) {
            console.error('后端日志记录失败:', e);
        }
    }
}

// 清空日志
function clearLog() {
    const debugLog = document.getElementById('debugLog');
    if (debugLog) {
        debugLog.innerHTML = '<div class="text-blue-400">日志已清空...</div>';
    }
}

// 选择学科
function selectSubject(subjectName) {
    log(`🎯 点击了学科: ${subjectName}`);
    
    // 设置全局变量
    currentSubjectName = subjectName;
    
    // 隐藏学科选择页面
    document.getElementById('subjectSelectionPage').classList.add('hidden');
    
    // 显示脑图页面
    document.getElementById('mindmapPage').classList.remove('hidden');
    
    // 更新标题
    document.getElementById('mindmapTitle').textContent = `${subjectName} - 知识脑图`;
    
    log(`✅ 已进入 ${subjectName} 脑图页面`);
    
    // 调用后端API生成脑图
    generateMindmap(subjectName);
}

// 返回学科选择
function backToSubjects() {
    log('🔙 返回学科选择页面');
    
    document.getElementById('mindmapPage').classList.add('hidden');
    document.getElementById('subjectSelectionPage').classList.remove('hidden');
    
    log('✅ 已返回学科选择页面');
}

// 全局变量
let currentMindmapData = null;
let svg = null;
let g = null;
let zoom = null;
let simulation = null;

// 生成脑图
async function generateMindmap(subjectName) {
    log(`🧠 开始生成 ${subjectName} 的知识脑图`);
    showLoading();
    
    try {
        if (window.bridge && window.bridge.getOrGenerateMindmap) {
            log(`📡 调用后端API获取脑图数据...`);
            const response = await window.bridge.getOrGenerateMindmap(subjectName);
            log(`📡 API响应: ${response.substring(0, 200)}...`);
            
            const result = JSON.parse(response);
            
            if (result.success && result.mindmap && result.mindmap.data) {
                // 显示缓存状态
                const cacheStatus = result.mindmap.cache_status || 'unknown';
                const cacheStatusElement = document.getElementById('cacheStatus');
                
                if (cacheStatus === 'from_cache') {
                    log(`💾 使用缓存的脑图数据`);
                    log(`📅 缓存时间: ${result.mindmap.updated_time || 'unknown'}`);
                    log(`🔢 版本: ${result.mindmap.version || 1}`);
                    cacheStatusElement.innerHTML = `<span class="text-green-600">💾 缓存数据</span> | 版本: ${result.mindmap.version || 1}`;
                } else if (cacheStatus === 'newly_generated') {
                    log(`🆕 使用新生成的脑图数据`);
                    log(`🤖 LLM生成完成并已缓存`);
                    cacheStatusElement.innerHTML = `<span class="text-blue-600">🆕 新生成</span> | 已缓存`;
                } else {
                    log(`✅ 使用真实脑图数据`);
                    cacheStatusElement.innerHTML = `<span class="text-gray-600">✅ 数据加载</span>`;
                }
                
                log(`📊 节点数: ${result.mindmap.data.nodes?.length || 0}`);
                log(`🔗 连线数: ${result.mindmap.data.edges?.length || 0}`);
                
                currentMindmapData = result.mindmap.data;
                
                // 验证数据格式
                if (validateMindmapData(currentMindmapData)) {
                    renderMindmap();
                } else {
                    log(`⚠️ 真实数据格式有问题，使用修复后的数据`);
                    currentMindmapData = fixMindmapData(currentMindmapData, subjectName);
                    renderMindmap();
                }
            } else {
                log(`❌ 脑图生成失败: ${result.error || '数据格式错误'}`);
                log(`🔄 回退到模拟数据`);
                showMockMindmap(subjectName);
            }
        } else {
            log('⚠️ 后端API不可用，显示模拟脑图');
            showMockMindmap(subjectName);
        }
    } catch (error) {
        log(`❌ 生成脑图时出错: ${error.message}`);
        log(`🔄 回退到模拟数据`);
        showMockMindmap(subjectName);
    }
    
    hideLoading();
}

// 验证脑图数据格式
function validateMindmapData(data) {
    if (!data || !data.nodes || !Array.isArray(data.nodes)) {
        log('❌ 缺少nodes数组');
        return false;
    }
    
    if (data.nodes.length === 0) {
        log('❌ nodes数组为空');
        return false;
    }
    
    // 检查节点格式
    for (let node of data.nodes) {
        if (!node.id || !node.name) {
            log(`❌ 节点缺少必要字段: ${JSON.stringify(node)}`);
            return false;
        }
    }
    
    log('✅ 脑图数据格式验证通过');
    return true;
}

// 修复脑图数据
function fixMindmapData(data, subjectName) {
    log('🔧 开始修复脑图数据');
    
    const fixedData = {
        nodes: [],
        edges: []
    };
    
    // 添加中心节点
    fixedData.nodes.push({
        id: 'center',
        name: subjectName,
        type: 'center',
        x: 400,
        y: 250
    });
    
    // 处理原始节点
    if (data.nodes && Array.isArray(data.nodes)) {
        data.nodes.forEach((node, index) => {
            const fixedNode = {
                id: node.id || `node_${index}`,
                name: node.name || `节点${index + 1}`,
                type: node.type || 'knowledge_point',
                x: node.x || Math.random() * 600 + 100,
                y: node.y || Math.random() * 400 + 100
            };
            fixedData.nodes.push(fixedNode);
            
            // 连接到中心节点
            fixedData.edges.push({
                source: 'center',
                target: fixedNode.id
            });
        });
    }
    
    // 处理原始连线
    if (data.edges && Array.isArray(data.edges)) {
        data.edges.forEach(edge => {
            if (edge.source && edge.target) {
                fixedData.edges.push({
                    source: edge.source,
                    target: edge.target
                });
            }
        });
    }
    
    log(`🔧 修复完成: ${fixedData.nodes.length}个节点, ${fixedData.edges.length}条连线`);
    return fixedData;
}

// 显示模拟脑图
function showMockMindmap(subjectName) {
    log('📊 显示模拟脑图数据');
    
    // 创建模拟数据
    const mockData = {
        nodes: [
            { id: 'center', name: subjectName, type: 'center', x: 400, y: 250 },
            { id: 'node1', name: '基础概念', type: 'category', x: 200, y: 150 },
            { id: 'node2', name: '核心算法', type: 'category', x: 600, y: 150 },
            { id: 'node3', name: '实践应用', type: 'category', x: 200, y: 350 },
            { id: 'node4', name: '高级技巧', type: 'category', x: 600, y: 350 },
            { id: 'kp1', name: '数据类型', type: 'knowledge_point', x: 100, y: 100 },
            { id: 'kp2', name: '变量作用域', type: 'knowledge_point', x: 300, y: 100 },
            { id: 'kp3', name: '排序算法', type: 'knowledge_point', x: 500, y: 100 },
            { id: 'kp4', name: '搜索算法', type: 'knowledge_point', x: 700, y: 100 }
        ],
        edges: [
            { source: 'center', target: 'node1', relation: '包含' },
            { source: 'center', target: 'node2', relation: '包含' },
            { source: 'center', target: 'node3', relation: '包含' },
            { source: 'center', target: 'node4', relation: '包含' },
            { source: 'node1', target: 'kp1', relation: '细分为' },
            { source: 'node1', target: 'kp2', relation: '细分为' },
            { source: 'node2', target: 'kp3', relation: '实现为' },
            { source: 'node2', target: 'kp4', relation: '实现为' }
        ]
    };
    
    currentMindmapData = mockData;
    renderMindmap();
}

// 渲染脑图
function renderMindmap() {
    if (!currentMindmapData || !currentMindmapData.nodes) {
        log('❌ 脑图数据无效');
        return;
    }
    
    // 重置筛选状态
    filteredNodeId = null;
    
    log(`📊 开始渲染脑图，节点数: ${currentMindmapData.nodes.length}`);
    
    // 初始化SVG
    initSvg();
    
    const nodes = currentMindmapData.nodes.map(d => ({...d}));
    const edges = currentMindmapData.edges || [];
    
    // 清空之前的内容
    g.selectAll('*').remove();
    svg.selectAll('defs').remove(); // 清空箭头定义
    
    // 创建力导向图
    simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(edges).id(d => d.id).distance(150))
        .force('charge', d3.forceManyBody().strength(-500))
        .force('center', d3.forceCenter(400, 250))
        .force('collision', d3.forceCollide().radius(d => {
            const textLength = d.name.length;
            if (d.type === 'center') {
                return Math.max(50, textLength * 4) + 10; // 额外10px间距
            }
            if (d.type === 'category') {
                return Math.max(40, textLength * 3.5) + 8;
            }
            return Math.max(35, textLength * 3) + 6;
        }));
    
    // 定义箭头标记
    const defs = svg.append('defs');
    defs.append('marker')
        .attr('id', 'arrow')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 10) // 箭头尖端位置
        .attr('refY', 0)
        .attr('markerWidth', 8)
        .attr('markerHeight', 8)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', '#3498db');
    
    // 绘制有向连线
    const links = g.append('g')
        .selectAll('line')
        .data(edges)
        .enter().append('line')
        .attr('stroke', '#3498db')
        .attr('stroke-opacity', 0.9)
        .attr('stroke-width', 3)
        .attr('marker-end', 'url(#arrow)');
    
    // 绘制关系文字
    const linkLabels = g.append('g')
        .selectAll('text')
        .data(edges)
        .enter().append('text')
        .attr('class', 'link-label')
        .attr('text-anchor', 'middle')
        .attr('dy', -5)
        .style('font-size', '10px')
        .style('font-weight', 'bold')
        .style('fill', '#555')
        .style('background', 'white')
        .style('padding', '2px')
        .text(d => d.relation || '关联');
    
    // 绘制节点组
    const nodeGroups = g.append('g')
        .selectAll('g')
        .data(nodes)
        .enter().append('g')
        .attr('class', 'node-group')
        .style('cursor', 'pointer')
        .call(d3.drag()
            .on('start', dragstarted)
            .on('drag', dragged)
            .on('end', dragended));
    
    // 节点圆圈 - 根据文字长度动态调整大小
    nodeGroups.append('circle')
        .attr('r', d => {
            const textLength = d.name.length;
            if (d.type === 'center') {
                return Math.max(50, textLength * 4); // 最小50，每字符4px
            }
            if (d.type === 'category') {
                return Math.max(40, textLength * 3.5); // 最小40，每字符3.5px
            }
            return Math.max(35, textLength * 3); // 知识点：最小35，每字符3px
        })
        .attr('fill', d => {
            if (d.type === 'center') return '#3B82F6';
            if (d.type === 'category') return '#10B981';
            return '#F59E0B';
        })
        .attr('stroke', '#fff')
        .attr('stroke-width', 2);
    
    // 节点文本 - 完整显示，不截断
    nodeGroups.each(function(d) {
        const group = d3.select(this);
        const fontSize = d.type === 'center' ? 14 : d.type === 'category' ? 12 : 11;
        
        // 获取当前圆圈的半径
        const circle = group.select('circle');
        const radius = parseFloat(circle.attr('r'));
        
        // 智能分行：根据圆圈大小决定每行字符数
        const maxWidth = radius * 1.6; // 圆圈直径的80%作为文字宽度
        const avgCharWidth = fontSize * 0.6; // 平均字符宽度
        const maxCharsPerLine = Math.max(4, Math.floor(maxWidth / avgCharWidth));
        
        // 按自然断点分词（空格、括号、标点等）
        const text = d.name;
        let words = [];
        
        // 如果包含英文，按单词分割；否则按字符分割
        if (/[a-zA-Z]/.test(text)) {
            words = text.split(/(\s+|\(|\)|（|）|,|，|、|：|:|-)/);
        } else {
            words = text.split('');
        }
        
        const lines = [];
        let currentLine = '';
        
        for (let word of words) {
            if (!word.trim() && word !== ' ') continue; // 跳过空白但保留空格
            
            const testLine = currentLine + word;
            if (testLine.length <= maxCharsPerLine || currentLine === '') {
                currentLine = testLine;
            } else {
                if (currentLine) lines.push(currentLine);
                currentLine = word;
            }
        }
        if (currentLine) lines.push(currentLine);
        
        // 如果文字很短，单行显示
        if (lines.length === 1 && lines[0].length <= maxCharsPerLine) {
            group.append('text')
                .attr('x', 0)
                .attr('y', 0)
                .attr('text-anchor', 'middle')
                .style('fill', 'white')
                .style('font-size', fontSize + 'px')
                .style('font-weight', 'bold')
                .style('text-shadow', '1px 1px 2px rgba(0,0,0,0.5)')
                .style('dominant-baseline', 'middle')
                .text(lines[0]);
        } else {
            // 多行显示
            const lineHeight = fontSize + 2;
            const totalHeight = lines.length * lineHeight;
            const startY = -(totalHeight / 2) + (lineHeight / 2);
            
            lines.forEach((line, index) => {
                group.append('text')
                    .attr('x', 0)
                    .attr('y', startY + (index * lineHeight))
                    .attr('text-anchor', 'middle')
                    .style('fill', 'white')
                    .style('font-size', fontSize + 'px')
                    .style('font-weight', 'bold')
                    .style('text-shadow', '1px 1px 2px rgba(0,0,0,0.5)')
                    .style('dominant-baseline', 'middle')
                    .text(line);
            });
        }
    });
    
    // 节点点击事件
    nodeGroups.on('click', (event, d) => {
        log(`🔍 点击了节点: ${d.name} (${d.type})`);
        
        // 处理筛选逻辑（绿色和蓝色圆圈）
        if (d.type === 'center' || d.type === 'category') {
            handleNodeFilter(d);
        }
        // 处理知识点详情（橙色圆圈）
        else if (d.type === 'knowledge_point') {
            showKnowledgePointDetail(d);
        }
    });
    
    // 更新位置
    simulation.on('tick', () => {
        links.each(function(d) {
            // 计算连线方向
            const dx = d.target.x - d.source.x;
            const dy = d.target.y - d.source.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // 避免除零错误
            if (distance === 0) return;
            
            // 计算节点半径（使用动态半径）
            const getNodeRadius = (node) => {
                const textLength = node.name.length;
                if (node.type === 'center') {
                    return Math.max(50, textLength * 4);
                }
                if (node.type === 'category') {
                    return Math.max(40, textLength * 3.5);
                }
                return Math.max(35, textLength * 3);
            };
            
            const sourceRadius = getNodeRadius(d.source);
            const targetRadius = getNodeRadius(d.target);
            
            // 计算连线起点和终点（在圆圈边缘）
            const sourceX = d.source.x + (dx / distance) * sourceRadius;
            const sourceY = d.source.y + (dy / distance) * sourceRadius;
            const targetX = d.target.x - (dx / distance) * (targetRadius + 5); // 留出箭头空间
            const targetY = d.target.y - (dy / distance) * (targetRadius + 5);
            
            d3.select(this)
                .attr('x1', sourceX)
                .attr('y1', sourceY)
                .attr('x2', targetX)
                .attr('y2', targetY);
        });
        
        // 更新关系文字位置（在连线中点）
        linkLabels
            .attr('x', d => (d.source.x + d.target.x) / 2)
            .attr('y', d => (d.source.y + d.target.y) / 2);
        
        nodeGroups
            .attr('transform', d => `translate(${d.x},${d.y})`);
    });
    
    log('✅ 脑图渲染完成');
}

// 初始化SVG
function initSvg() {
    if (svg) return;
    
    svg = d3.select('#mindmapSvg');
    g = svg.append('g');
    
    // 初始化缩放
    zoom = d3.zoom()
        .scaleExtent([0.1, 3])
        .on('zoom', (event) => {
            g.attr('transform', event.transform);
        });
    
    svg.call(zoom);
}

// 拖拽函数
function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
}

function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
}

function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
}

// 显示知识点详情
async function showKnowledgePointDetail(node) {
    log(`🔍 获取知识点详情: ${node.name} (ID: ${node.id})`);
    
    try {
        if (window.bridge && window.bridge.getKnowledgePointDetail && node.type === 'knowledge_point') {
            // 提取真实的知识点ID（去掉kp_前缀）
            const realId = node.id.startsWith('kp_') ? node.id.substring(3) : node.id;
            
            const response = await window.bridge.getKnowledgePointDetail(realId);
            const result = JSON.parse(response);
            
            if (result.success && result.detail) {
                const detail = result.detail;
                alert(`知识点详情：\n名称：${detail.name || node.name}\n描述：${detail.description || '暂无描述'}\n掌握度：${detail.mastery_score || 0}%\n来源：${detail.source || '未知'}`);
                log(`✅ 成功获取知识点详情`);
            } else {
                alert(`知识点详情：\n名称：${node.name}\n类型：${node.type}\nID：${node.id}\n\n⚠️ 无法获取详细信息: ${result.error || '数据不存在'}`);
                log(`⚠️ 获取详情失败: ${result.error}`);
            }
        } else {
            // 显示基本信息
            alert(`节点信息：\n名称：${node.name}\n类型：${node.type}\nID：${node.id}`);
            log(`ℹ️ 显示基本节点信息`);
        }
    } catch (error) {
        log(`❌ 获取知识点详情失败: ${error.message}`);
        alert(`知识点详情：\n名称：${node.name}\n类型：${node.type}\nID：${node.id}\n\n❌ 获取详情时出错: ${error.message}`);
    }
}

// 脑图工具函数
function showLoading() {
    document.getElementById('loadingState').classList.remove('hidden');
}

function hideLoading() {
    document.getElementById('loadingState').classList.add('hidden');
}

function zoomIn() {
    if (svg && zoom) {
        svg.transition().call(zoom.scaleBy, 1.5);
        log('🔍 放大脑图');
    }
}

function zoomOut() {
    if (svg && zoom) {
        svg.transition().call(zoom.scaleBy, 1 / 1.5);
        log('🔍 缩小脑图');
    }
}

function resetView() {
    if (svg && zoom) {
        svg.transition().call(zoom.transform, d3.zoomIdentity);
        log('🔍 重置脑图视图');
    }
}

function searchNodes() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) {
        log('⚠️ 请输入搜索关键词');
        return;
    }
    
    log(`🔍 搜索节点: ${query}`);
    
    if (g) {
        // 重置所有节点样式
        g.selectAll('.node-group circle')
            .attr('stroke', '#fff')
            .attr('stroke-width', 2);
        
        // 高亮匹配的节点
        g.selectAll('.node-group')
            .each(function(d) {
                const circle = d3.select(this).select('circle');
                if (d.name.toLowerCase().includes(query.toLowerCase())) {
                    circle.attr('stroke', '#F59E0B').attr('stroke-width', 4);
                    log(`✅ 找到匹配节点: ${d.name}`);
                }
            });
    }
}

// 全屏功能
let isFullscreen = false;

function toggleFullscreen() {
    if (!isFullscreen) {
        enterFullscreen();
    } else {
        exitFullscreen();
    }
}

function enterFullscreen() {
    log('🖥️ 进入全屏模式');
    
    const mindmapPage = document.getElementById('mindmapPage');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
    
    // 添加全屏样式类
    mindmapPage.classList.add('fullscreen-mode');
    
    // 切换按钮显示
    fullscreenBtn.classList.add('hidden');
    exitFullscreenBtn.classList.remove('hidden');
    
    // 更新状态
    isFullscreen = true;
    
    // 重新调整SVG大小
    setTimeout(() => {
        if (svg && zoom) {
            // 重新设置SVG尺寸
            const container = document.getElementById('mindmapSvgContainer');
            const rect = container.getBoundingClientRect();
            svg.attr('width', rect.width).attr('height', rect.height);
            
            // 重置视图以适应新尺寸
            svg.call(zoom.transform, d3.zoomIdentity);
            log('✅ 全屏模式SVG已调整');
        }
    }, 100);
    
    log('✅ 已进入全屏模式');
}

function exitFullscreen() {
    log('🖥️ 退出全屏模式');
    
    const mindmapPage = document.getElementById('mindmapPage');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
    
    // 移除全屏样式类
    mindmapPage.classList.remove('fullscreen-mode');
    
    // 切换按钮显示
    fullscreenBtn.classList.remove('hidden');
    exitFullscreenBtn.classList.add('hidden');
    
    // 更新状态
    isFullscreen = false;
    
    // 重新调整SVG大小
    setTimeout(() => {
        if (svg && zoom) {
            // 重新设置SVG尺寸
            const container = document.getElementById('mindmapSvgContainer');
            const rect = container.getBoundingClientRect();
            svg.attr('width', rect.width).attr('height', rect.height);
            
            // 重置视图以适应新尺寸
            svg.call(zoom.transform, d3.zoomIdentity);
            log('✅ 普通模式SVG已调整');
        }
    }, 100);
    
    log('✅ 已退出全屏模式');
}

// 键盘快捷键支持
document.addEventListener('keydown', function(e) {
    // F11键切换全屏
    if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
    }
    // ESC键退出全屏
    if (e.key === 'Escape' && isFullscreen) {
        exitFullscreen();
    }
});

// 刷新脑图缓存
async function refreshMindmapCache() {
    // 优先使用全局变量，备用方案是从标题提取
    let currentSubject = currentSubjectName;
    if (!currentSubject) {
        const titleText = document.getElementById('mindmapTitle').textContent;
        currentSubject = titleText.replace(' - 知识脑图', '').replace('知识脑图', '').trim();
    }
    
    if (!currentSubject) {
        log('❌ 无法获取当前学科名称');
        log(`全局变量: "${currentSubjectName}"`);
        log(`页面标题: "${document.getElementById('mindmapTitle').textContent}"`);
        return;
    }
    
    log(`🔄 开始刷新 "${currentSubject}" 的脑图缓存...`);
    
    // 更新按钮状态
    const refreshBtn = document.getElementById('refreshCacheBtn');
    const originalText = refreshBtn.innerHTML;
    refreshBtn.innerHTML = '<span class="material-icons-outlined text-sm animate-spin">refresh</span><span>刷新中...</span>';
    refreshBtn.disabled = true;
    
    try {
        if (window.bridge && window.bridge.clearMindmapCache) {
            // 先清除缓存
            await window.bridge.clearMindmapCache(currentSubject);
            log(`🗑️ 已清除 "${currentSubject}" 的缓存`);
        }
        
        // 重新生成脑图
        await generateMindmap(currentSubject);
        log(`✅ 脑图缓存刷新完成`);
        
    } catch (error) {
        log(`❌ 刷新缓存失败: ${error.message}`);
    } finally {
        // 恢复按钮状态
        refreshBtn.innerHTML = originalText;
        refreshBtn.disabled = false;
    }
}

// 处理节点筛选
function handleNodeFilter(clickedNode) {
    const nodeGroups = d3.selectAll('.node-group');
    const links = d3.selectAll('line');
    const linkLabels = d3.selectAll('.link-label');
    
    // 如果点击的是当前筛选的节点，则还原显示
    if (filteredNodeId === clickedNode.id) {
        log(`🔄 还原显示所有节点`);
        restoreAllNodes();
        return;
    }
    
    // 保存当前筛选的节点ID
    filteredNodeId = clickedNode.id;
    log(`🎯 筛选显示 "${clickedNode.name}" 的子节点`);
    
    // 获取所有边数据来找出子节点
    const edges = currentMindmapData.edges || [];
    const childNodeIds = new Set();
    
    // 找出所有以当前节点为源的边的目标节点
    edges.forEach(edge => {
        if (edge.source === clickedNode.id || (typeof edge.source === 'object' && edge.source.id === clickedNode.id)) {
            const targetId = typeof edge.target === 'object' ? edge.target.id : edge.target;
            childNodeIds.add(targetId);
        }
    });
    
    // 添加点击的节点本身
    childNodeIds.add(clickedNode.id);
    
    log(`📊 找到 ${childNodeIds.size - 1} 个子节点`);
    
    // 显示清除筛选按钮
    document.getElementById('clearFilterBtn').classList.remove('hidden');
    
    // 隐藏不相关的节点
    nodeGroups.each(function(d) {
        const nodeGroup = d3.select(this);
        if (childNodeIds.has(d.id)) {
            // 显示相关节点，添加高亮效果
            nodeGroup.style('opacity', 1)
                     .style('filter', d.id === clickedNode.id ? 'drop-shadow(0 0 10px rgba(59, 130, 246, 0.8))' : 'none');
        } else {
            // 隐藏不相关节点
            nodeGroup.style('opacity', 0.1);
        }
    });
    
    // 只显示相关的连线
    links.each(function(d) {
        const link = d3.select(this);
        const sourceId = typeof d.source === 'object' ? d.source.id : d.source;
        const targetId = typeof d.target === 'object' ? d.target.id : d.target;
        
        if (childNodeIds.has(sourceId) && childNodeIds.has(targetId)) {
            link.style('opacity', 1);
        } else {
            link.style('opacity', 0.1);
        }
    });
    
    // 只显示相关的连线标签
    linkLabels.each(function(d) {
        const label = d3.select(this);
        const sourceId = typeof d.source === 'object' ? d.source.id : d.source;
        const targetId = typeof d.target === 'object' ? d.target.id : d.target;
        
        if (childNodeIds.has(sourceId) && childNodeIds.has(targetId)) {
            label.style('opacity', 1);
        } else {
            label.style('opacity', 0.1);
        }
    });
}

// 还原所有节点显示
function restoreAllNodes() {
    filteredNodeId = null;
    
    // 隐藏清除筛选按钮
    document.getElementById('clearFilterBtn').classList.add('hidden');
    
    const nodeGroups = d3.selectAll('.node-group');
    const links = d3.selectAll('line');
    const linkLabels = d3.selectAll('.link-label');
    
    // 还原所有节点
    nodeGroups.style('opacity', 1)
              .style('filter', 'none');
    
    // 还原所有连线
    links.style('opacity', 0.9);
    
    // 还原所有连线标签
    linkLabels.style('opacity', 1);
    
    log(`✅ 已还原显示所有节点`);
}
