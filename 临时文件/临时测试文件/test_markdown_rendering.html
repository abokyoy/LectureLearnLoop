<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown渲染测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.2/marked.min.js"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Markdown渲染测试</h1>
        
        <!-- 测试按钮 -->
        <div class="mb-6">
            <button onclick="testMarkdownRendering()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                测试Markdown渲染
            </button>
        </div>
        
        <!-- 原始Markdown内容 -->
        <div class="mb-6">
            <h2 class="text-xl font-bold text-gray-800 mb-3">原始Markdown内容：</h2>
            <pre id="rawMarkdown" class="bg-gray-50 p-4 rounded-lg text-sm overflow-x-auto"></pre>
        </div>
        
        <!-- 渲染后的内容 -->
        <div>
            <h2 class="text-xl font-bold text-gray-800 mb-3">渲染后的内容：</h2>
            <div id="renderedContent" class="bg-white p-6 rounded-lg border prose max-w-none prose-headings:text-gray-800 prose-p:text-gray-700 prose-strong:text-gray-800 prose-code:bg-gray-100 prose-code:px-1 prose-code:rounded prose-pre:bg-gray-50 prose-blockquote:border-l-blue-500"></div>
        </div>
    </div>

    <script>
        // 测试用的Markdown内容
        const testMarkdown = `# 机器学习基础知识

## 1. 什么是机器学习？

机器学习是**人工智能**的一个重要分支，它使计算机能够在没有明确编程的情况下学习和改进。

### 1.1 主要类型

- **监督学习**：使用标记数据进行训练
- **无监督学习**：从未标记数据中发现模式
- **强化学习**：通过与环境交互学习

### 1.2 核心概念

1. **训练数据**：用于训练模型的数据集
2. **特征**：输入变量或属性
3. **标签**：目标输出或结果

## 2. 代码示例

### Python实现

\`\`\`python
import numpy as np
from sklearn.linear_model import LinearRegression

# 创建训练数据
X = np.array([[1], [2], [3], [4], [5]])
y = np.array([2, 4, 6, 8, 10])

# 训练模型
model = LinearRegression()
model.fit(X, y)

# 预测
prediction = model.predict([[6]])
print(f"预测结果: {prediction[0]}")
\`\`\`

### 关键函数

- \`fit()\`: 训练模型
- \`predict()\`: 进行预测
- \`score()\`: 评估模型性能

## 3. 重要公式

损失函数：$L(y, \\hat{y}) = \\frac{1}{2}(y - \\hat{y})^2$

## 4. 注意事项

> **重要提示**：在实际应用中，需要注意数据预处理、特征工程和模型验证等步骤。

---

**参考资料**：
- [scikit-learn官方文档](https://scikit-learn.org/)
- 《机器学习实战》
- 《统计学习方法》`;

        function testMarkdownRendering() {
            // 显示原始内容
            document.getElementById('rawMarkdown').textContent = testMarkdown;
            
            // 渲染Markdown
            renderMarkdownContent(testMarkdown);
        }

        function renderMarkdownContent(markdownContent) {
            const contentArea = document.getElementById('renderedContent');
            
            try {
                // 配置marked选项
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    sanitize: false,
                    smartLists: true,
                    smartypants: true
                });
                
                // 渲染Markdown为HTML
                const htmlContent = marked.parse(markdownContent);
                contentArea.innerHTML = htmlContent;
                
                // 添加代码高亮
                highlightCodeBlocks();
                
                console.log('✅ Markdown渲染完成');
            } catch (error) {
                console.error('Markdown渲染失败:', error);
                contentArea.innerHTML = \`
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                        <p class="text-red-800 font-semibold">❌ 渲染失败: \${error.message}</p>
                    </div>
                \`;
            }
        }

        function highlightCodeBlocks() {
            // 代码块样式
            const codeBlocks = document.querySelectorAll('#renderedContent pre code');
            codeBlocks.forEach(block => {
                block.classList.add('text-sm', 'bg-gray-800', 'text-gray-100', 'p-4', 'rounded-lg', 'overflow-x-auto');
                block.parentElement.classList.add('bg-gray-800', 'rounded-lg');
            });
            
            // 内联代码样式
            const inlineCodes = document.querySelectorAll('#renderedContent p code, #renderedContent li code');
            inlineCodes.forEach(code => {
                code.classList.add('bg-gray-100', 'text-gray-800', 'px-1', 'py-0.5', 'rounded', 'text-sm', 'font-mono');
            });
        }

        // 页面加载时自动测试
        window.onload = function() {
            testMarkdownRendering();
        };
    </script>
</body>
</html>
