<!DOCTYPE html>
<html>
<head>
    <title>WebChannel测试</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
    <h1>WebChannel连接测试</h1>
    <div id="status">正在连接...</div>
    <button id="testBtn" onclick="testLearningPath()" disabled>测试学习路径</button>
    <div id="result"></div>

    <script>
        let bridge = null;
        
        new QWebChannel(qt.webChannelTransport, function(channel) {
            bridge = channel.objects.bridge;
            console.log('WebChannel连接成功');
            document.getElementById('status').textContent = 'WebChannel连接成功';
            
            // 检查方法是否存在
            const methods = [];
            if (bridge.getOrGenerateLearningPath) methods.push('getOrGenerateLearningPath');
            if (bridge.clearLearningPathCache) methods.push('clearLearningPathCache');
            if (bridge.getOrGenerateMindmap) methods.push('getOrGenerateMindmap');
            
            document.getElementById('result').innerHTML = 
                '<h3>可用方法:</h3><ul>' + 
                methods.map(m => '<li>' + m + '</li>').join('') + 
                '</ul>';
            
            document.getElementById('testBtn').disabled = false;
        });
        
        async function testLearningPath() {
            if (!bridge) {
                alert('WebChannel未连接');
                return;
            }
            
            try {
                console.log('开始测试学习路径API...');
                const response = await bridge.getOrGenerateLearningPath('机器学习');
                console.log('API响应:', response);
                document.getElementById('result').innerHTML += 
                    '<h3>API测试结果:</h3><pre>' + response + '</pre>';
            } catch (error) {
                console.error('API调用失败:', error);
                document.getElementById('result').innerHTML += 
                    '<h3>API测试失败:</h3><pre>' + error.message + '</pre>';
            }
        }
    </script>
</body>
</html>
