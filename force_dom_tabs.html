<!-- 强制DOM Tab标签修复 -->
<script>
// 强制修复TUI Editor的Tab标签DOM问题
(function() {
    console.log('🔧 强制DOM Tab标签修复启动');
    
    function waitForTuiAndFix() {
        console.log('⏳ 等待TUI Editor并修复Tab标签...');
        
        let attempts = 0;
        const checkInterval = setInterval(() => {
            attempts++;
            
            if (window.tuiEditor) {
                console.log('✅ 发现TUI Editor实例，开始修复');
                clearInterval(checkInterval);
                
                setTimeout(() => {
                    forceDOMTabFix();
                }, 2000); // 等待2秒让TUI完全渲染
                
            } else if (attempts > 30) {
                console.log('❌ 等待TUI Editor超时');
                clearInterval(checkInterval);
            }
        }, 1000);
    }
    
    function forceDOMTabFix() {
        console.log('🔨 开始强制修复Tab标签DOM...');
        
        const container = document.getElementById('editor');
        if (!container) {
            console.log('❌ 找不到编辑器容器');
            return;
        }
        
        // 检查当前TUI Editor的DOM结构
        console.log('🔍 检查TUI Editor DOM结构...');
        const tuiEditorEl = container.querySelector('.toastui-editor');
        
        if (!tuiEditorEl) {
            console.log('❌ 找不到.toastui-editor元素');
            return;
        }
        
        console.log('✅ 找到TUI Editor元素');
        
        // 检查Tab标签
        let tabsContainer = tuiEditorEl.querySelector('.toastui-editor-tabs');
        let tabs = tuiEditorEl.querySelectorAll('.toastui-editor-tab');
        
        console.log('📊 当前Tab容器: ' + (tabsContainer ? '存在' : '不存在'));
        console.log('📊 当前Tab数量: ' + tabs.length);
        
        if (tabs.length === 0) {
            console.log('🔧 Tab标签缺失，开始强制创建...');
            createMissingTabs(tuiEditorEl);
        } else {
            console.log('✅ Tab标签存在，检查样式...');
            fixTabStyles(tabs);
        }
        
        // 最终验证
        setTimeout(() => {
            verifyTabFix();
        }, 1000);
    }
    
    function createMissingTabs(tuiEditorEl) {
        console.log('🔨 强制创建缺失的Tab标签...');
        
        // 查找工具栏位置
        const toolbar = tuiEditorEl.querySelector('.toastui-editor-toolbar');
        if (!toolbar) {
            console.log('❌ 找不到工具栏');
            return;
        }
        
        // 创建Tab容器
        const tabsContainer = document.createElement('div');
        tabsContainer.className = 'toastui-editor-tabs';
        tabsContainer.style.cssText = `
            display: flex;
            border-bottom: 1px solid #e1e5e9;
            background: #f8f9fa;
            height: 40px;
        `;
        
        // 创建Write Tab
        const writeTab = document.createElement('button');
        writeTab.className = 'toastui-editor-tab active';
        writeTab.textContent = 'Write';
        writeTab.style.cssText = `
            padding: 8px 16px;
            border: none;
            background: white;
            cursor: pointer;
            border-bottom: 2px solid #007bff;
            color: #333;
        `;
        
        // 创建Preview Tab
        const previewTab = document.createElement('button');
        previewTab.className = 'toastui-editor-tab';
        previewTab.textContent = 'Preview';
        previewTab.style.cssText = `
            padding: 8px 16px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: #666;
        `;
        
        // 添加点击事件
        writeTab.addEventListener('click', () => {
            console.log('📝 切换到Write模式');
            if (window.tuiEditor) {
                try {
                    window.tuiEditor.changeMode('markdown');
                    updateTabActiveState(writeTab, previewTab);
                } catch(e) {
                    console.log('❌ 切换Write模式失败: ' + e.message);
                }
            }
        });
        
        previewTab.addEventListener('click', () => {
            console.log('👁️ 切换到Preview模式');
            if (window.tuiEditor) {
                try {
                    window.tuiEditor.changeMode('preview');
                    updateTabActiveState(previewTab, writeTab);
                } catch(e) {
                    console.log('❌ 切换Preview模式失败: ' + e.message);
                }
            }
        });
        
        // 组装Tab容器
        tabsContainer.appendChild(writeTab);
        tabsContainer.appendChild(previewTab);
        
        // 插入到工具栏后面
        toolbar.parentNode.insertBefore(tabsContainer, toolbar.nextSibling);
        
        console.log('✅ Tab标签已强制创建');
    }
    
    function updateTabActiveState(activeTab, inactiveTab) {
        // 更新活跃状态
        activeTab.classList.add('active');
        activeTab.style.background = 'white';
        activeTab.style.borderBottom = '2px solid #007bff';
        activeTab.style.color = '#333';
        
        inactiveTab.classList.remove('active');
        inactiveTab.style.background = 'transparent';
        inactiveTab.style.borderBottom = 'none';
        inactiveTab.style.color = '#666';
    }
    
    function fixTabStyles(tabs) {
        console.log('🎨 修复Tab样式...');
        
        tabs.forEach((tab, index) => {
            tab.style.cssText = `
                padding: 8px 16px;
                border: none;
                cursor: pointer;
                ${tab.classList.contains('active') ? 
                    'background: white; border-bottom: 2px solid #007bff; color: #333;' : 
                    'background: transparent; color: #666;'}
            `;
        });
        
        console.log('✅ Tab样式已修复');
    }
    
    function verifyTabFix() {
        console.log('🔍 验证Tab修复结果...');
        
        const tabs = document.querySelectorAll('.toastui-editor-tab');
        console.log('📊 修复后Tab数量: ' + tabs.length);
        
        if (tabs.length >= 2) {
            console.log('✅ Tab修复成功！');
            
            tabs.forEach((tab, index) => {
                console.log('  - Tab' + index + ': ' + tab.textContent + (tab.classList.contains('active') ? ' (活跃)' : ''));
            });
            
            // 更新调试日志
            if (window.addDebugLog) {
                window.addDebugLog('✅ DOM Tab修复成功！Tab数量: ' + tabs.length);
            }
            
        } else {
            console.log('❌ Tab修复失败');
            
            if (window.addDebugLog) {
                window.addDebugLog('❌ DOM Tab修复失败，Tab数量仍为: ' + tabs.length);
            }
        }
    }
    
    // 重写调试按钮
    window.simpleDebug = function() {
        console.log('🔍 DOM Tab修复调试');
        
        const container = document.getElementById('editor');
        const tuiEl = container ? container.querySelector('.toastui-editor') : null;
        const tabs = document.querySelectorAll('.toastui-editor-tab');
        
        const info = 
            '📊 DOM状态检查:\n' +
            '  - 编辑器容器: ' + (container ? '存在' : '不存在') + '\n' +
            '  - TUI Editor元素: ' + (tuiEl ? '存在' : '不存在') + '\n' +
            '  - Tab标签数量: ' + tabs.length + '\n' +
            '  - TUI实例: ' + (window.tuiEditor ? '存在' : '不存在');
        
        console.log(info);
        alert('DOM检查完成！\n\n' + info.replace(/\n/g, '\n'));
        
        if (tabs.length === 0) {
            console.log('🔧 检测到Tab缺失，立即修复...');
            forceDOMTabFix();
        }
    };
    
    // 开始等待和修复
    if (document.readyState === 'complete') {
        waitForTuiAndFix();
    } else {
        window.addEventListener('load', waitForTuiAndFix);
    }
    
    console.log('🔧 DOM Tab修复系统已启动');
})();
</script>
