{% extends "spa_layout.html" %}
{# SPA 通用页面壳：把 pages/<cid>.html 裸片段作为初始内容渲染进 #content-area #}
{% block page_content %}
{% include page %}
{% endblock %}

{% block on_bridge_ready %}
{{ super() }}
<script>
    // 记录当前页面 id，与 Qt 的 window.current_page 语义对齐
    window.current_page = "{{ content_id }}";
</script>
{% endblock %}
