<!-- 批6 重设计：设置页（设计系统 cl-* 全面接管；日志查看/清空去 Qt 桥依赖，改 SPA 跳转 + HTTP 接口；异步渲染遵循渲染令牌模式 P024） -->
<div class="cl-page space-y-6" data-st-page="settings">

    <div>
        <h1 class="text-[22px] font-bold text-cl-text flex items-center gap-2">
            <svg class="w-6 h-6 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-settings"/></svg>
            设置
        </h1>
        <p class="text-sm text-cl-text-2 mt-1">积分、AI 模型与总结偏好，都在这里管理</p>
    </div>

    <!-- ============ 我的积分 ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="cl-section-title">
            <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-coins"/></svg>
            我的积分
        </div>
        <div class="rounded-cl bg-gradient-to-br from-cl-primary to-[#FB923C] text-white p-5 flex flex-wrap items-center gap-x-10 gap-y-4">
            <div>
                <div class="text-[28px] font-bold leading-tight" id="cr-balance">--</div>
                <div class="text-xs text-white/85">剩余积分</div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-x-8 gap-y-2">
                <div><div class="text-lg font-semibold" id="cr-earned">--</div><div class="text-[11px] text-white/80">累计获得</div></div>
                <div><div class="text-lg font-semibold" id="cr-recharged">--</div><div class="text-[11px] text-white/80">充值获得</div></div>
                <div><div class="text-lg font-semibold" id="cr-granted">--</div><div class="text-[11px] text-white/80">赠送获得</div></div>
                <div><div class="text-lg font-semibold" id="cr-used">--</div><div class="text-[11px] text-white/80">累计消耗</div></div>
            </div>
        </div>
        <div class="rounded-clbtn bg-cl-primary-soft text-cl-text-2 text-[13px] px-4 py-3 leading-relaxed" id="cr-recharge-hint">
            充值方式：购买卡密后在下方输入兑换。
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            <input type="text" id="cr-redeem-code" placeholder="输入激活卡密（如 XXXX-XXXX-XXXX-XXXX）"
                class="h-10 flex-1 min-w-48 rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            <button type="button" class="cl-btn-primary" id="cr-redeem-btn">
                <svg class="w-4 h-4" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-wallet"/></svg>
                兑换
            </button>
        </div>
        <div id="cr-redeem-msg"></div>
        <div class="cl-section-title !text-[15px] pt-2">最近积分流水</div>
        <div class="overflow-x-auto">
            <table class="w-full text-[13px]">
                <thead>
                    <tr class="text-left text-cl-text-3 border-b border-cl-border">
                        <th class="py-2 pr-4 font-medium">时间</th>
                        <th class="py-2 pr-4 font-medium">类型</th>
                        <th class="py-2 pr-4 font-medium">场景</th>
                        <th class="py-2 pr-4 font-medium">积分</th>
                        <th class="py-2 font-medium">余额</th>
                    </tr>
                </thead>
                <tbody id="cr-tx-body">
                    <tr><td colspan="5" class="py-6 text-cl-text-3">加载中…</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ============ 我的 AI 配置（自备大模型 Key） ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="cl-section-title">
            <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-sparkles"/></svg>
            我的 AI 配置（自备大模型 Key）
        </div>
        <div class="rounded-clbtn bg-cl-primary-soft text-cl-text-2 text-[13px] px-4 py-3 leading-relaxed">
            配置自备 Key 后，AI 调用使用<b>您自己的模型账号，不消耗积分</b>；未配置或调用失败时自动回落系统模型并按 Token 消耗积分。
            <span id="llm-sys-state" class="block mt-1 text-cl-text-3"></span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="block">
                <span class="text-xs font-medium text-cl-text-2 block mb-1.5">模型提供商</span>
                <select id="llm-provider"
                    class="h-10 w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
                    <option value="DeepSeek">DeepSeek (在线)</option>
                    <option value="Gemini">Gemini (云端)</option>
                    <option value="Qwen">通义千问 (阿里云)</option>
                    <option value="Ollama">Ollama (本地)</option>
                </select>
            </label>
            <label class="block">
                <span class="text-xs font-medium text-cl-text-2 block mb-1.5">模型名称</span>
                <input type="text" id="llm-model" placeholder="如 deepseek-chat / qwen-flash / gemini-1.5-flash-002"
                    class="h-10 w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            </label>
            <label class="block">
                <span class="text-xs font-medium text-cl-text-2 block mb-1.5">API Key</span>
                <input type="password" id="llm-key" placeholder="输入您的 API Key（Ollama 本地模型可留空）"
                    class="h-10 w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            </label>
            <label class="block" id="llm-url-row" style="display:none;">
                <span class="text-xs font-medium text-cl-text-2 block mb-1.5">API URL</span>
                <input type="text" id="llm-url" placeholder="http://localhost:11434/api/generate"
                    class="h-10 w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            </label>
        </div>
        <label class="inline-flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="llm-enabled" class="peer sr-only" checked>
            <span class="w-10 h-6 rounded-full bg-cl-border relative transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:rounded-full after:bg-white after:shadow after:transition-all peer-checked:bg-cl-primary peer-checked:after:translate-x-4"></span>
            <span class="text-sm text-cl-text-2">启用自备 Key（关闭则暂时改用系统模型，按积分计费）</span>
        </label>
        <div class="flex items-center gap-4 flex-wrap">
            <button type="button" class="cl-btn-primary" id="llm-save-btn">
                <svg class="w-4 h-4" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-save"/></svg>
                保存我的 AI 配置
            </button>
            <span id="llm-current" class="text-[13px] text-cl-text-3"></span>
        </div>
        <div id="llm-msg"></div>
    </div>

    <!-- ============ 总结设置 ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="cl-section-title">
            <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-notebook-pen"/></svg>
            总结设置
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <label class="block">
                <span class="text-xs font-medium text-cl-text-2 block mb-1.5">总结模式</span>
                <select id="summary-mode"
                    class="h-10 w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
                    <option value="auto">自动</option>
                    <option value="manual">手动</option>
                </select>
            </label>
            <label class="block">
                <span class="text-xs font-medium text-cl-text-2 block mb-1.5">Whisper 语言</span>
                <select id="whisper-language"
                    class="h-10 w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
                    <option value="auto">自动检测</option>
                    <option value="zh">中文</option>
                    <option value="en">英文</option>
                </select>
            </label>
            <label class="block">
                <span class="text-xs font-medium text-cl-text-2 block mb-1.5">自动总结间隔（秒）</span>
                <input type="number" id="auto-interval" min="10" max="3600" placeholder="300"
                    class="h-10 w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            </label>
            <label class="block">
                <span class="text-xs font-medium text-cl-text-2 block mb-1.5">自动总结最大字符数</span>
                <input type="number" id="auto-max-chars" min="100" max="1000000" placeholder="8000"
                    class="h-10 w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            </label>
            <label class="block">
                <span class="text-xs font-medium text-cl-text-2 block mb-1.5">手动总结最大字符数</span>
                <input type="number" id="manual-max-chars" min="100" max="1000000" placeholder="20000"
                    class="h-10 w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            </label>
        </div>
    </div>

    <!-- ============ LLM 调用日志 ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="cl-section-title">
            <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-scroll-text"/></svg>
            LLM 调用日志
        </div>
        <label class="inline-flex items-center gap-3 cursor-pointer">
            <input type="checkbox" id="llm-logging-enabled" class="peer sr-only" checked>
            <span class="w-10 h-6 rounded-full bg-cl-border relative transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-5 after:h-5 after:rounded-full after:bg-white after:shadow after:transition-all peer-checked:bg-cl-primary peer-checked:after:translate-x-4"></span>
            <span class="text-sm text-cl-text-2">记录所有 LLM 调用详情（模型、响应时间、时间戳等）</span>
        </label>
        <div class="flex items-center gap-3 flex-wrap">
            <button type="button" class="cl-btn-ghost" id="st-open-logs">
                <svg class="w-4 h-4" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-history"/></svg>
                查看日志
            </button>
            <button type="button" id="st-clear-logs"
                class="inline-flex items-center justify-center gap-2 h-10 px-5 rounded-clbtn bg-cl-surface text-cl-danger text-sm font-semibold border border-cl-danger/40 hover:bg-red-50 transition-colors cursor-pointer">
                <svg class="w-4 h-4" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-trash-2"/></svg>
                清空日志
            </button>
        </div>
        <div id="st-logs-msg"></div>
    </div>

    <!-- ============ 管理员入口（仅管理员可见） ============ -->
    <div class="cl-card p-6 hidden items-center justify-between gap-4 flex-wrap" id="admin-entry">
        <div>
            <div class="cl-section-title">管理员</div>
            <p class="text-[13px] text-cl-text-2 mt-1">积分参数、系统大模型、卡密管理在管理后台配置</p>
        </div>
        <button type="button" class="cl-btn-ghost" id="st-admin-btn">
            <svg class="w-4 h-4" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-settings"/></svg>
            进入管理后台
        </button>
    </div>

    <!-- 保存按钮（总结/日志设置） -->
    <div class="flex items-center justify-end gap-4">
        <span id="st-save-msg" class="text-[13px] text-cl-text-3"></span>
        <button type="button" class="cl-btn-primary" id="save-config-btn">
            <svg class="w-4 h-4" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-save"/></svg>
            保存设置
        </button>
    </div>
</div>

<script src="/static/js/pm_pages.js"></script>
<script>
(function () {
    'use strict';
    var U = window.pmUtil;
    var esc = U.esc, getJSON = U.getJSON, postJSON = U.postJSON, tk = U.tk;

    // ---- 渲染令牌模式（P024）：片段重注入/快速操作时旧异步链不得写入 DOM ----
    // CodeReview 批6 M-1：令牌按模块独立，子操作重载只作废本模块旧链，不跨模块误伤
    var creditTk = 0, llmTk = 0, otherTk = 0;

    // ---- DOM 引用顶部一次性捕获 ----
    var $ = function (id) { return document.getElementById(id); };
    var elBalance = $('cr-balance'), elEarned = $('cr-earned'), elRecharged = $('cr-recharged'),
        elGranted = $('cr-granted'), elUsed = $('cr-used'), elHint = $('cr-recharge-hint'),
        elTxBody = $('cr-tx-body'), elRedeemCode = $('cr-redeem-code'), elRedeemBtn = $('cr-redeem-btn'),
        elRedeemMsg = $('cr-redeem-msg'),
        elProvider = $('llm-provider'), elKey = $('llm-key'), elModel = $('llm-model'),
        elUrl = $('llm-url'), elUrlRow = $('llm-url-row'), elEnabled = $('llm-enabled'),
        elSaveLlmBtn = $('llm-save-btn'), elLlmCurrent = $('llm-current'), elLlmMsg = $('llm-msg'),
        elSysState = $('llm-sys-state'),
        elSummaryMode = $('summary-mode'), elAutoInterval = $('auto-interval'),
        elAutoMax = $('auto-max-chars'), elManualMax = $('manual-max-chars'),
        elWhisper = $('whisper-language'), elLogging = $('llm-logging-enabled'),
        elOpenLogs = $('st-open-logs'), elClearLogs = $('st-clear-logs'), elLogsMsg = $('st-logs-msg'),
        elAdminEntry = $('admin-entry'), elAdminBtn = $('st-admin-btn'),
        elSaveBtn = $('save-config-btn'), elSaveMsg = $('st-save-msg');

    function fmt(n) { var v = Number(n || 0); return (Math.round(v * 10) / 10).toString(); }
    // 反馈消息一律 textContent（禁止 innerHTML 拼错误信息，防注入）
    function msg(el, text, ok) {
        el.textContent = text;
        el.className = text ? ('text-[13px] font-medium ' + (ok ? 'text-cl-secondary' : 'text-cl-danger')) : '';
        if (text) setTimeout(function () { if (el.textContent === text) { el.textContent = ''; el.className = 'text-[13px] text-cl-text-3'; } }, 5000);
    }

    // ==================== 我的积分 ====================
    var TX_TYPE_LABEL = { llm: 'AI调用', asr: '录音转文字', recharge: '卡密充值', gift: '每日赠送', admin_adjust: '管理员调整' };

    function loadCredits(my) {
        getJSON('/api/credits/balance').then(function (d) {
            if (my !== creditTk || !d) return;
            elBalance.textContent = fmt(d.balance);
            elEarned.textContent = fmt(d.total_earned);
            elRecharged.textContent = fmt(d.total_recharged);
            elGranted.textContent = fmt(d.total_granted);
            elUsed.textContent = fmt(d.total_used);
            // 充值提示：文本+链接用 DOM API 组装，URL 不经 innerHTML
            elHint.textContent = '';
            if (d.recharge_text) elHint.appendChild(document.createTextNode(d.recharge_text + ' '));
            // CodeReview 批6 m-1：仅允许 http(s) 链接，防 javascript: 存储型注入
            if (d.recharge_url && /^https?:\/\//i.test(d.recharge_url)) {
                var a = document.createElement('a');
                a.href = d.recharge_url; a.target = '_blank'; a.rel = 'noopener';
                a.textContent = '前往店铺购买卡密';
                a.className = 'text-cl-primary font-medium underline underline-offset-2';
                elHint.appendChild(a);
                elHint.appendChild(document.createTextNode(' '));
            }
            if (d.credits_per_yuan) elHint.appendChild(document.createTextNode('兑换比例：1 元 = ' + fmt(d.credits_per_yuan) + ' 积分'));
            // CodeReview 批6 m-2：is_admin 翻转时同步收起入口
            if (d.is_admin) { elAdminEntry.classList.remove('hidden'); elAdminEntry.classList.add('flex'); }
            else { elAdminEntry.classList.add('hidden'); elAdminEntry.classList.remove('flex'); }
        }).catch(function () { /* 静默：积分接口异常不阻塞页面 */ });

        getJSON('/api/credits/transactions?limit=20').then(function (rows) {
            if (my !== creditTk) return;
            if (!rows || !rows.length) {
                elTxBody.innerHTML = '<tr><td colspan="5" class="py-6 text-cl-text-3">暂无积分流水</td></tr>';
                return;
            }
            elTxBody.innerHTML = rows.map(function (t) {
                var plus = Number(t.credits_delta) > 0;
                var time = String(t.created_at || '').replace('T', ' ').substring(0, 16);
                return '<tr class="border-b border-cl-border/60 last:border-0">' +
                    '<td class="py-2 pr-4 text-cl-text-2">' + esc(time) + '</td>' +
                    '<td class="py-2 pr-4">' + esc(TX_TYPE_LABEL[t.type] || t.type || '') + '</td>' +
                    '<td class="py-2 pr-4 text-cl-text-2">' + esc(t.scene || t.note || '') + (t.use_own_key ? '（自备Key）' : '') + '</td>' +
                    '<td class="py-2 pr-4 font-semibold ' + (plus ? 'text-cl-secondary' : 'text-cl-danger') + '">' + (plus ? '+' : '') + fmt(t.credits_delta) + '</td>' +
                    '<td class="py-2">' + fmt(t.credits_after) + '</td></tr>';
            }).join('');
        }).catch(function () {});
    }

    function doRedeem() {
        var code = (elRedeemCode.value || '').trim();
        if (!code) { msg(elRedeemMsg, '请输入卡密', false); return; }
        elRedeemBtn.disabled = true;
        postJSON('/api/credits/redeem', { code: code }).then(function (d) {
            elRedeemBtn.disabled = false;
            msg(elRedeemMsg, '兑换成功，入账 ' + fmt(d.credits) + ' 积分，当前余额 ' + fmt(d.balance), true);
            elRedeemCode.value = '';
            loadCredits(++creditTk);
            if (window.llRefreshCreditBadge) { try { window.llRefreshCreditBadge(); } catch (e) {} }
        }).catch(function (e) {
            elRedeemBtn.disabled = false;
            msg(elRedeemMsg, '兑换失败：' + e.message, false);
        });
    }

    // ==================== 用户级大模型配置 ====================
    function toggleUrlRow() {
        elUrlRow.style.display = elProvider.value === 'Ollama' ? 'block' : 'none';
    }

    function loadUserLlm(my) {
        getJSON('/api/user/llm-config').then(function (d) {
            if (my !== llmTk || !d) return;
            if (d.user_config && d.user_config.api_key) {
                elProvider.value = d.user_config.llm_provider || 'DeepSeek';
                elModel.value = d.user_config.model || '';
                elUrl.value = d.user_config.api_url || '';
                elEnabled.checked = !!d.user_config.enabled;
                elKey.placeholder = '已保存：' + d.user_config.api_key + '（留空则不修改）';
                elLlmCurrent.textContent = '当前：' + (d.user_config.enabled ? '已启用自备 ' + d.user_config.llm_provider : '已配置但暂停用');
            } else {
                elLlmCurrent.textContent = '当前：未配置自备 Key（AI 调用将使用系统模型并消耗积分）';
            }
            toggleUrlRow();
            elSysState.textContent = d.system_ready
                ? '系统模型（' + (d.system_provider || '') + '）可用，默认按 ' + fmt(d.token_ratio) + ' Token/积分计费。'
                : '系统模型未就绪，请尽快配置自备 Key。';
            elSysState.className = d.system_ready ? 'block mt-1 text-cl-text-3' : 'block mt-1 text-cl-danger font-medium';
        }).catch(function () {});
    }

    function saveUserLlm() {
        var body = {
            provider: elProvider.value,
            api_key: (elKey.value || '').trim(),
            model: (elModel.value || '').trim(),
            api_url: (elUrl.value || '').trim(),
            enabled: elEnabled.checked
        };
        elSaveLlmBtn.disabled = true;
        postJSON('/api/user/llm-config', body).then(function () {
            elSaveLlmBtn.disabled = false;
            msg(elLlmMsg, '已保存。之后 AI 调用将优先使用您的自备模型，不消耗积分。', true);
            elKey.value = '';
            loadUserLlm(++llmTk);
        }).catch(function (e) {
            elSaveLlmBtn.disabled = false;
            msg(elLlmMsg, '保存失败：' + e.message, false);
        });
    }

    // ==================== 总结 / 日志设置（/api/config 合并更新） ====================
    function loadOtherSettings(my) {
        getJSON('/api/config').then(function (c) {
            if (my !== otherTk) return;
            c = c || {};
            elSummaryMode.value = c.summary_mode || 'auto';
            elAutoInterval.value = c.auto_summary_interval || 300;
            elAutoMax.value = c.auto_summary_max_chars || 8000;
            elManualMax.value = c.manual_summary_max_chars || 20000;
            elWhisper.value = c.whisper_language || 'auto';
            elLogging.checked = c.llm_call_logging_enabled !== false;
        }).catch(function () {});
    }

    function saveOtherSettings() {
        var body = {
            summary_mode: elSummaryMode.value,
            auto_summary_interval: parseInt(elAutoInterval.value, 10) || 300,
            auto_summary_max_chars: parseInt(elAutoMax.value, 10) || 8000,
            manual_summary_max_chars: parseInt(elManualMax.value, 10) || 20000,
            whisper_language: elWhisper.value,
            llm_call_logging_enabled: elLogging.checked
        };
        elSaveBtn.disabled = true;
        fetch('/api/config', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tk() },
            body: JSON.stringify(body)
        }).then(function (r) { return r.json().catch(function () { return {}; }); })
            .then(function (res) {
                elSaveBtn.disabled = false;
                // 协议：_ok(bool) → data=true
                var okv = res && (res.data === true || (res.success === true && res.data !== false));
                msg(elSaveMsg, okv ? '设置已保存' : '保存失败，请重试', !!okv);
            })
            .catch(function () { elSaveBtn.disabled = false; msg(elSaveMsg, '保存请求异常', false); });
    }

    // ==================== 日志查看（SPA 跳转）/ 清空（HTTP，替代旧 Qt 桥） ====================
    elOpenLogs.addEventListener('click', function () { U.goMenu('llm_logs'); });

    elClearLogs.addEventListener('click', function () {
        if (!confirm('确定要清空所有 LLM 调用日志吗？此操作不可撤销。')) return;
        elClearLogs.disabled = true;
        fetch('/api/llm/logs', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + tk() } })
            .then(function (r) { return r.json().catch(function () { return {}; }); })
            .then(function (res) {
                elClearLogs.disabled = false;
                // CodeReview 批6 M-2：与 saveOtherSettings 同口径，_ok(False) 不得误报成功
                var okv = res && (res.data === true || (res.success === true && res.data !== false));
                msg(elLogsMsg, okv ? '日志已清空' : '清空失败，请重试', !!okv);
            })
            .catch(function (e) { elClearLogs.disabled = false; msg(elLogsMsg, '清空异常：' + e.message, false); });
    });

    elAdminBtn.addEventListener('click', function () { location.href = '/admin/credits'; });

    // ==================== 初始化 ====================
    function init() {
        loadCredits(++creditTk);
        loadUserLlm(++llmTk);
        loadOtherSettings(++otherTk);
        elRedeemBtn.addEventListener('click', doRedeem);
        elSaveLlmBtn.addEventListener('click', saveUserLlm);
        elSaveBtn.addEventListener('click', saveOtherSettings);
        elProvider.addEventListener('change', toggleUrlRow);
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
    else { init(); }
})();
</script>
