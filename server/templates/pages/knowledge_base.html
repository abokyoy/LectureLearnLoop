{# 知识库管理：真实数据版（原版为静态占位假数据，产品反馈"分类不能点击/查看全部无效"后重写）。
   数据源：/api/subjects/stats（科目统计）+ /api/knowledge/points?subject=（按科目知识点）。 #}
<div class="bg-white rounded-xl shadow-sm p-6">
    <div class="mb-6">
        <h3 class="text-xl font-semibold text-text-dark-brown mb-1">知识库管理</h3>
        <p class="text-text-gray text-sm">按科目浏览已提取的知识点（数据来自你的学习记录，按用户隔离）</p>
    </div>

    <!-- 总览统计（真实计算） -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-6 text-center">
            <span class="material-icons-outlined text-4xl text-blue-600 mb-2">folder</span>
            <p class="text-3xl font-bold text-blue-600" id="kb-stat-subjects">–</p>
            <p class="text-sm text-blue-500">个科目</p>
        </div>
        <div class="bg-green-50 border border-green-200 rounded-lg p-6 text-center">
            <span class="material-icons-outlined text-4xl text-green-600 mb-2">lightbulb</span>
            <p class="text-3xl font-bold text-green-600" id="kb-stat-points">–</p>
            <p class="text-sm text-green-500">个知识点</p>
        </div>
        <div class="bg-purple-50 border border-purple-200 rounded-lg p-6 text-center">
            <span class="material-icons-outlined text-4xl text-purple-600 mb-2">trending_up</span>
            <p class="text-3xl font-bold text-purple-600" id="kb-stat-mastery">–</p>
            <p class="text-sm text-purple-500">平均掌握度</p>
        </div>
    </div>

    <!-- 科目分类（可点击 → 下方列出该科目知识点） -->
    <div class="bg-gray-50 rounded-lg p-6 mb-6">
        <h4 class="text-lg font-semibold text-text-dark-brown mb-4">科目分类</h4>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="kb-subject-grid">
            <p class="col-span-full text-sm text-gray-500">正在加载科目…</p>
        </div>
    </div>

    <!-- 知识点列表（随选中科目变化） -->
    <div class="bg-white border border-gray-200 rounded-lg p-6 mb-6">
        <div class="flex items-center justify-between mb-4">
            <h4 class="text-lg font-semibold text-text-dark-brown" id="kb-list-title">最近更新的知识点</h4>
            <button class="text-primary hover:underline text-sm" onclick="kbShowRecent()">查看全部科目</button>
        </div>
        <div class="space-y-3" id="kb-point-list">
            <p class="text-sm text-gray-500">正在加载知识点…</p>
        </div>
    </div>

    <p class="text-xs text-gray-400 text-center">提示：知识点的生成与练习请前往「学」与「练」模块。</p>
</div>

<script>
(function () {
    var bridge = window.bridge || window.pybridge;
    var grid = document.getElementById('kb-subject-grid');
    var listTitle = document.getElementById('kb-list-title');
    var listBox = document.getElementById('kb-point-list');
    var statSubjects = document.getElementById('kb-stat-subjects');
    var statPoints = document.getElementById('kb-stat-points');
    var statMastery = document.getElementById('kb-stat-mastery');

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function masteryBadge(score) {
        var v = Math.round(score || 0);
        var cls = v >= 80 ? 'bg-green-100 text-green-800' : (v >= 60 ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800');
        var label = v >= 80 ? '已掌握' : (v >= 60 ? '学习中' : '待复习');
        return '<span class="' + cls + ' px-2 py-1 rounded text-xs">' + label + ' ' + v + '</span>';
    }

    function renderPoints(points, title) {
        listTitle.textContent = title;
        if (!points.length) {
            listBox.innerHTML = '<p class="text-sm text-gray-500">该科目下暂无知识点。可先到「学 → 基于学习资料/在线课程」提取知识点。</p>';
            return;
        }
        listBox.innerHTML = points.map(function (p) {
            return '<div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">'
                + '<div class="flex items-center min-w-0">'
                + '<span class="material-icons-outlined text-blue-600 mr-3">lightbulb</span>'
                + '<div class="min-w-0"><p class="font-medium text-text-dark-brown truncate">' + esc(p.name || p.point_name) + '</p>'
                + '<p class="text-sm text-gray-600 truncate">' + esc(p.subject || '') + (p.created_time ? ' | ' + esc(p.created_time) : '') + '</p></div></div>'
                + masteryBadge(p.mastery_score)
                + '</div>';
        }).join('');
    }

    window.kbShowSubject = function (subject) {
        if (!bridge) return;
        listBox.innerHTML = '<p class="text-sm text-gray-500">加载中…</p>';
        bridge.getSubjectKnowledgePoints(subject).then(function (r) {
            var points = typeof r === 'string' ? JSON.parse(r || '[]') : (r || []);
            renderPoints(points.slice(0, 50), subject + ' 的知识点（' + points.length + '）');
        }).catch(function (e) {
            listBox.innerHTML = '<p class="text-sm text-red-500">加载失败：' + esc(e && e.message || e) + '</p>';
        });
    };

    var allPointsCache = [];
    window.kbShowRecent = function () {
        var recent = allPointsCache.slice().sort(function (a, b) {
            return String(b.created_time || '').localeCompare(String(a.created_time || ''));
        }).slice(0, 20);
        renderPoints(recent, '最近更新的知识点（全部科目）');
    };

    function init() {
        if (!bridge || !bridge.getAllSubjects) {
            grid.innerHTML = '<p class="col-span-full text-sm text-red-500">桥接层未就绪，请刷新页面重试</p>';
            return;
        }
        bridge.getAllSubjects().then(function (r) {
            var subjects = typeof r === 'string' ? JSON.parse(r || '[]') : (r || []);
            statSubjects.textContent = subjects.length;
            if (!subjects.length) {
                grid.innerHTML = '<p class="col-span-full text-sm text-gray-500">暂无科目。请到「练 → 基于学习资料练习 → 科目管理」创建科目，再到「学」提取知识点。</p>';
                listBox.innerHTML = '<p class="text-sm text-gray-500">暂无知识点</p>';
                return;
            }
            grid.innerHTML = subjects.map(function (s) {
                var name = s.name || s.subject_name;
                return '<div class="bg-white border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow cursor-pointer" onclick="kbShowSubject(\'' + esc(name).replace(/'/g, "\\'") + '\')">'
                    + '<div class="flex items-center mb-2"><span class="material-icons-outlined text-blue-600 mr-2">folder</span>'
                    + '<span class="font-medium text-text-dark-brown truncate">' + esc(name) + '</span></div>'
                    + '<p class="text-sm text-gray-600">' + (s.knowledge_count || s.kp_count || 0) + ' 个知识点</p></div>';
            }).join('');
            // 汇总真实知识点：逐科目拉取（科目数量有限，一次性加载）
            return Promise.all(subjects.map(function (s) {
                var name = s.name || s.subject_name;
                return bridge.getSubjectKnowledgePoints(name).then(function (r2) {
                    var pts = typeof r2 === 'string' ? JSON.parse(r2 || '[]') : (r2 || []);
                    return pts.map(function (p) { p.subject = name; return p; });
                }).catch(function () { return []; });
            }));
        }).then(function (lists) {
            if (!lists) return;
            allPointsCache = [];
            var sum = 0, n = 0;
            lists.forEach(function (pts) {
                pts.forEach(function (p) {
                    allPointsCache.push(p);
                    if (p.mastery_score !== undefined && p.mastery_score !== null) { sum += Number(p.mastery_score) || 0; n++; }
                });
            });
            statPoints.textContent = allPointsCache.length;
            statMastery.textContent = n ? Math.round(sum / n) + '%' : '–';
            window.kbShowRecent();
        }).catch(function (e) {
            grid.innerHTML = '<p class="col-span-full text-sm text-red-500">加载失败：' + esc(e && e.message || e) + '</p>';
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 50); });
    } else {
        setTimeout(init, 50);
    }
})();
</script>
