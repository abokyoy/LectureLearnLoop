    if (card) card.classList.add('hidden');
}

// ==================== 学习路径显示模式与悬停提示（线性/树两视图共用） ====================
// 全图适配：viewBox=内容尺寸（看结构，字会被压缩）；实际大小：viewBox=容器像素 1:1（字清晰），
// 内容大于画布时用拖拽平移浏览（d3.zoom 原生支持）
function applyLpFitView() {
    const svgEl = document.getElementById('mindmapSvg');
    if (!svgEl || !svg || !zoom) return;
    if (lpActualSize) {
        const cw = svgEl.clientWidth || 1200, ch = svgEl.clientHeight || 700;
        svg.attr('viewBox', `0 0 ${cw} ${ch}`);
        // 1:1 取景：优先对准学习路径起点（第一列），避免落在连线密集区；超出部分拖拽浏览
        const fx = _lpContentFocus ? _lpContentFocus.x : _lpContentSize.w / 2;
        const fy = _lpContentFocus ? _lpContentFocus.y : _lpContentSize.h / 2;
        svg.call(zoom.transform, d3.zoomIdentity.translate(cw / 2 - fx, ch / 2 - fy));
    } else {
        svg.attr('viewBox', `0 0 ${_lpContentSize.w} ${_lpContentSize.h}`);
        svg.call(zoom.transform, d3.zoomIdentity);
    }
}

function toggleLpActualSize() {
    lpActualSize = !lpActualSize;
    const btn = document.getElementById('lpSizeToggle');
    if (btn) btn.textContent = lpActualSize ? '查看全图' : '实际大小';
    hideLpTooltip();
    applyLpFitView();
    log(`🔍 学习路径显示模式: ${lpActualSize ? '实际大小(可拖拽)' : '全图适配'}`);
}

// 悬停提示内容：全名 + 状态 + 前序清单（文本字段全部转义，防 XSS）
function lpNodeTipHtml(n) {
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const typeLabel = n.type === 'goal' ? '最终掌握目标'
        : n.type === 'stage' ? '学习阶段'
        : n.type === 'start' ? '学习起点'
        : n.type === 'end' ? '学习终点'
        : (n.type === 'supplement_kp' ? 'AI 补充知识点' : '已有知识点');
    const parts = [`<div class="font-bold text-sm mb-1">${esc(n.name || '')}</div>`, `<div>${typeLabel}</div>`];
    if (n.type === 'existing_kp') {
        // -1 是"未评估"哨兵值（与 openLearningPathNodeDetail 同口径），不向用户露出
        parts.push((n.mastery_score == null || n.mastery_score < 0) ? '<div>掌握度：未评估</div>' : `<div>掌握度：${esc(n.mastery_score)}%</div>`);
    }
    // 主线 stage/起终点卡与知识点卡都需要描述位（卡片只显标题，描述收在悬停提示里）
    if (n.description) parts.push(`<div class="mt-1">${esc(n.description)}</div>`);
    if (n.type !== 'goal' && Array.isArray(n.prerequisites) && n.prerequisites.length) {
        const names = n.prerequisites.map(p => {
            const m = (currentLearningPathData.nodes || []).find(x => x.id === p);
            return m ? m.name : p;
        });
        parts.push(`<div class="mt-1">前序：${names.map(esc).join('、')}</div>`);
    }
    return parts.join('');
}

function showLpTooltip(event, html) {
    const tip = document.getElementById('lpTooltip');
    if (!tip || !html) return;
    tip.innerHTML = html;
    tip.classList.remove('hidden');
    moveLpTooltip(event);
}

function moveLpTooltip(event) {
    const tip = document.getElementById('lpTooltip');
    if (!tip || tip.classList.contains('hidden')) return;
    const w = tip.offsetWidth || 220, h = tip.offsetHeight || 60;
    let x = event.clientX + 14, y = event.clientY + 12;
    if (x + w > window.innerWidth - 8) x = event.clientX - w - 10;
    if (y + h > window.innerHeight - 8) y = event.clientY - h - 10;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
}

function hideLpTooltip() {
    const tip = document.getElementById('lpTooltip');
    if (tip) tip.classList.add('hidden');
}

// ==================== 技能树视图（DAG 分层，左→右） ====================
// 数据源与线性图完全同一：同一批知识点节点，只是用 prerequisites 依赖边组织成技能树；
// 一个节点可有多个前序（如 C ← A,B,D），最右侧为“掌握目标”汇总节点。
function renderLearningPathTree() {
    if (!currentLearningPathData || !Array.isArray(currentLearningPathData.nodes)) {
        log('❌ 学习路径数据无效，无法渲染技能树');
        return;
    }
    // 评审修复：空节点判定必须在 initSvg（会清空画布）之前，否则早退后留下空白画布；
    // 无知识点节点时回退线性视图兜底
    const kpNodesRaw = currentLearningPathData.nodes
        .filter(n => n.type === 'existing_kp' || n.type === 'supplement_kp');
    if (kpNodesRaw.length === 0) {
        log('⚠️ 技能树：无知识点节点，回退线性视图');
        currentLpViewMode = 'linear';
        updateLpTabStyles();
        renderLearningPath();
        return;
    }
    if (!initSvg()) { log('❌ SVG初始化失败'); return; }
    // 评审修复：同线性视图，重绘即复位高亮态
    currentHighlightedStage = null;
    hideStageInfo();
    
    // 1) 取知识点节点（与线性图同一批节点，不含 stage/start/end）
    const kpNodes = kpNodesRaw
        .map(n => ({ ...n, prerequisites: Array.isArray(n.prerequisites) ? n.prerequisites.slice() : [] }));
    const byId = new Map(kpNodes.map(n => [n.id, n]));
    kpNodes.forEach(n => { n.prerequisites = n.prerequisites.filter(p => byId.has(p) && p !== n.id); });
    
    // 2) 分层 depth = 最长依赖链深度（记忆化 DFS，visiting 防环）
    const depthMemo = new Map();
    const visiting = new Set();
    function calcDepth(node) {
        if (depthMemo.has(node.id)) return depthMemo.get(node.id);
        if (visiting.has(node.id)) return 0;  // 成环极端情况：断开处理
        visiting.add(node.id);
        let d = 0;
        if (node.prerequisites.length > 0) {
            d = 1 + Math.max(...node.prerequisites.map(p => calcDepth(byId.get(p))));
        }
        visiting.delete(node.id);
        depthMemo.set(node.id, d);
        return d;
    }
    kpNodes.forEach(n => calcDepth(n));
    
    // 3) 没有任何依赖边（老缓存升级失败/全部空数组）：退化为按 level+parent_stage 单链，保证画得出
    const hasAnyDep = kpNodes.some(n => n.prerequisites.length > 0);
    if (!hasAnyDep && kpNodes.length > 1) {
        log('⚠️ 技能树：无依赖数据，退化为按阶段顺序串联');
        const sorted = kpNodes.slice().sort((a, b) =>
            (a.level || 0) - (b.level || 0) || String(a.parent_stage || '').localeCompare(String(b.parent_stage || '')) || String(a.id).localeCompare(String(b.id)));
        depthMemo.clear();
        sorted.forEach((n, i) => {
            depthMemo.set(n.id, i);
            n.prerequisites = i > 0 ? [sorted[i - 1].id] : [];
        });
    }
    
    // 4) 目标节点（最右）：所有“不被任何节点依赖”的叶子连向它
    const referenced = new Set();
    kpNodes.forEach(n => n.prerequisites.forEach(p => referenced.add(p)));
    const frontier = kpNodes.filter(n => !referenced.has(n.id));
    const maxDepth = Math.max(0, ...kpNodes.map(n => depthMemo.get(n.id) || 0));
    const goalNode = { id: 'lp_goal', name: `掌握${currentSubjectName || ''}`, type: 'goal', prerequisites: frontier.map(f => f.id) };
    depthMemo.set(goalNode.id, maxDepth + 1);
    
    // 5) 依赖边：前序 → 被依赖（箭头向右，符合“从左往右逐步点亮”的阅读方向）
    const treeEdges = [];
    kpNodes.forEach(n => n.prerequisites.forEach(p => treeEdges.push({ source: p, target: n.id, kind: 'dep' })));
    frontier.forEach(f => treeEdges.push({ source: f.id, target: goalNode.id, kind: 'goal' }));
    const drawNodes = kpNodes.concat([goalNode]);
    
    // 6) 布局：dagre 分层布局引擎（Sugiyama 交叉最小化，边端点自动裁到卡片边界），
    //    库不可用/异常时回退手写分列布局；viewBox 由 applyLpFitView 按显示模式统一应用
    const CARD_W = 168, CARD_H = 52;
    let layoutOk = false;
    if (typeof dagre !== 'undefined' && dagre.graphlib && typeof dagre.layout === 'function') {
        try {
            const dg = new dagre.graphlib.Graph();
            dg.setGraph({ rankdir: 'LR', nodesep: 26, ranksep: 96, marginx: 40, marginy: 40 });
            dg.setDefaultEdgeLabel(() => ({}));
            drawNodes.forEach(n => dg.setNode(n.id, { width: CARD_W, height: CARD_H }));
            treeEdges.forEach(e => { if (!dg.hasEdge(e.source, e.target)) dg.setEdge(e.source, e.target); });
            dagre.layout(dg);  // 内部先自动破环（greedy-fas），脏数据不会挂死
            drawNodes.forEach(n => { const p = dg.node(n.id); if (p) { n.x = p.x; n.y = p.y; } });
            treeEdges.forEach(e => { const pe = dg.edge(e.source, e.target); if (pe) e.points = pe.points; });
            _lpContentSize = {
                w: Math.max(1200, (dg.graph().width || 1200) + 40),
                h: Math.max(700, (dg.graph().height || 700) + 40),
            };
            // 取景中心对准第一列（学习路径起点）：实际大小模式首屏不落在乱线区
            let minX = Infinity;
            drawNodes.forEach(n => { if (typeof n.x === 'number') minX = Math.min(minX, n.x); });
            const firstCol = drawNodes.filter(n => Math.abs((n.x || 0) - minX) < 1);
            if (firstCol.length) {
                _lpContentFocus = { x: minX, y: firstCol.reduce((s, n) => s + n.y, 0) / firstCol.length };
            } else {
                _lpContentFocus = null;  // 防御：异常时退化到内容中心，不沿用上一轮旧坐标
            }
            layoutOk = true;
        } catch (e) {
            log(`⚠️ dagre 布局异常，回退手写分层: ${e.message}`);
        }
    } else {
        log('⚠️ dagre 未加载，回退手写分层布局');
    }
    if (!layoutOk) {
        // 回退：按最长依赖链深度手写分列（列内垂直居中）
        const colSpacing = 360, rowSpacing = 170, padX = 220, padY = 90;
        const cols = new Map();
        drawNodes.forEach(n => {
            const d = depthMemo.get(n.id) || 0;
            if (!cols.has(d)) cols.set(d, []);
            cols.get(d).push(n);
        });
        let maxRows = 1;
        cols.forEach(arr => { maxRows = Math.max(maxRows, arr.length); });
        const contentWidth = padX * 2 + (maxDepth + 1) * colSpacing;
        const contentHeight = Math.max(700, (maxRows - 1) * rowSpacing + padY * 2);
        _lpContentSize = { w: Math.max(3200, contentWidth), h: contentHeight };
        const centerY = contentHeight / 2;
        cols.forEach((arr, d) => {
            arr.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'zh'));
            arr.forEach((n, i) => {
                n.x = padX + d * colSpacing;
                n.y = centerY + (i - (arr.length - 1) / 2) * rowSpacing;
            });
        });
        _lpContentFocus = { x: padX, y: centerY };
    }
    applyLpFitView();
    
    // 7) 箭头 marker + 卡片投影
    const defs = svg.append('defs');
    const shadow = defs.append('filter')
        .attr('id', 'treeCardShadow')
        .attr('x', '-20%').attr('y', '-30%').attr('width', '140%').attr('height', '160%');
    shadow.append('feDropShadow')
        .attr('dx', 0).attr('dy', 1).attr('stdDeviation', 2)
        .attr('flood-color', '#000000').attr('flood-opacity', 0.16);
    defs.append('marker')
        .attr('id', 'treeArrow').attr('viewBox', '0 -5 10 10')
        .attr('refX', 10).attr('refY', 0)
        .attr('markerWidth', 7).attr('markerHeight', 7)
        .attr('orient', 'auto')
        .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', '#90A4AE');
    
    // 8) 连线：dagre 给出的边点序列（已裁到卡片边界）画平滑曲线；回退布局时画直线
    const nodeById = new Map(drawNodes.map(n => [n.id, n]));
    const lineGen = d3.line().x(p => p.x).y(p => p.y).curve(d3.curveBasis);
    const links = g.selectAll('.tree-link')
        .data(treeEdges)
        .enter().append('path')
        .attr('class', 'tree-link')
        .attr('fill', 'none')
        .attr('stroke', e => e.kind === 'goal' ? '#FF9800' : '#90A4AE')
        .attr('stroke-width', e => e.kind === 'goal' ? 2.2 : 1.5)
        .attr('opacity', 0.85)
        .attr('d', e => {
            if (e.points && e.points.length > 1) return lineGen(e.points);
            // 回退直线：端点裁到卡片矩形边界（dagre 正常时 points 已裁），否则箭头被白底卡片盖住
            const s = nodeById.get(e.source), t = nodeById.get(e.target);
            const dx = t.x - s.x, dy = t.y - s.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const kx = Math.abs(ux) > 1e-6 ? (CARD_W / 2 + 2) / Math.abs(ux) : Infinity;
            const ky = Math.abs(uy) > 1e-6 ? (CARD_H / 2 + 2) / Math.abs(uy) : Infinity;
            const k = Math.min(kx, ky, len / 2);
            return `M${s.x + ux * k},${s.y + uy * k}L${t.x - ux * k},${t.y - uy * k}`;
        });
    if (treeEdges.length) links.attr('marker-end', 'url(#treeArrow)');
    
    // 9) 节点：圆角卡片（游戏技能树形态），左侧色条保留"点亮"语义（黄=已学/灰=未评估/绿=补充）；
    //    颜色与点击详情与线性图同口径；悬停出全名/状态/前序，不用放大也能读
    const nodeGroups = g.selectAll('.tree-node')
        .data(drawNodes)
        .enter().append('g')
        .attr('class', 'tree-node')
        .attr('transform', n => `translate(${n.x},${n.y})`)
        .style('cursor', n => (n.type === 'existing_kp' && n.original_kp_id) ? 'pointer' : 'default')
        .on('click', function(event, n) {
            if (n.type === 'existing_kp' && n.original_kp_id) {
                event.stopPropagation();
                openLearningPathNodeDetail(n);
            }
        })
        .on('mouseover', function(event, n) { showLpTooltip(event, lpNodeTipHtml(n)); })
        .on('mousemove', function(event) { moveLpTooltip(event); })
        .on('mouseout', hideLpTooltip);
    
    // 卡片绘制抽为公共函数与线性视图共用（drawLpCard），消除同款样式的双实现
    nodeGroups.each(function(n) {
        drawLpCard(d3.select(this), n, n.type === 'goal');
    });
    
    // 10) 图例（HTML 卡片，与线性图同款修复）
    showLearningLegend('tree');
    
    log(`✅ 技能树渲染完成: ${drawNodes.length}个节点, ${treeEdges.length}条依赖`);
}

// 全局变量存储当前突出显示的状态
let currentHighlightedStage = null;
let globalNodes = [];
let globalEdges = [];
let globalLinks = null;
let globalNodeGroups = null;

// 突出显示stage节点及其子节点
function highlightStageAndChildren(stageNode) {
    log(`🎯 点击stage节点: ${stageNode.name} (${stageNode.id})`);
    log(`🔍 当前突出显示状态: ${currentHighlightedStage ? currentHighlightedStage.id : 'null'}`);
    
    // 检查全局变量是否已初始化
    if (!globalNodes || !globalEdges || !globalLinks || !globalNodeGroups) {
        log('❌ 全局变量未初始化，无法执行突出显示');
        return;
    }
    
    log(`✅ 全局变量检查通过: nodes=${globalNodes.length}, edges=${globalEdges.length}`);
    
    // 如果点击的是已经突出显示的节点，则恢复正常显示
    if (currentHighlightedStage && currentHighlightedStage.id === stageNode.id) {
        log(`🔄 检测到重复点击同一节点: ${stageNode.id}，执行恢复操作`);
        resetHighlight();
        return;
    }
    
    // 如果已经有突出显示的节点，先记录切换信息
    if (currentHighlightedStage) {
        log(`🔀 从 ${currentHighlightedStage.id} 切换到 ${stageNode.id}`);
    }
    
    // 更新当前突出显示的节点
    currentHighlightedStage = stageNode;
    
    // 找到该stage的所有子知识点（卡片化后边为渲染时手动解析的 {s,t,kind} 结构）
    // 评审修复：主线相邻阶段（start/stage/end 之间的 main 边）不算子知识点，
    // 否则阶段信息框计数虚高、相邻主线卡也跟着亮起
    const childrenIds = new Set();
    globalEdges.forEach(edge => {
        if (edge.kind === 'main') return;
        if (edge.s && edge.s.id === stageNode.id) childrenIds.add(edge.t.id);
        else if (edge.t && edge.t.id === stageNode.id) childrenIds.add(edge.s.id);
    });
    log(`📋 找到${childrenIds.size}个子节点`);
    const isRelated = d => d.id === stageNode.id || childrenIds.has(d.id);

    // 整组卡片淡出/突出（含卡内文字，不再单独操作圆圈）
    globalNodeGroups.transition()
        .duration(300)
        .style('opacity', d => isRelated(d) ? 1.0 : 0.2);

    // 突出显示相关连线，淡化其他连线
    globalLinks.transition()
        .duration(300)
        .style('opacity', e => (e.s.id === stageNode.id || e.t.id === stageNode.id) ? 1.0 : 0.1)
        .attr('stroke-width', e => {
            const on = e.s.id === stageNode.id || e.t.id === stageNode.id;
            if (on) return e.kind === 'main' ? 3.5 : 2.5;
            return e.kind === 'main' ? 2.5 : 1.5;
        });
    
    // 显示提示信息
    showStageInfo(stageNode, childrenIds.size);
}

// 恢复正常显示
function resetHighlight() {
    log('🔄 恢复正常显示');
    currentHighlightedStage = null;
    
    // 检查全局变量是否已初始化
    if (!globalNodes || !globalEdges || !globalLinks || !globalNodeGroups) {
        log('❌ 全局变量未初始化，无法执行恢复显示');
        return;
    }
    
    // 恢复所有卡片组的正常不透明度（卡片化后整组恢复）
    globalNodeGroups.transition().duration(300).style('opacity', 1.0);

    // 恢复所有连线的基准透明度与线宽
    globalLinks.transition()
        .duration(300)
        .style('opacity', e => e.kind === 'main' ? 1.0 : 0.85)
        .attr('stroke-width', e => e.kind === 'main' ? 2.5 : 1.5);
    
    // 隐藏提示信息
    hideStageInfo();
}

// 显示stage信息
function showStageInfo(stageNode, childrenCount) {
    // 移除现有的信息框
    d3.select('#stageInfoBox').remove();
    
    // 创建信息框
    const infoBox = d3.select('#mindmapSvgContainer')
        .append('div')
        .attr('id', 'stageInfoBox')
        .style('position', 'absolute')
        .style('top', '10px')
        .style('right', '10px')
        .style('background', 'rgba(0,0,0,0.8)')
        .style('color', 'white')
        .style('padding', '10px')
        .style('border-radius', '5px')
        .style('font-size', '14px')
        .style('max-width', '300px')
        .style('z-index', '1000')
        .style('opacity', '0');
    
    const escStage = String(stageNode.name == null ? '' : stageNode.name).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    infoBox.html(`
        <div style="font-weight: bold; margin-bottom: 5px;">📚 ${escStage}</div>
        <div style="font-size: 12px; color: #ccc;">包含 ${childrenCount} 个知识点</div>
        <div style="font-size: 11px; color: #999; margin-top: 5px;">点击其他stage切换 | 再次点击恢复</div>
    `);
    
    // 淡入动画
    infoBox.transition()
        .duration(300)
        .style('opacity', '1');
}

// 隐藏stage信息
function hideStageInfo() {
    d3.select('#stageInfoBox')
        .transition()
        .duration(300)
        .style('opacity', '0')
        .remove();
}

// 拖拽相关函数
function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
}

function dragged(event, d) {
    if (d.type === 'start' || d.type === 'stage' || d.type === 'end') {
        // 主线节点只能水平拖拽，Y坐标固定
        d.fx = event.x;
        d.fy = 350; // 强制保持在水平线上
    } else {
        // 知识点节点可以自由拖拽
        d.fx = event.x;
        d.fy = event.y;
    }
}

function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    if (d.type === 'start' || d.type === 'stage' || d.type === 'end') {
        // 主线节点保持固定位置
        d.fx = d.x;
        d.fy = 350;
    } else if (d.type === 'existing_kp' || d.type === 'supplement_kp') {
        // 知识点节点：保持在当前拖动位置，不要释放固定
        d.fx = d.x;
        d.fy = d.y;
        log(`🔒 拖动结束，固定知识点 ${d.name} 在新位置: (${d.fx}, ${d.fy})`);
    } else {
        // 其他节点释放固定
        d.fx = null;
        d.fy = null;
    }
}
