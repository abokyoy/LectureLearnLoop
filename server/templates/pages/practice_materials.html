    <script>
    (function () {
        var tk = '';
        try { tk = localStorage.getItem('ll_token') || sessionStorage.getItem('ll_token') || ''; } catch (e) { /* ignore */ }
        if (!tk) {
            location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search));
        }
    })();

    <!-- 统一弹窗：覆盖原生 alert（与 base.html 同款样式） -->
    <script>
    (function () {
        if (window.__llAlertInstalled) return; window.__llAlertInstalled = true;
        var style = document.createElement('style');
        style.textContent = '.ll-alert-mask{position:fixed;inset:0;background:rgba(30,41,99,.35);display:flex;align-items:center;justify-content:center;z-index:2147483000;font-family:"Segoe UI","Microsoft YaHei",sans-serif}'
            + '.ll-alert-box{min-width:280px;max-width:420px;background:#fff;border-radius:16px;padding:24px 22px 18px;box-shadow:0 20px 60px rgba(30,41,99,.35)}'
            + '.ll-alert-msg{font-size:14px;color:#1e2a5a;line-height:1.6;white-space:pre-wrap;text-align:center}'
            + '.ll-alert-btn{margin:18px auto 0;display:block;padding:8px 28px;border:0;border-radius:10px;background:linear-gradient(90deg,#4c6ef5,#7c3aed);color:#fff;font-size:14px;font-weight:600;cursor:pointer}';
        document.head.appendChild(style);
        window.alert = function (message) {
            var mask = document.createElement('div'); mask.className = 'll-alert-mask';
            var box = document.createElement('div'); box.className = 'll-alert-box';
            var m = document.createElement('div'); m.className = 'll-alert-msg'; m.textContent = String(message == null ? '' : message);
            var b = document.createElement('button'); b.className = 'll-alert-btn'; b.type = 'button'; b.textContent = '确 定';
            function close() { mask.remove(); document.removeEventListener('keydown', onKey); }
            function onKey(e) { if (e.key === 'Enter' || e.key === 'Escape') close(); }
            b.onclick = close; document.addEventListener('keydown', onKey);
            box.appendChild(m); box.appendChild(b); mask.appendChild(box);
            function mount() { document.body.appendChild(mask); b.focus(); }
            if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);
        };
    })();
    </script>
    <!-- 嵌入 SPA 壳（iframe）时提供“返回工作台”按钮：脑图练习不再是没有出口的死角页 -->
    <script>
    (function () {
        if (window.self === window.top) return; // 独立整页打开时不显示（无父框架可返）
        function mountBackBtn() {
            if (document.getElementById('ll-back-btn')) return;
            var b = document.createElement('button');
            b.id = 'll-back-btn';
            b.textContent = '⌂ 返回工作台';
            b.style.cssText = 'position:fixed;top:10px;left:12px;z-index:9999;padding:8px 16px;border:0;border-radius:10px;background:#4c6ef5;color:#fff;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(30,41,99,.3);font-family:"Segoe UI","Microsoft YaHei",sans-serif;';
            b.onclick = function () { try { parent.location.href = '/'; } catch (e) { location.href = '/'; } };
            document.body.appendChild(b);
        }
        if (document.body) mountBackBtn(); else document.addEventListener('DOMContentLoaded', mountBackBtn);
    })();
    </script>

<script>
// 使用全局WebChannel连接（来自base.html）
let pybridge = null;

// 等待全局WebChannel就绪
let isPageInitialized = false;

function initializePage() {
    if (window.bridge) {
        pybridge = window.bridge;
        window.pybridge = pybridge;  // 为兼容性保留别名
        console.log('🔗 知识脑图页面使用全局WebChannel连接');
        
        // WebChannel就绪后，触发页面初始化
        if (typeof window.addDebugLog === 'function') {
            window.addDebugLog('🔗 使用全局WebChannel连接，pybridge已就绪');
        }
        
        isPageInitialized = true;
        
        // 自动尝试加载科目列表
        setTimeout(() => {
            if (typeof loadSubjects === 'function') {
                loadSubjects();
            }
        }, 100);
        
        return true; // 初始化成功
    } else {
        // 如果全局WebChannel还未就绪，等待bridgeReady事件
        document.addEventListener('bridgeReady', function() {
            initializePage();
        }, { once: true }); // 只监听一次
        
        return false; // 初始化未完成
    }
}

// 强制重新初始化（用于页面切换后重新进入）
function forceReinitialize() {
    if (typeof window.addDebugLog === 'function') {
        window.addDebugLog('🔄 强制重新初始化知识脑图页面');
    }
    
    // 重置所有相关状态
    isPageInitialized = false;
    isLoadingSubjects = false; // 重置加载标志
    
    // 重新初始化
    if (!initializePage()) {
        // 如果WebChannel还未就绪，使用重试机制
        tryLoadSubjectsWithRetry();
    }
}

// 带重试机制的科目加载
function tryLoadSubjectsWithRetry(retryCount = 0) {
    if (window.bridge && window.bridge.getSubjectsWithKnowledgeCount) {
        if (typeof window.addDebugLog === 'function') {
            window.addDebugLog('✅ WebChannel已准备就绪，开始加载科目');
        }
        loadSubjects();
    } else if (retryCount < 10) {
        if (typeof window.addDebugLog === 'function') {
            window.addDebugLog(`⏳ WebChannel未就绪，等待中... (${retryCount + 1}/10)`);
        }
        setTimeout(() => tryLoadSubjectsWithRetry(retryCount + 1), 500);
    } else {
        if (typeof window.addDebugLog === 'function') {
            window.addDebugLog('❌ WebChannel初始化超时，显示错误信息');
        }
        const container = document.getElementById('subjectsContainer');
        if (container) {
            container.innerHTML = `
                <div class="col-span-full text-center py-8 text-red-600">
                    <span class="material-icons-outlined text-4xl mb-4">error</span>
                    <p class="text-lg font-semibold mb-2">WebChannel连接失败</p>
                    <p class="text-sm mb-4">前后端通信未建立，请刷新页面重试</p>
                    <button onclick="forceReinitialize()" 
                            class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 mr-2">
                        重新初始化
                    </button>
                    <button onclick="location.reload()" 
                            class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600">
                        刷新页面
                    </button>
                </div>
            `;
        }
    }
}

// 页面加载时初始化
initializePage();

// 定义全局回调函数，供base.html调用
window.onBridgeReady = function() {
    if (typeof window.addDebugLog === 'function') {
        window.addDebugLog('🔗 收到bridgeReady回调，重新初始化知识脑图页面');
    }
    
    // 重置状态并重新初始化
    isPageInitialized = false;
    initializePage();
};

// 页面可见性检查机制
let pageVisibilityCheckInterval = null;

function startPageVisibilityCheck() {
    // 清除之前的检查
    if (pageVisibilityCheckInterval) {
        clearInterval(pageVisibilityCheckInterval);
    }
    
    // 每2秒检查一次页面是否可见
    pageVisibilityCheckInterval = setInterval(() => {
        const subjectPage = document.getElementById('subjectSelectionPage');
        const mindmapPage = document.getElementById('mindmapPage');
        
        // 检查知识脑图页面是否可见
        const isKnowledgeMindmapVisible = subjectPage && !subjectPage.classList.contains('hidden');
        
        if (isKnowledgeMindmapVisible) {
            // 检查科目容器是否显示加载状态
            const container = document.getElementById('subjectsContainer');
            if (container && container.innerHTML.includes('正在加载学科列表')) {
                if (typeof window.addDebugLog === 'function') {
                    window.addDebugLog('🔍 检测到页面卡在加载状态，尝试重新初始化');
                }
                
                // 重新初始化
                forceReinitialize();
            }
        }
    }, 2000);
}

// 停止页面可见性检查
function stopPageVisibilityCheck() {
    if (pageVisibilityCheckInterval) {
        clearInterval(pageVisibilityCheckInterval);
        pageVisibilityCheckInterval = null;
    }
}

// 启动页面可见性检查
startPageVisibilityCheck();

// 全局变量
let currentSubjectName = '';
let filteredNodeId = null; // 当前筛选的节点ID
let originalNodesVisibility = new Map(); // 保存原始节点可见性状态
let searchResults = new Set(); // 搜索结果节点ID集合
let isSearchActive = false; // 搜索状态标记

// 科目管理相关变量
let allSubjects = [];
let isLoadingSubjects = false;

// 日志函数（已去 UI 化）：只写 console，页内调试面板已删除
function log(message) {
    const timestamp = new Date().toLocaleTimeString();
    console.log(`[${timestamp}] ${message}`);
}

// 清空日志（页内日志 UI 已删除，保留空实现防旧调用报错）
function clearLog() {}

// ==================== 科目管理功能 ====================

// 打开科目管理模态框
function openSubjectManager() {
    log('📋 打开科目管理');
    const modal = document.getElementById('subjectManagerModal');
    if (modal) {
        modal.classList.remove('hidden');
        loadSubjectsForManager();
    }
}

// 关闭科目管理模态框
function closeSubjectManager() {
    log('❌ 关闭科目管理');
    const modal = document.getElementById('subjectManagerModal');
    if (modal) {
        modal.classList.add('hidden');
    }
    // 清空输入框
    const input = document.getElementById('newSubjectName');
    if (input) {
        input.value = '';
    }
}

// 加载科目列表（用于管理界面）
async function loadSubjectsForManager() {
    log('📊 加载科目管理列表');
    
    try {
        if (!window.pybridge || !window.pybridge.getAllSubjects) {
            throw new Error('getAllSubjects API 不可用');
        }
        
        const result = await window.pybridge.getAllSubjects();
        log(`📡 getAllSubjects API返回: ${result}`);
        
        const subjects = JSON.parse(result);
        log(`📋 解析后的科目列表: ${JSON.stringify(subjects, null, 2)}`);
        
        log(`✅ 获取到 ${subjects.length} 个科目`);
        
        renderSubjectsForManager(subjects);
        
    } catch (error) {
        log(`❌ 加载科目管理列表失败: ${error.message}`);
        const container = document.getElementById('subjectsList');
        if (container) {
            container.innerHTML = `
                <div class="text-center py-4 text-red-600">
                    <span class="material-icons-outlined text-2xl mb-2">error</span>
                    <p>加载失败: ${error.message}</p>
                </div>
            `;
        }
    }
}

// 渲染科目管理列表
function renderSubjectsForManager(subjects) {
    const container = document.getElementById('subjectsList');
    if (!container) return;
    
    if (subjects.length === 0) {
        container.innerHTML = `
            <div class="text-center py-4 text-gray-500">
                <span class="material-icons-outlined text-2xl mb-2">folder_open</span>
                <p>暂无科目</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = subjects.map(subject => `
        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                    <span class="material-icons-outlined text-blue-600">folder</span>
                </div>
                <div>
                    <h4 class="font-semibold text-gray-800">${subject.name}</h4>
                    <p class="text-sm text-gray-600">${subject.knowledge_count} 个知识点</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="editSubject('${subject.name}')" 
                        class="text-blue-600 hover:text-blue-800 p-1" title="编辑">
                    <span class="material-icons-outlined text-sm">edit</span>
                </button>
                ${subject.can_delete ? `
                    <button onclick="deleteSubject('${subject.name}')" 
                            class="text-red-600 hover:text-red-800 p-1" title="删除">
                        <span class="material-icons-outlined text-sm">delete</span>
                    </button>
                ` : `
                    <button class="text-gray-400 p-1 cursor-not-allowed" 
                            title="该科目包含知识点，无法删除">
                        <span class="material-icons-outlined text-sm">delete</span>
                    </button>
                `}
            </div>
        </div>
    `).join('');
}

// 创建新科目
async function createSubject() {
    const input = document.getElementById('newSubjectName');
    if (!input) return;
    
    const subjectName = input.value.trim();
    if (!subjectName) {
        alert('请输入科目名称');
        return;
    }
    
    log(`➕ 创建新科目: ${subjectName}`);
    
    try {
        if (!window.pybridge || !window.pybridge.createSubject) {
            throw new Error('createSubject API 不可用');
        }
        
        const result = await window.pybridge.createSubject(subjectName);
        const response = JSON.parse(result);
        
        if (response.success) {
            log(`✅ 科目创建成功: ${subjectName}`);
            alert(response.message);
            input.value = '';
            
            // 延迟刷新，确保数据库操作完成
            log(`🔄 开始刷新科目管理列表...`);
            setTimeout(async () => {
                await loadSubjectsForManager(); // 刷新科目管理列表
                log(`🔄 开始刷新主页面科目列表...`);
                await refreshSubjects(); // 刷新主页面
                log(`✅ 所有列表刷新完成`);
            }, 100);
        } else {
            log(`❌ 科目创建失败: ${response.error}`);
            alert(`创建失败: ${response.error}`);
        }
        
    } catch (error) {
        log(`❌ 创建科目异常: ${error.message}`);
        alert(`创建失败: ${error.message}`);
    }
}

// 编辑科目
function editSubject(subjectName) {
    const newName = prompt(`请输入新的科目名称:`, subjectName);
    if (!newName || newName.trim() === '' || newName.trim() === subjectName) {
        return;
    }
    
    updateSubject(subjectName, newName.trim());
}

// 更新科目名称
async function updateSubject(oldName, newName) {
    log(`✏️ 更新科目: ${oldName} -> ${newName}`);
    
    try {
        if (!window.pybridge || !window.pybridge.updateSubject) {
            throw new Error('updateSubject API 不可用');
        }
        
        const result = await window.pybridge.updateSubject(oldName, newName);
        const response = JSON.parse(result);
        
        if (response.success) {
            log(`✅ 科目更新成功: ${oldName} -> ${newName}`);
            alert(response.message);
            loadSubjectsForManager(); // 刷新列表
            refreshSubjects(); // 刷新主页面
        } else {
            log(`❌ 科目更新失败: ${response.error}`);
            alert(`更新失败: ${response.error}`);
        }
        
    } catch (error) {
        log(`❌ 更新科目异常: ${error.message}`);
        alert(`更新失败: ${error.message}`);
    }
}

// 删除科目
async function deleteSubject(subjectName) {
    if (!confirm(`确定要删除科目 "${subjectName}" 吗？\n注意：只有知识点数量为0的科目才能删除。`)) {
        return;
    }
    
    log(`🗑️ 删除科目: ${subjectName}`);
    
    try {
        if (!window.pybridge || !window.pybridge.deleteSubject) {
            throw new Error('deleteSubject API 不可用');
        }
        
        const result = await window.pybridge.deleteSubject(subjectName);
        const response = JSON.parse(result);
        
        if (response.success) {
            log(`✅ 科目删除成功: ${subjectName}`);
            alert(response.message);
            loadSubjectsForManager(); // 刷新列表
            refreshSubjects(); // 刷新主页面
        } else {
            log(`❌ 科目删除失败: ${response.error}`);
            alert(`删除失败: ${response.error}`);
        }
        
    } catch (error) {
        log(`❌ 删除科目异常: ${error.message}`);
        alert(`删除失败: ${error.message}`);
    }
}

// 刷新科目管理列表
function refreshSubjectsList() {
    log('🔄 刷新科目管理列表');
    loadSubjectsForManager();
}

// 刷新主页面科目列表
async function refreshSubjects() {
    log('🔄 刷新主页面科目列表');
    await loadSubjects();
}

// 加载主页面科目列表
async function loadSubjects() {
    if (isLoadingSubjects) {
        log('⚠️ 正在加载中，跳过重复请求');
        return;
    }
    
    isLoadingSubjects = true;
    log('📊 开始加载科目列表');
    
    try {
        // 详细检查WebChannel状态
        log(`🔍 WebChannel状态检查:`);
        log(`  - window对象: ${typeof window}`);
        log(`  - window.pybridge: ${typeof window.pybridge}`);
        
        if (window.pybridge) {
            log(`  - pybridge方法数量: ${Object.keys(window.pybridge).length}`);
            log(`  - getSubjectsWithKnowledgeCount存在: ${typeof window.pybridge.getSubjectsWithKnowledgeCount}`);
        }
        
        if (!window.pybridge || !window.pybridge.getAllSubjects) {
            throw new Error('getAllSubjects API 不可用');
        }
        
        log('📡 调用API: getAllSubjects()');
        // 用 getAllSubjects 而非 getSubjectsWithKnowledgeCount：后者会过滤掉 0 知识点科目，
        // 导致新建科目在脑图页“暂无科目”误导用户（产品反馈问题）
        const result = await window.pybridge.getAllSubjects();
        log(`📡 API返回原始数据: ${result}`);
        log(`📡 返回数据类型: ${typeof result}`);
        log(`📡 返回数据长度: ${result ? result.length : 'null'}`);
        
        if (!result) {
            throw new Error('API返回空数据');
        }
        
        log('🔄 解析JSON数据...');
        const subjects = JSON.parse(result);
        log(`✅ JSON解析成功，获取到 ${subjects.length} 个科目`);
        log(`📋 科目详情: ${JSON.stringify(subjects, null, 2)}`);
        
        allSubjects = subjects;
        
        log('🎨 开始渲染科目卡片...');
        renderSubjects(subjects);
        log('✅ 科目卡片渲染完成');
        
    } catch (error) {
        log(`❌ 加载科目列表失败: ${error.message}`);
        log(`📊 错误详情: ${error.stack || error}`);
        
        const container = document.getElementById('subjectsContainer');
        if (container) {
            container.innerHTML = `
                <div class="col-span-full text-center py-8 text-red-600">
                    <span class="material-icons-outlined text-4xl mb-4">error</span>
                    <p class="text-lg font-semibold mb-2">加载失败</p>
                    <p class="text-sm">${error.message}</p>
                    <button onclick="loadSubjects()" 
                            class="mt-4 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                        重试
                    </button>
                </div>
            `;
        } else {
            log('❌ 找不到subjectsContainer元素');
        }
    } finally {
        isLoadingSubjects = false;
        log('🔚 loadSubjects函数执行完成');
    }
}

// 渲染科目卡片
function renderSubjects(subjects) {
    const container = document.getElementById('subjectsContainer');
    if (!container) return;
    
    if (subjects.length === 0) {
        container.innerHTML = `
            <div class="col-span-full text-center py-8">
                <span class="material-icons-outlined text-4xl text-gray-400 mb-4">folder_open</span>
                <p class="text-lg font-semibold text-gray-600 mb-2">暂无科目</p>
                <p class="text-sm text-gray-500 mb-4">点击右上角的"科目管理"按钮添加新科目，或先在“学”中生成知识点</p>
                <button onclick="openSubjectManager()" 
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                    添加科目
                </button>
            </div>
        `;
        return;
    }
    
    // 预定义的颜色主题
    const colorThemes = [
        { bg: 'bg-blue-100', text: 'text-blue-600', hover: 'hover:border-blue-400', icon: 'code' },
        { bg: 'bg-purple-100', text: 'text-purple-600', hover: 'hover:border-purple-400', icon: 'psychology' },
        { bg: 'bg-green-100', text: 'text-green-600', hover: 'hover:border-green-400', icon: 'account_tree' },
        { bg: 'bg-orange-100', text: 'text-orange-600', hover: 'hover:border-orange-400', icon: 'smart_toy' },
        { bg: 'bg-red-100', text: 'text-red-600', hover: 'hover:border-red-400', icon: 'science' },
        { bg: 'bg-indigo-100', text: 'text-indigo-600', hover: 'hover:border-indigo-400', icon: 'calculate' },
        { bg: 'bg-pink-100', text: 'text-pink-600', hover: 'hover:border-pink-400', icon: 'palette' },
        { bg: 'bg-teal-100', text: 'text-teal-600', hover: 'hover:border-teal-400', icon: 'language' }
    ];
    
    container.innerHTML = subjects.map((subject, index) => {
        const theme = colorThemes[index % colorThemes.length];
        return `
            <div class="subject-card bg-white rounded-xl border-2 border-gray-200 ${theme.hover} hover:shadow-lg cursor-pointer transition-all duration-300 p-6" 
                 data-subject="${subject.name}" onclick="selectSubject('${subject.name}')">
                <div class="text-center">
                    <div class="w-16 h-16 ${theme.bg} rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="material-icons-outlined text-2xl ${theme.text}">${theme.icon}</span>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">${subject.name}</h3>
                    <div class="flex items-center justify-center space-x-2 text-sm text-gray-600">
                        <span class="material-icons-outlined text-sm">lightbulb</span>
                        <span>${subject.knowledge_count} 个知识点</span>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        ${subject.knowledge_count > 0 ? `
                        <span class="inline-flex items-center text-sm ${theme.text} font-medium">
                            点击进入脑图
                            <span class="material-icons-outlined ml-1 text-sm">arrow_forward</span>
                        </span>` : `
                        <span class="inline-flex items-center text-sm text-gray-400">暂无知识点，先在“学”中生成</span>`}
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

// 页面加载完成后自动加载科目列表
document.addEventListener('DOMContentLoaded', function() {
    log('📄 页面加载完成，开始初始化');
    
    // 等待WebChannel初始化完成后再加载科目
    function tryLoadSubjects(retryCount = 0) {
        if (window.pybridge && window.pybridge.getSubjectsWithKnowledgeCount) {
            log('✅ WebChannel已准备就绪，开始加载科目');
            loadSubjects();
        } else if (retryCount < 10) {
            log(`⏳ WebChannel未就绪，等待中... (${retryCount + 1}/10)`);
            setTimeout(() => tryLoadSubjects(retryCount + 1), 500);
        } else {
            log('❌ WebChannel初始化超时，显示错误信息');
            const container = document.getElementById('subjectsContainer');
            if (container) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-8 text-red-600">
                        <span class="material-icons-outlined text-4xl mb-4">error</span>
                        <p class="text-lg font-semibold mb-2">WebChannel连接失败</p>
                        <p class="text-sm mb-4">前后端通信未建立，请刷新页面重试</p>
                        <button onclick="location.reload()" 
                                class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                            刷新页面
                        </button>
                    </div>
                `;
            }
        }
    }
    
    // 开始尝试加载
    tryLoadSubjects();
});

// 选择学科
function selectSubject(subjectName) {
    log(`🎯 点击了学科: ${subjectName}`);
    
    // 0 知识点科目给明确引导，避免进入空脑图误以为故障
    const picked = (allSubjects || []).find(function (s) { return s.name === subjectName; });
    if (picked && !(picked.knowledge_count > 0)) {
        alert(`科目「${subjectName}」还没有知识点。\n请先到「学 → 基于学习资料/在线课程」生成知识点，再回来练。`);
        return;
    }
    
    // 添加调试信息
    console.log(`🎯 selectSubject被调用: ${subjectName}`);
    
    // === 新增：页面状态清理 ===
    try {
        // 1. 清理之前的脑图渲染
        if (simulation) {
            simulation.stop();
            simulation = null;
            log(`🧹 已停止之前的simulation`);
        }
        
        // 2. 清理SVG内容
        try {
            if (typeof d3 !== 'undefined') {
                const svg = d3.select("#mindmapSvg");
                if (!svg.empty()) {
                    svg.selectAll("*").remove();
                    log(`🧹 已清理SVG内容`);
                } else {
                    log(`⚠️ SVG元素不存在，跳过清理`);
                }
            } else {
                log(`⚠️ D3.js未加载，跳过SVG清理`);
            }
        } catch (error) {
            log(`⚠️ 清理过程中出现错误: ${error.message}`);
        }
        
        // 3. 重置全局变量
        currentMindmapData = null;
        g = null;
        zoom = null;
        isGeneratingMindmap = false;
        // 不重置currentSubjectName，保留用于防重复检查
        log(`🧹 已重置全局变量`);
        
        // 4. 清理详情面板状态
        const detailPanel = document.getElementById('knowledgePointDetail');
        if (detailPanel) {
            detailPanel.classList.add('hidden');
            log(`🧹 已隐藏详情面板`);
        }
        
        // 5. 重置加载状态
        hideLoading();
        log(`🧹 已重置加载状态`);
        
    } catch (error) {
        log(`⚠️ 清理过程中出现错误: ${error.message}`);
    }
    // === 清理逻辑结束 ===
    
    // 设置全局变量
    currentSubjectName = subjectName;
    window.currentSubjectName = subjectName; // 确保全局可访问
    
    // 切换学科时重置学习路径数据与视图模式，避免沿用上学科的路径/升级标记
    currentLearningPathData = null;
    currentLpViewMode = 'linear';
    _lpTreeUpgradeTried = false;
    // 评审修复：同步收起上一学科遗留的 Tab / 图例卡（不点"返回脑图"直接切学科的路径）
    const lpTabsEl = document.getElementById('lpViewTabs');
    if (lpTabsEl) { lpTabsEl.classList.add('hidden'); lpTabsEl.classList.remove('flex'); }
    const legendCardEl = document.getElementById('learningLegendCard');
    if (legendCardEl) legendCardEl.classList.add('hidden');
    lpActualSize = false;
    const sizeBtnEl = document.getElementById('lpSizeToggle');
    if (sizeBtnEl) sizeBtnEl.textContent = '实际大小';
    hideLpTooltip();
    
    // 保存当前查看的学科到localStorage（如果可用）
    try {
        if (typeof(Storage) !== "undefined" && window.localStorage) {
            localStorage.setItem('lastViewedSubject', subjectName);
            log(`💾 已保存当前学科状态: ${subjectName}`);
        }
    } catch (error) {
        log(`⚠️ 无法保存学科状态: ${error.message}`);
    }
    
    // 隐藏学科选择页面
    document.getElementById('subjectSelectionPage').classList.add('hidden');
    
    // 显示脑图页面
    document.getElementById('mindmapPage').classList.remove('hidden');
    
    // 更新标题
    document.getElementById('mindmapTitle').textContent = `${subjectName} - 知识脑图`;
    
    log(`✅ 已进入 ${subjectName} 脑图页面`);
    
    // 调用后端API生成脑图
    log(`🔍 selectSubject即将调用generateMindmap: ${subjectName}`);
    generateMindmap(subjectName);
}

// 返回学科选择
function backToSubjects() {
    log('🔙 返回学科选择页面');
    
    // 清除保存的状态（如果localStorage可用）
    try {
        if (typeof(Storage) !== "undefined" && window.localStorage) {
            localStorage.removeItem('lastViewedSubject');
            localStorage.removeItem('lastViewedKnowledgePoint');
            log('🗑️ 已清除保存的状态');
        }
    } catch (error) {
        log(`⚠️ 无法清除状态: ${error.message}`);
    }
    
    document.getElementById('mindmapPage').classList.add('hidden');
    document.getElementById('subjectSelectionPage').classList.remove('hidden');
    
    log('✅ 已返回学科选择页面');
}

// 全局变量
let currentMindmapData = null;
let svg = null;
let g = null;
let zoom = null;
let simulation = null;
let isGeneratingMindmap = false; // 防重复调用标志

// 生成脑图
async function generateMindmap(subjectName, forceRefresh = false) {
    log(`🔍 generateMindmap被调用: ${subjectName}, 强制刷新: ${forceRefresh}`);
    log(`🔍 当前状态: isGeneratingMindmap=${isGeneratingMindmap}, currentSubjectName=${window.currentSubjectName}`);
    
    // 防重复调用检查
    if (isGeneratingMindmap) {
        log(`⚠️ 脑图正在生成中，跳过重复调用 (学科: ${subjectName})`);
        return;
    }
    
    // 如果不是强制刷新，且当前已有相同学科的脑图数据，直接渲染
    if (!forceRefresh && currentMindmapData && window.currentSubjectName === subjectName) {
        log(`📊 使用现有脑图数据，直接渲染 (学科: ${subjectName})`);
        renderMindmap();
        return;
    }
    
    isGeneratingMindmap = true;
    log(`🧠 开始生成 ${subjectName} 的知识脑图 (强制刷新: ${forceRefresh})`);
    
    // === 新增：生成前检查 ===
    try {
        // 检查页面状态
        const mindmapPage = document.getElementById('mindmapPage');
        const subjectPage = document.getElementById('subjectSelectionPage');
        
        if (!mindmapPage || mindmapPage.classList.contains('hidden')) {
            log(`❌ 脑图页面状态异常，尝试修复`);
            if (mindmapPage) {
                mindmapPage.classList.remove('hidden');
            }
            if (subjectPage) {
                subjectPage.classList.add('hidden');
            }
        }
        
        // 检查SVG容器
        const svgContainer = document.getElementById('mindmapSvg');
        if (!svgContainer) {
            log(`❌ SVG容器不存在`);
            isGeneratingMindmap = false;
            hideLoading();
            return;
        }
        
        log(`✅ 页面状态检查通过`);
        
    } catch (error) {
        log(`❌ 页面状态检查失败: ${error.message}`);
        isGeneratingMindmap = false;
        hideLoading();
        return;
    }
    // === 检查逻辑结束 ===
    
    showLoading();
    
    try {
        // 详细的调试信息
        log(`🔍 检查WebChannel连接状态:`);
        log(`  - window.pybridge 存在: ${!!window.pybridge}`);
        log(`  - getOrGenerateMindmap 方法存在: ${!!(window.pybridge && window.pybridge.getOrGenerateMindmap)}`);
        
        if (window.pybridge && window.pybridge.getOrGenerateMindmap) {
            log(`📡 调用后端API获取脑图数据...`);
            log(`📤 请求参数: 学科="${subjectName}"`);
            
            const response = await window.pybridge.getOrGenerateMindmap(subjectName);
            log(`📡 API响应长度: ${response ? response.length : 0}`);
            log(`📡 API响应预览: ${response ? response.substring(0, 200) : 'null'}...`);
            
            const result = JSON.parse(response);
            
            if (result.success && result.mindmap && result.mindmap.data) {
                // 显示缓存状态
                const cacheStatus = result.mindmap.cache_status || 'unknown';
                const cacheStatusElement = document.getElementById('cacheStatus');
                
                if (cacheStatus === 'from_cache') {
                    log(`💾 使用缓存的脑图数据`);
                    log(`📅 缓存时间: ${result.mindmap.updated_time || 'unknown'}`);
                    log(`🔢 版本: ${result.mindmap.version || 1}`);
                    cacheStatusElement.innerHTML = `<span class="text-green-600">💾 缓存数据</span> | 版本: ${result.mindmap.version || 1}`;
                } else if (cacheStatus === 'newly_generated') {
                    log(`🆕 使用新生成的脑图数据`);
                    log(`🤖 LLM生成完成并已缓存`);
                    cacheStatusElement.innerHTML = `<span class="text-blue-600">🆕 新生成</span> | 已缓存`;
                } else {
                    log(`✅ 使用真实脑图数据`);
                    cacheStatusElement.innerHTML = `<span class="text-gray-600">✅ 数据加载</span>`;
                }
                
                log(`📊 节点数: ${result.mindmap.data.nodes?.length || 0}`);
                log(`🔗 连线数: ${result.mindmap.data.edges?.length || 0}`);
                
                currentMindmapData = result.mindmap.data;
                
                // 验证数据格式
                if (validateMindmapData(currentMindmapData)) {
                    renderMindmap();
                } else {
                    log(`⚠️ 真实数据格式有问题，使用修复后的数据`);
                    currentMindmapData = fixMindmapData(currentMindmapData, subjectName);
                    renderMindmap();
                }
            } else {
                log(`❌ 脑图生成失败: ${result.error || '数据格式错误'}`);
                log(`🔄 回退到模拟数据`);
                showMockMindmap(subjectName);
            }
        } else {
            log('⚠️ 后端API不可用，显示模拟脑图');
            log(`🔍 WebChannel状态详情:`);
            log(`  - window 对象: ${typeof window}`);
            log(`  - bridge 属性: ${typeof window.pybridge}`);
            if (window.pybridge) {
                log(`  - bridge 方法列表: ${Object.keys(window.pybridge).join(', ')}`);
            }
            showMockMindmap(subjectName);
        }
    } catch (error) {
        log(`❌ 生成脑图时出错: ${error.message}`);
        log(`📊 错误详情: ${error.stack || error}`);
        log(`🔄 回退到模拟数据`);
        showMockMindmap(subjectName);
    }
    
    // 确保重置状态
    isGeneratingMindmap = false;
    hideLoading();
    log(`🏁 脑图生成流程完成`);
}

// 根据熟练度获取知识点颜色
function getKnowledgePointColor(masteryScore) {
    // 如果是-1或未定义，返回浅灰色（未评估）
    if (masteryScore === -1 || masteryScore === null || masteryScore === undefined) {
        return '#E5E7EB'; // 浅灰色
    }
    
    // 将熟练度分数(0-100)映射到颜色深度
    // 使用橙色到红色系的渐变，颜色对比度更明显
    const score = Math.max(0, Math.min(100, masteryScore)); // 确保在0-100范围内
    
    // 定义颜色梯度：从极浅橙色到深酒红色，每10分一个等级
    const colors = [
        '#FFF7ED', // 0-10分：极浅橙色，接近白色
        '#FFEDD5', // 10-20分：很浅橙色，淡桃色
        '#FED7AA', // 20-30分：浅橙色，浅杏色
        '#FDBA74', // 30-40分：中浅橙色，明显橙色
        '#FB923C', // 40-50分：标准橙色，鲜明橙色
        '#F97316', // 50-60分：深橙色，浓郁橙色
        '#EA580C', // 60-70分：很深橙色，深红橙
        '#DC2626', // 70-80分：橙红色，偏红的橙
        '#B91C1C', // 80-90分：深红橙色，深红色
        '#991B1B'  // 90-100分：最深红橙，深酒红
    ];
    
    // 计算颜色索引
    const colorIndex = Math.floor(score / 10);
    const adjustedIndex = Math.min(colorIndex, colors.length - 1);
    
    return colors[adjustedIndex];
}

// 根据熟练度决定已有知识点文本颜色（浅底用深字，深底用白字）
function getKpTextColor(masteryScore) {
    if (masteryScore === -1 || masteryScore === null || masteryScore === undefined) {
        return '#374151'; // 未评估：浅灰底，用深灰字
    }
    const score = Math.max(0, Math.min(100, masteryScore));
    // 0-39 分底色偏浅，使用深色文字，其余使用白色
    return score < 40 ? '#374151' : 'white';
}

// 验证脑图数据格式
function validateMindmapData(data) {
    if (!data || !data.nodes || !Array.isArray(data.nodes)) {
        log('❌ 缺少nodes数组');
        return false;
    }
    
    if (data.nodes.length === 0) {
        log('❌ nodes数组为空');
        return false;
    }
    
    // 检查节点格式
    const nodeIds = new Set();
    for (let node of data.nodes) {
        if (!node.id || !node.name) {
            log(`❌ 节点缺少必要字段: ${JSON.stringify(node)}`);
            return false;
        }
        nodeIds.add(node.id);
    }
    
    // 检查边的引用完整性
    if (data.edges && Array.isArray(data.edges)) {
        for (let edge of data.edges) {
            if (!nodeIds.has(edge.source)) {
                log(`❌ 边引用了不存在的源节点: ${edge.source}`);
                return false;
            }
            if (!nodeIds.has(edge.target)) {
                log(`❌ 边引用了不存在的目标节点: ${edge.target}`);
                return false;
            }
        }
        log(`✅ 边引用验证通过，共 ${data.edges.length} 条边`);
    }
    
    log('✅ 脑图数据格式验证通过');
    return true;
}

// 修复脑图数据
function fixMindmapData(data, subjectName) {
    log('🔧 开始修复脑图数据');
    
    const fixedData = {
        nodes: [],
        edges: []
    };
    
    // 收集所有有效的节点ID
    const validNodeIds = new Set();
    
    // 处理原始节点
    if (data.nodes && Array.isArray(data.nodes)) {
        data.nodes.forEach((node, index) => {
            if (node.id && node.name) {
                const fixedNode = {
                    id: node.id,
                    name: node.name,
                    type: node.type || 'knowledge_point',
                    x: node.x || Math.random() * 600 + 100,
                    y: node.y || Math.random() * 400 + 100,
                    mastery_score: node.mastery_score || -1
                };
                fixedData.nodes.push(fixedNode);
                validNodeIds.add(node.id);
            }
        });
    }
    
    // 只保留引用有效节点的边
    if (data.edges && Array.isArray(data.edges)) {
        data.edges.forEach(edge => {
            if (validNodeIds.has(edge.source) && validNodeIds.has(edge.target)) {
                fixedData.edges.push({
                    source: edge.source,
                    target: edge.target,
                    relation: edge.relation || '相关'
                });
            } else {
                log(`🗑️ 移除无效边: ${edge.source} -> ${edge.target}`);
            }
        });
    }
    
    log(`🔧 修复完成: ${fixedData.nodes.length}个节点, ${fixedData.edges.length}条连线`);
    return fixedData;
}

// 渲染脑图
function renderMindmap() {
    if (!currentMindmapData || !currentMindmapData.nodes) {
        log('❌ 脑图数据无效');
        return;
    }
    
    // 强制停止之前的simulation
    if (simulation) {
        simulation.stop();
        simulation = null;
        log('🛑 强制停止之前的simulation');
    }
    
    // 重置筛选和搜索状态
    filteredNodeId = null;
    searchResults.clear();
    isSearchActive = false;
    
    log(`📊 开始渲染脑图，节点数: ${currentMindmapData.nodes.length}`);
    
    // 初始化SVG
    if (!initSvg()) {
        log('❌ SVG初始化失败，无法渲染脑图');
        return;
    }
    
    const nodes = currentMindmapData.nodes.map(d => ({...d}));
    const edges = currentMindmapData.edges || [];
    
    // 清空之前的内容（SVG已在initSvg中清理）
    // g.selectAll('*').remove(); // 不需要，因为g是新创建的
    // svg.selectAll('defs').remove(); // 不需要，因为svg已清空
    
    // 创建力导向图
    simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(edges).id(d => d.id).distance(150))
        .force('charge', d3.forceManyBody().strength(-500))
        .force('center', d3.forceCenter(400, 250))
        .force('collision', d3.forceCollide().radius(d => {
            const textLength = d.name.length;
            if (d.type === 'center') {
                return Math.max(50, textLength * 4) + 10; // 额外10px间距
            }
            if (d.type === 'category') {
                return Math.max(40, textLength * 3.5) + 8;
            }
            return Math.max(35, textLength * 3) + 6;
        }));
    
    // 定义箭头标记
    const defs = svg.append('defs');
    defs.append('marker')
        .attr('id', 'arrow')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 10) // 箭头尖端位置
        .attr('refY', 0)
        .attr('markerWidth', 8)
        .attr('markerHeight', 8)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', '#3498db');
    
    // 绘制有向连线
    const links = g.append('g')
        .selectAll('line')
        .data(edges)
        .enter().append('line')
        .attr('stroke', '#3498db')
        .attr('stroke-opacity', 0.9)
        .attr('stroke-width', 3)
        .attr('marker-end', 'url(#arrow)');
    
    // 绘制关系文字
    const linkLabels = g.append('g')
        .selectAll('text')
        .data(edges)
        .enter().append('text')
        .attr('class', 'link-label')
        .attr('text-anchor', 'middle')
        .attr('dy', -5)
        .style('font-size', '10px')
        .style('font-weight', 'bold')
        .style('fill', '#555')
        .style('background', 'white')
        .style('padding', '2px')
        .text(d => d.relation || '关联');
    
    // 绘制节点组
    const nodeGroups = g.append('g')
        .selectAll('g')
        .data(nodes)
        .enter().append('g')
        .attr('class', 'node-group')
        .style('cursor', 'pointer')
        .call(d3.drag()
            .on('start', dragstarted)
            .on('drag', dragged)
            .on('end', dragended));
    
    // 节点圆圈 - 根据文字长度动态调整大小
    nodeGroups.append('circle')
        .attr('r', d => {
            const textLength = d.name.length;
            if (d.type === 'center') {
                return Math.max(50, textLength * 4); // 最小50，每字符4px
            }
            if (d.type === 'category') {
                return Math.max(40, textLength * 3.5); // 最小40，每字符3.5px
            }
            return Math.max(35, textLength * 3); // 知识点：最小35，每字符3px
        })
        .attr('fill', d => {
            if (d.type === 'center') return '#3B82F6';
            if (d.type === 'category') return '#10B981';
            
            // 知识点根据熟练度设置颜色深度
            if (d.type === 'knowledge_point') {
                return getKnowledgePointColor(d.mastery_score);
            }
            
            return '#F59E0B'; // 默认颜色
        })
        .attr('stroke', '#fff')
        .attr('stroke-width', 2);
    
    // 节点文本 - 完整显示，不截断
    nodeGroups.each(function(d) {
        const group = d3.select(this);
        const fontSize = d.type === 'center' ? 14 : d.type === 'category' ? 12 : 11;
        
        // 根据背景颜色确定文字颜色
        let textColor = 'white'; // 默认白色
        if (d.type === 'knowledge_point') {
            const bgColor = getKnowledgePointColor(d.mastery_score);
            const masteryScore = d.mastery_score;
            
            // 根据新的颜色方案确定文字颜色
            if (masteryScore === -1 || masteryScore === null || masteryScore === undefined || masteryScore < 40) {
                // 未评估或0-40分：浅色背景，使用深灰色文字
                textColor = '#374151';
            } else {
                // 40分以上：深色背景，使用白色文字
                textColor = '#FFFFFF';
            }
        }
        
        // 获取当前圆圈的半径
        const circle = group.select('circle');
        const radius = parseFloat(circle.attr('r'));
        
        // 智能分行：根据圆圈大小决定每行字符数
        const maxWidth = radius * 1.6; // 圆圈直径的80%作为文字宽度
        const avgCharWidth = fontSize * 0.6; // 平均字符宽度
        const maxCharsPerLine = Math.max(4, Math.floor(maxWidth / avgCharWidth));
        
        // 按自然断点分词（空格、括号、标点等）
        const text = d.name;
        let words = [];
        
        // 如果包含英文，按单词分割；否则按字符分割
        if (/[a-zA-Z]/.test(text)) {
            words = text.split(/(\s+|\(|\)|（|）|,|，|、|：|:|-)/);
        } else {
            words = text.split('');
        }
        
        const lines = [];
        let currentLine = '';
        
        for (let word of words) {
            if (!word.trim() && word !== ' ') continue; // 跳过空白但保留空格
            
            const testLine = currentLine + word;
            if (testLine.length <= maxCharsPerLine || currentLine === '') {
                currentLine = testLine;
            } else {
                if (currentLine) lines.push(currentLine);
                currentLine = word;
            }
        }
        if (currentLine) lines.push(currentLine);
        
        // 如果文字很短，单行显示
        if (lines.length === 1 && lines[0].length <= maxCharsPerLine) {
            group.append('text')
                .attr('x', 0)
                .attr('y', 0)
                .attr('text-anchor', 'middle')
                .style('fill', textColor)
                .style('font-size', fontSize + 'px')
                .style('font-weight', 'bold')
                .style('text-shadow', textColor === '#374151' ? 'none' : '1px 1px 2px rgba(0,0,0,0.5)')
                .style('dominant-baseline', 'middle')
                .text(lines[0]);
        } else {
            // 多行显示
            const lineHeight = fontSize + 2;
            const totalHeight = lines.length * lineHeight;
            const startY = -(totalHeight / 2) + (lineHeight / 2);
            
            lines.forEach((line, index) => {
                group.append('text')
                    .attr('x', 0)
                    .attr('y', startY + (index * lineHeight))
                    .attr('text-anchor', 'middle')
                    .style('fill', textColor)
                    .style('font-size', fontSize + 'px')
                    .style('font-weight', 'bold')
                    .style('text-shadow', textColor === '#374151' ? 'none' : '1px 1px 2px rgba(0,0,0,0.5)')
                    .style('dominant-baseline', 'middle')
                    .text(line);
            });
        }
    });
    
    // 节点点击事件
    nodeGroups.on('click', (event, d) => {
        log(`🔍 点击了节点: ${d.name} (${d.type})`);
        
        // 处理筛选逻辑（绿色和蓝色圆圈）
        if (d.type === 'center' || d.type === 'category') {
            handleNodeFilter(d);
        }
        // 知识点：统一跳转 SPA 知识点落地页（P1 落地页统一，本页抽屉浮层下线）
        else if (d.type === 'knowledge_point') {
            goKnowledgePointLanding(d.id, d.name);
        }
    });
    
    // 更新位置
    simulation.on('tick', () => {
        links.each(function(d) {
            // 计算连线方向
            const dx = d.target.x - d.source.x;
            const dy = d.target.y - d.source.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // 避免除零错误
            if (distance === 0) return;
            
            // 计算节点半径（使用动态半径）
            const getNodeRadius = (node) => {
                const textLength = node.name.length;
                if (node.type === 'center') {
                    return Math.max(50, textLength * 4);
                }
                if (node.type === 'category') {
                    return Math.max(40, textLength * 3.5);
                }
                return Math.max(35, textLength * 3);
            };
            
            const sourceRadius = getNodeRadius(d.source);
            const targetRadius = getNodeRadius(d.target);
            
            // 计算连线起点和终点（在圆圈边缘）
            const sourceX = d.source.x + (dx / distance) * sourceRadius;
            const sourceY = d.source.y + (dy / distance) * sourceRadius;
            const targetX = d.target.x - (dx / distance) * (targetRadius + 5); // 留出箭头空间
            const targetY = d.target.y - (dy / distance) * (targetRadius + 5);
            
            d3.select(this)
                .attr('x1', sourceX)
                .attr('y1', sourceY)
                .attr('x2', targetX)
                .attr('y2', targetY);
        });
        
        // 更新关系文字位置（在连线中点）
        linkLabels
            .attr('x', d => (d.source.x + d.target.x) / 2)
            .attr('y', d => (d.source.y + d.target.y) / 2);
        
        nodeGroups
            .attr('transform', d => `translate(${d.x},${d.y})`);
    });
    
    log('✅ 脑图渲染完成');
}

// 初始化SVG
function initSvg() {
    // 检查SVG容器是否存在
    const svgElement = document.getElementById('mindmapSvg');
    if (!svgElement) {
        log('❌ SVG容器不存在，无法初始化');
        return false;
    }
    
    // 强制重新初始化，确保清理干净
    log('🎨 强制重新初始化SVG容器');
    
    log('🎨 初始化SVG容器');
    
    // 重新选择SVG元素
    svg = d3.select('#mindmapSvg');
    
    // 评审修复：技能树视图会动态撑大 viewBox，每次重建必须复位默认画布，
    // 否则切回线性图/脑图时整图被压缩，重新出现"文字看不清"的老问题
    svg.attr('viewBox', '0 0 3200 700');
    
    // 清空SVG内容
    svg.selectAll('*').remove();
    
    // 创建新的g元素
    g = svg.append('g');
    
    // 初始化缩放（上限 3→8：配合"实际大小"模式后能真正放大到看清字，每步 1.5x 手感不变）
    zoom = d3.zoom()
        .scaleExtent([0.2, 8])
        .on('zoom', (event) => {
            g.attr('transform', event.transform);
        });
    
    svg.call(zoom);
    // 评审修复：d3-zoom 会把上次 transform 存在 DOM 的 __zoom 上，不复位则跨视图切换后
    // 首次滚轮/拖拽会从旧值派生，导致画面瞬间跳到未知偏移
    svg.call(zoom.transform, d3.zoomIdentity);
    
    log('✅ SVG初始化完成');
    return true;
}

// 拖拽函数
function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
}

function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
}

function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
}

// 知识点节点 → SPA 知识点落地页（P1 落地页统一 2026-10-09）：
// 不再在本页开抽屉浮层；写 pm_pending_point 旗标后调父窗口 handleMenuClick 跳 knowledge_point 页，
// 旗标消费端为 pm_pages.js bootKnowledgePoint（10s 过期+幂等，与练/记总览「去练习」同契约）。
function goKnowledgePointLanding(nodeId, name) {
    const rawId = String(nodeId || '');
    const realId = rawId.startsWith('kp_') ? rawId.substring(3) : rawId;
    if (!realId) { log('❌ 缺少知识点ID，无法跳转落地页'); return; }
    try {
        localStorage.setItem('pm_pending_point', JSON.stringify({ id: realId, name: String(name || ''), ts: Date.now() }));
    } catch (e) { /* 存储不可用时仍尝试导航 */ }
    try {
        if (window.parent && window.parent !== window && typeof window.parent.handleMenuClick === 'function') {
            window.parent.handleMenuClick('knowledge_point');
            return;
        }
    } catch (e) { log('⚠️ 父窗口导航失败，落兜底整页跳转: ' + e.message); }
    // 兜底：直接访问 /practice（非 iframe）或旧壳无 handleMenuClick 时，回首页由 SPA 消费旗标
    location.href = '/';
}

// 脑图工具函数
function showLoading() {
    document.getElementById('loadingState').classList.remove('hidden');
}

function hideLoading() {
    document.getElementById('loadingState').classList.add('hidden');
}

function zoomIn() {
    if (svg && zoom) {
        svg.transition().call(zoom.scaleBy, 1.5);
        log('🔍 放大脑图');
    }
}

function zoomOut() {
    if (svg && zoom) {
        svg.transition().call(zoom.scaleBy, 1 / 1.5);
        log('🔍 缩小脑图');
    }
}

function resetView() {
    if (svg && zoom) {
        // 学习路径视图下重置必须走 applyLpFitView：否则实际大小模式的 viewBox 配 identity transform 会静默丢失取景
        const tabs = document.getElementById('lpViewTabs');

function searchNodes() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) {
        log('⚠️ 请输入搜索关键词');
        return;
    }
    
    // 如果有筛选状态，先清除筛选
    if (filteredNodeId) {
        restoreAllNodes();
    }
    
    log(`🔍 搜索节点: "${query}"`);
    
    // 清空之前的搜索结果
    searchResults.clear();
    
    const nodeGroups = d3.selectAll('.node-group');
    const links = d3.selectAll('line');
    const linkLabels = d3.selectAll('.link-label');
    
    // 查找匹配的节点
    let matchCount = 0;
    nodeGroups.each(function(d) {
        if (d.name.toLowerCase().includes(query.toLowerCase())) {
            searchResults.add(d.id);
            matchCount++;
            log(`✅ 找到匹配节点: ${d.name}`);
        }
    });
    
    if (matchCount === 0) {
        log(`❌ 未找到包含 "${query}" 的节点`);
        clearSearch(); // 清除搜索状态
        return;
    }
    
    log(`📊 找到 ${matchCount} 个匹配节点`);
    isSearchActive = true;
    
    // 显示清除搜索按钮
    document.getElementById('clearSearchBtn').classList.remove('hidden');
    
    // 高亮匹配节点，淡化其他节点
    nodeGroups.each(function(d) {
        const nodeGroup = d3.select(this);
        if (searchResults.has(d.id)) {
            // 高亮匹配节点
            nodeGroup.style('opacity', 1)
                     .style('filter', 'drop-shadow(0 0 15px rgba(245, 158, 11, 0.8))');
            // 添加高亮边框
            nodeGroup.select('circle')
                     .attr('stroke', '#F59E0B')
                     .attr('stroke-width', 4);
        } else {
            // 淡化不匹配节点
            nodeGroup.style('opacity', 0.2)
                     .style('filter', 'none');
            // 恢复普通边框
            nodeGroup.select('circle')
                     .attr('stroke', '#fff')
                     .attr('stroke-width', 2);
        }
    });
    
    // 淡化所有连线和标签
    links.style('opacity', 0.2);
    linkLabels.style('opacity', 0.2);
}

// 清除搜索
function clearSearch() {
    if (!isSearchActive) return;
    
    log(`🔄 清除搜索结果`);
    
    // 重置搜索状态
    searchResults.clear();
    isSearchActive = false;
    
    // 隐藏清除搜索按钮
    document.getElementById('clearSearchBtn').classList.add('hidden');
    
    // 清空搜索输入框
    document.getElementById('searchInput').value = '';
    
    const nodeGroups = d3.selectAll('.node-group');
    const links = d3.selectAll('line');
    const linkLabels = d3.selectAll('.link-label');
    
    // 还原所有节点样式
    nodeGroups.style('opacity', 1)
              .style('filter', 'none');
    
    // 还原所有节点边框
    nodeGroups.select('circle')
              .attr('stroke', '#fff')
              .attr('stroke-width', 2);
    
    // 还原所有连线和标签
    links.style('opacity', 0.9);
    linkLabels.style('opacity', 1);
    
    log(`✅ 已清除搜索状态`);
}

// 全屏功能
let isFullscreen = false;

function toggleFullscreen() {
    if (!isFullscreen) {
        enterFullscreen();
    } else {
        exitFullscreen();
    }
}

function enterFullscreen() {
    log('🖥️ 进入全屏模式');
    
    const mindmapPage = document.getElementById('mindmapPage');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
    
    // 添加全屏样式类
    mindmapPage.classList.add('fullscreen-mode');
    
    // 切换按钮显示
    fullscreenBtn.classList.add('hidden');
    exitFullscreenBtn.classList.remove('hidden');
    
    // 更新状态
    isFullscreen = true;

}

function exitFullscreen() {
    log('🖥️ 退出全屏模式');
    
    const mindmapPage = document.getElementById('mindmapPage');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
    
    // 移除全屏样式类
    mindmapPage.classList.remove('fullscreen-mode');
    
    // 切换按钮显示
    fullscreenBtn.classList.remove('hidden');
    exitFullscreenBtn.classList.add('hidden');
    
    // 更新状态
    isFullscreen = false;
    
    // 重新调整SVG大小
    setTimeout(() => {
        if (svg && zoom) {
            // 重新设置SVG尺寸
            const container = document.getElementById('mindmapSvgContainer');
            const rect = container.getBoundingClientRect();
            svg.attr('width', rect.width).attr('height', rect.height);
            
            // 重置视图以适应新尺寸
            svg.call(zoom.transform, d3.zoomIdentity);
            log('✅ 普通模式SVG已调整');
        }

// 键盘快捷键支持
document.addEventListener('keydown', function(e) {

// 刷新脑图缓存
async function refreshMindmapCache() {
    // 优先使用全局变量，备用方案是从标题提取
    let currentSubject = currentSubjectName;
    if (!currentSubject) {
        const titleText = document.getElementById('mindmapTitle').textContent;
        currentSubject = titleText.replace(' - 知识脑图', '').replace('知识脑图', '').trim();
    }
    
    if (!currentSubject) {

        log(`全局变量: "${currentSubjectName}"`);
        log(`页面标题: "${document.getElementById('mindmapTitle').textContent}"`);
        return;

    log(`🔄 开始刷新 "${currentSubject}" 的脑图缓存...`);
    
    // 更新按钮状态
    const refreshBtn = document.getElementById('refreshCacheBtn');
    const originalText = refreshBtn.innerHTML;
    refreshBtn.innerHTML = '<span class="material-icons-outlined text-sm animate-spin">refresh</span><span>刷新中...</span>';
    refreshBtn.disabled = true;
    
    try {

            // 先清除缓存

    }

// 处理节点筛选
function handleNodeFilter(clickedNode) {
    // 如果有搜索状态，先清除搜索
    if (isSearchActive) {
        clearSearch();
    }
    
    const nodeGroups = d3.selectAll('.node-group');
    const links = d3.selectAll('line');
    const linkLabels = d3.selectAll('.link-label');
    
    // 如果点击的是当前筛选的节点，则还原显示
    if (filteredNodeId === clickedNode.id) {
        log(`🔄 还原显示所有节点`);
        restoreAllNodes();
        return;
    }
    
    // 保存当前筛选的节点ID
    filteredNodeId = clickedNode.id;
    log(`🎯 筛选显示 "${clickedNode.name}" 的子节点`);
    
    // 获取所有边数据来找出子节点
    const edges = currentMindmapData.edges || [];
    const childNodeIds = new Set();
    
    // 找出所有以当前节点为源的边的目标节点
    edges.forEach(edge => {
        if (edge.source === clickedNode.id || (typeof edge.source === 'object' && edge.source.id === clickedNode.id)) {
            const targetId = typeof edge.target === 'object' ? edge.target.id : edge.target;
            childNodeIds.add(targetId);
        }
    });
    
    // 添加点击的节点本身
    childNodeIds.add(clickedNode.id);
    
    log(`📊 找到 ${childNodeIds.size - 1} 个子节点`);
    
    // 显示清除筛选按钮
    document.getElementById('clearFilterBtn').classList.remove('hidden');
    
    // 隐藏不相关的节点
    nodeGroups.each(function(d) {
        const nodeGroup = d3.select(this);
        if (childNodeIds.has(d.id)) {
            // 显示相关节点，添加高亮效果
            nodeGroup.style('opacity', 1)
                     .style('filter', d.id === clickedNode.id ? 'drop-shadow(0 0 10px rgba(59, 130, 246, 0.8))' : 'none');
        } else {
            // 隐藏不相关节点
            nodeGroup.style('opacity', 0.1);
        }
    });
    
    // 只显示相关的连线
    links.each(function(d) {
        const link = d3.select(this);
        const sourceId = typeof d.source === 'object' ? d.source.id : d.source;
        const targetId = typeof d.target === 'object' ? d.target.id : d.target;
        
        if (childNodeIds.has(sourceId) && childNodeIds.has(targetId)) {
            link.style('opacity', 1);
        } else {
            link.style('opacity', 0.1);
        }
    });
    
    // 只显示相关的连线标签
    linkLabels.each(function(d) {
        const label = d3.select(this);
        const sourceId = typeof d.source === 'object' ? d.source.id : d.source;
        const targetId = typeof d.target === 'object' ? d.target.id : d.target;
        
        if (childNodeIds.has(sourceId) && childNodeIds.has(targetId)) {
            label.style('opacity', 1);
        } else {
            label.style('opacity', 0.1);
        }
    });
}

// 还原所有节点显示
function restoreAllNodes() {
    filteredNodeId = null;
    
    // 隐藏清除筛选按钮
    document.getElementById('clearFilterBtn').classList.add('hidden');
    
    const nodeGroups = d3.selectAll('.node-group');
    const links = d3.selectAll('line');
    const linkLabels = d3.selectAll('.link-label');
    
    // 还原所有节点
    nodeGroups.style('opacity', 1)
              .style('filter', 'none');
    
    // 还原所有连线
    links.style('opacity', 0.9);
    
    // 还原所有连线标签
    linkLabels.style('opacity', 1);
    
    log(`✅ 已还原显示所有节点`);
}

function restorePreviousMindmapState() {

    // 使用全局变量或其他方式管理状态
    try {
        if (typeof(Storage) !== "undefined" && window.localStorage) {
            const lastViewedSubject = localStorage.getItem('lastViewedSubject');
            const lastViewedKnowledgePoint = localStorage.getItem('lastViewedKnowledgePoint');
            
            if (lastViewedSubject) {
                log(`🔄 发现上次查看的学科: ${lastViewedSubject} (但不自动恢复，避免重复渲染)`);
                
                // 不自动恢复，避免与用户手动点击冲突导致重复渲染
                // 用户需要手动点击学科卡片
                log(`💡 请手动点击 "${lastViewedSubject}" 学科卡片`);
                
                // 如果有上次查看的知识点，记录但不自动恢复
                if (lastViewedKnowledgePoint) {
                    log(`🔄 发现上次查看的知识点: ${lastViewedKnowledgePoint} (不自动恢复)`);
                }
            }
        } else {
            log('⚠️ localStorage不可用，跳过状态恢复');
        }
    } catch (error) {
        log(`⚠️ localStorage访问失败: ${error.message}，跳过状态恢复`);
    }
}

<script>
// 学习路径图相关功能
let currentLearningPathData = null;
let isGeneratingLearningPath = false;
// 学习路径视图模式：'linear' 线性图 | 'tree' 技能树（两图共用同一批节点，Tab 切换）
let currentLpViewMode = 'linear';
// 老缓存缺前序依赖时的自动升级只允许尝试一次，防止反复重生成烧积分
let _lpTreeUpgradeTried = false;
// 学习路径显示模式：false=全图适配（viewBox=内容尺寸）| true=实际大小（viewBox=容器像素，1:1 字清晰+拖拽浏览）
let lpActualSize = false;
// 当前学习路径视图的内容尺寸（由各渲染函数写入，applyLpFitView 据此设 viewBox）
let _lpContentSize = { w: 3200, h: 700 };
// 实际大小模式的取景中心（学习路径起点），null=内容几何居中
let _lpContentFocus = null;

// 生成学习路径图
async function generateLearningPath() {
    if (isGeneratingLearningPath) {
        log('⚠️ 学习路径正在生成中，跳过重复调用');
        return;
    }
    
    if (!currentSubjectName) {
        log('❌ 没有选择学科，无法生成学习路径');
        return;
    }
    
    isGeneratingLearningPath = true;
    log(`🌳 开始生成 ${currentSubjectName} 的学习路径图`);
    
    // 更新按钮状态
    const btn = document.getElementById('generateLearningPathBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-icons-outlined text-sm animate-spin">refresh</span><span>生成中...</span>';
    btn.disabled = true;
    
    try {
        // 检查WebChannel连接
        log(`🔍 检查WebChannel连接状态:`);
        log(`  - window.pybridge 存在: ${!!window.pybridge}`);
        log(`  - getOrGenerateLearningPath 方法存在: ${!!(window.pybridge && window.pybridge.getOrGenerateLearningPath)}`);
        
        if (!window.pybridge || !window.pybridge.getOrGenerateLearningPath) {
            throw new Error('WebChannel连接不可用或方法不存在');
        }
        
        log(`📡 调用后端API生成学习路径...`);
        log(`📤 请求参数: 学科="${currentSubjectName}"`);
        
        const response = await window.pybridge.getOrGenerateLearningPath(currentSubjectName);
        log(`📡 API响应长度: ${response ? response.length : 0}`);
        log(`📡 API响应预览: ${response ? response.substring(0, 200) + '...' : 'null'}`);
        
        const result = JSON.parse(response);
        
        if (result.success && result.learningPath && result.learningPath.data) {
            log(`✅ 学习路径生成成功`);
            currentLearningPathData = result.learningPath.data;
            
            // 切换到学习路径视图
            switchToLearningPathView();
            renderCurrentLpView();
        } else {
            throw new Error(result.error || '学习路径生成失败');
        }
        
    } catch (error) {
        log(`❌ 生成学习路径失败: ${error.message}`);
        alert(`生成学习路径失败: ${error.message}`);
    } finally {
        // 恢复按钮状态
        btn.innerHTML = originalText;
        btn.disabled = false;
        isGeneratingLearningPath = false;
    }
}

// 切换到学习路径视图
function switchToLearningPathView() {
    log('🔄 切换到学习路径视图');
    hideLpTooltip();  // 兜底：同上，防旧悬停态残留

    // 显示线性/技能树 Tab
    const tabs = document.getElementById('lpViewTabs');

    // 添加返回按钮

        backBtn.onclick = switchToMindmapView;
        backBtn.className = 'bg-gray-500 text-white px-3 py-1 rounded-lg hover:bg-gray-600 transition-colors flex items-center space-x-1';
        backBtn.innerHTML = '<span class="material-icons-outlined text-sm">arrow_back</span><span>返回脑图</span>';
        titleDiv.querySelector('div:first-child').appendChild(backBtn);

}

// 切换回知识脑图视图
function switchToMindmapView() {
    log('🔄 切换回知识脑图视图');
    
    // 评审修复：返回脑图即视为新一轮用户意图，复位一次性标记，
    // 允许升级失败后再次点"梳理知识点→技能树"重试（防循环靠同一视图内一次性标记 + 生成中互斥）
    _lpTreeUpgradeTried = false;
    // 复位显示模式与悬停提示（下次进入学习路径从"全图适配"开始）
    lpActualSize = false;

    if (currentMindmapData) {

    }
}

// 技能树 / 线性视图共用：画一个节点卡片（与技能树完全同规格，单一实现避免样式分叉）
// 白底圆角卡片 + 左侧状态色条（黄=已学按熟练度 / 灰=未评估 / 绿=AI补充）；solidBlue=蓝底白字主线/目标卡
function drawLpCard(group, n, solidBlue) {
    const CARD_W = 168, CARD_H = 52;
    group.append('rect')
        .attr('class', 'tree-card')
        .attr('x', -CARD_W / 2).attr('y', -CARD_H / 2)
        .attr('width', CARD_W).attr('height', CARD_H)
        .attr('rx', 10)
        .attr('fill', solidBlue ? '#2196F3' : '#FFFFFF')
        .attr('stroke', solidBlue ? '#1565C0' : (n.type === 'supplement_kp' ? '#A5D6A7' : '#D7DEE8'))
        .attr('stroke-width', 1.5)
        .attr('filter', 'url(#treeCardShadow)');
    if (!solidBlue) {
        const barColor = n.type === 'existing_kp' ? getKnowledgePointColor(n.mastery_score) : '#81C784';
        group.append('rect')
            .attr('x', -CARD_W / 2 + 2).attr('y', -CARD_H / 2 + 2)
            .attr('width', 5).attr('height', CARD_H - 4)
            .attr('rx', 2.5)
            .attr('fill', barColor);
    }
    // 卡内文字：14px 最多两行，超出省略（全名在悬停提示里）
    const name = n.name || '';
    const maxChars = Math.floor((CARD_W - 36) / 14);
    const lines = [];
    for (let i = 0; i < name.length && lines.length < 2; i += maxChars) {
        lines.push(name.substring(i, i + maxChars));
    }
    if (name.length > maxChars * 2 && lines.length === 2) {
        lines[1] = lines[1].substring(0, maxChars - 1) + '…';
    }
    const textColor = solidBlue ? '#FFFFFF' : '#1F2937';
    lines.forEach((ln, i) => {
        group.append('text')
            .attr('text-anchor', 'middle')
            .attr('x', 3)
            .attr('dy', lines.length === 1 ? '0.35em' : `${(i - 0.5) * 1.3}em`)
            .attr('font-size', '14px')
            .attr('font-weight', solidBlue ? 'bold' : '500')
            .attr('fill', textColor)
            .text(ln);
    });
}

// 渲染学习路径图
function renderLearningPath() {
    if (!currentLearningPathData || !currentLearningPathData.nodes) {
        log('❌ 学习路径数据无效');
        return;
    }
    
    log(`🌳 开始渲染学习路径图，节点数: ${currentLearningPathData.nodes.length}`);
    
    // 初始化SVG（复用现有的initSvg函数）
    if (!initSvg()) {
        log('❌ SVG初始化失败，无法渲染学习路径图');
        return;
    }
    // 评审修复：全量重绘后高亮态必须复位，否则切 Tab 再点同一 stage 会走
    // 「重复点击=复位」分支只作用于已被 initSvg 移除的旧 selection，表现为点了不亮
    currentHighlightedStage = null;
    hideStageInfo();

    const nodes = currentLearningPathData.nodes.map(d => ({...d}));
    // bug修复：d3 forceLink 会就地把 edge 的 source/target 从 id 字符串改成节点对象引用，
    // 直接引用原数据会污染 currentLearningPathData，导致第二次渲染（树→线性切回）
    // 全部边被判无效并在 validEdges 块级作用域处抛 ReferenceError → 画布空白
    const edges = (currentLearningPathData.edges || []).map(e => ({ ...e }));
    
    // ===== 线性鱼骨布局：与技能树同款卡片规格，确定性坐标布局 =====
    // 原实现给全部节点钉 fx/fy 再过力引擎——力导向空转，且 forceLink 就地把边端点改写成对象，
    // 正是本次「树→线性空白画布」bug 的污染源；卡片化需要精确的列宽间距，
    // 改为直接算坐标，与技能树视图同为静态渲染（不再依赖 simulation/tick）
    const CARD_W = 168, CARD_H = 52;    // 与技能树完全相同的卡片尺寸
    const COL_GAP = CARD_W + 36;        // 列内知识点卡片水平间距（168 卡片 + 36 间隙，防叠卡）
    const MAIN_Y = 350;                 // 主线水平线
    const KP_DY = 150;                  // 知识点行与主线的垂直距离（卡片高 + 连线余量）
    const PAD_X = 140;
    const mainTypes = new Set(['start', 'stage', 'end']);

    // 主线节点：起点最前、终点最后，stage 按 level 排序（学习进度从左到右）
    const mainNodes = nodes.filter(n => mainTypes.has(n.type));
    mainNodes.sort((a, b) => {
        const rank = n => n.type === 'start' ? -1e9 : (n.type === 'end' ? 1e9 : 0);
        return rank(a) - rank(b) || (a.level || 0) - (b.level || 0) || String(a.id).localeCompare(String(b.id));
    });

    // 知识点按父阶段分组；父阶段缺失/指向不存在阶段的进孤儿组（保证画得出来，不吞节点）
    const knowledgeNodes = nodes.filter(n => n.type === 'existing_kp' || n.type === 'supplement_kp');
    const stageGroups = {};
    knowledgeNodes.forEach(node => {
        const key = mainNodes.some(m => m.id === node.parent_stage) ? node.parent_stage : 'orphan';
        (stageGroups[key] = stageGroups[key] || []).push(node);
    });

    // 逐列布局：列宽由上/下两行中较多的一行决定，主线卡片居中，知识点分行居中上下挂
    let cursor = PAD_X;
    mainNodes.forEach(m => {
        const group = stageGroups[m.id] || [];
        const upperCount = Math.ceil(group.length / 2);
        const cols = Math.max(upperCount, group.length - upperCount, 1);
        const colW = cols * COL_GAP;
        m.x = cursor + colW / 2;
        m.y = MAIN_Y;
        group.forEach((kp, i) => {
            const above = i < upperCount;
            const row = above ? group.slice(0, upperCount) : group.slice(upperCount);
            const idx = above ? i : i - upperCount;
            kp.x = m.x + (idx - (row.length - 1) / 2) * COL_GAP;
            kp.y = MAIN_Y + (above ? -KP_DY : KP_DY);
        });
        cursor += colW;
    });

    // 孤儿知识点：挂在主线末端之后一列、主线下方（无父阶段就不画挂载线）
    const orphans = stageGroups['orphan'] || [];
    if (orphans.length > 0) {
        log(`⚠️ 线性图：${orphans.length} 个知识点缺少有效父阶段，挂载到主线末端之后`);
        orphans.forEach((kp, i) => {
            kp.x = cursor + COL_GAP / 2 + i * COL_GAP;
            kp.y = MAIN_Y + KP_DY;
        });
        cursor += orphans.length * COL_GAP;
    }

    // 其它旧节点类型（milestone 等兼容数据）：沿主线水平均分、下方第二排，保证画得出来
    // 评审修复：无主线无知识点的历史数据下 cursor 会退化，给保底步长防卡片重叠成一张
    const placedTypes = new Set([...mainTypes, 'existing_kp', 'supplement_kp']);
    const restNodes = nodes.filter(n => !placedTypes.has(n.type));
    const restSpan = Math.max(cursor - PAD_X, restNodes.length * COL_GAP);
    restNodes.forEach((n, i, arr) => {
        n.x = PAD_X + (i + 1) * (restSpan / (arr.length + 1));
        n.y = MAIN_Y + KP_DY * 2;
    });

    // 内容实际宽度（全图适配 / 实际大小两种模式的 viewBox 与取景都按它来）
    const contentW = Math.max(1200, Math.round(cursor + PAD_X));
    log(`🔍 线性鱼骨布局: 主线${mainNodes.length}个, 知识点${knowledgeNodes.length}个, 内容宽度${contentW}px`);
    
    // 验证所有边引用的节点都存在（bug修复：validEdges 必须在 if 块外定义，原代码块内 const 而块外引用抛 ReferenceError）
    const nodeIds = new Set(nodes.map(n => n.id));
    const invalidEdges = edges.filter(edge =>
        !nodeIds.has(edge.source) || !nodeIds.has(edge.target)
    );
    if (invalidEdges.length > 0) {
        log(`⚠️ 发现无效边: ${invalidEdges.length}条，已过滤`);
    }
    const validEdges = edges.filter(edge =>
        nodeIds.has(edge.source) && nodeIds.has(edge.target)
    );
    log(`✅ 使用有效边: ${validEdges.length}条`);

    // 创建鱼骨图布局的力导向图（原 if/else 两分支重复创建收敛为一份；center/x/y/collision 统一在下方公共配置）
    // 布局已改为上方确定性坐标，不再创建 simulation（也彻底消除 forceLink 就地污染边数据的隐患）
    
    // ===== 绘制：技能树同款卡片 + 连线，结构仍是线性鱼骨 =====
    const defs = svg.append('defs');
    // 卡片投影滤镜（与技能树同参数，渲染前 initSvg 已清空旧 defs，同名不冲突）
    const shadow = defs.append('filter')
        .attr('id', 'treeCardShadow')
        .attr('x', '-20%').attr('y', '-30%').attr('width', '140%').attr('height', '160%');
    shadow.append('feDropShadow')
        .attr('dx', 0).attr('dy', 1).attr('stdDeviation', 2)
        .attr('flood-color', '#000000').attr('flood-opacity', 0.16);
    // 主线箭头（橙色，指向学习进度方向）
    defs.append('marker')
        .attr('id', 'learningArrow')
        .attr('viewBox', '0 -5 10 10')
        .attr('refX', 9).attr('refY', 0)
        .attr('markerWidth', 8).attr('markerHeight', 8)
        .attr('orient', 'auto')
        .append('path')
        .attr('d', 'M0,-5L10,0L0,5')
        .attr('fill', '#FF9800');

    // 边端点手动解析（无 force 引擎，source/target 保持字符串 id，从根上消除就地污染）
    const nodeById = new Map(nodes.map(n => [n.id, n]));
    const drawEdges = [];
    validEdges.forEach(e => {
        let s = nodeById.get(e.source);
        let t = nodeById.get(e.target);
        if (!s || !t) return;
        const sMain = mainTypes.has(s.type), tMain = mainTypes.has(t.type);
        let kind = 'other';
        if (sMain && tMain) {
            kind = 'main';
            // 主线箭头统一指向学习进度方向（坐标已按 start→stage→end 排好，直接按 x 判定，
            // 避免同 level 并列时 rank 与坐标口径不一致画出反向线段）
            if (s.x > t.x) { const tmp = s; s = t; t = tmp; }
        } else if (sMain !== tMain) {
            kind = 'branch';
        }
        drawEdges.push({ s, t, kind });
    });

    // 连线路径：主线水平直线裁到卡片边界；挂载线从主线卡上下沿出、S 形曲线进知识点卡；
    // 其它连线（知识点↔知识点）直线裁到卡片边界（与技能树回退直线同款公式）
    function lpEdgePath(e) {
        if (e.kind === 'main') {
            return `M${e.s.x + CARD_W / 2 + 4},${MAIN_Y}L${e.t.x - CARD_W / 2 - 10},${MAIN_Y}`;
        }
        if (e.kind === 'branch') {
            const m = mainTypes.has(e.s.type) ? e.s : e.t;
            const k = m === e.s ? e.t : e.s;
            const dir = k.y >= m.y ? 1 : -1;
            const sx = m.x + Math.max(-44, Math.min(44, (k.x - m.x) * 0.3));
            const sy = m.y + dir * (CARD_H / 2 + 2);
            const ty = k.y - dir * (CARD_H / 2 + 2);
            const mid = (sy + ty) / 2;
            return `M${sx},${sy}C${sx},${mid} ${k.x},${mid} ${k.x},${ty}`;
        }
        const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len, uy = dy / len;
        const kx = Math.abs(ux) > 1e-6 ? (CARD_W / 2 + 2) / Math.abs(ux) : Infinity;
        const ky = Math.abs(uy) > 1e-6 ? (CARD_H / 2 + 2) / Math.abs(uy) : Infinity;
        const kk = Math.min(kx, ky, len / 2);
        return `M${e.s.x + ux * kk},${e.s.y + uy * kk}L${e.t.x - ux * kk},${e.t.y - uy * kk}`;
    }

    const links = g.selectAll('.learning-link')
        .data(drawEdges)
        .enter().append('path')
        .attr('class', 'learning-link')
        .attr('fill', 'none')
        .attr('stroke', e => e.kind === 'main' ? '#FF9800' : '#90A4AE')
        .attr('stroke-width', e => e.kind === 'main' ? 2.5 : 1.5)
        .attr('opacity', e => e.kind === 'main' ? 1 : 0.85)
        .attr('marker-end', e => e.kind === 'main' ? 'url(#learningArrow)' : null)
        .attr('d', lpEdgePath);

    // 节点卡片：交互口径与技能树一致——stage 点击高亮本组，知识点点击开详情，悬停看全名/掌握度
    // （评审收敛：删除旧硬编码云运维词表分支，existing_kp + original_kp_id 已完整覆盖可点场景）
    const nodeGroups = g.selectAll('.learning-node')
        .data(nodes)
        .enter().append('g')
        .attr('class', 'learning-node')
        .attr('transform', n => `translate(${n.x},${n.y})`)
        .style('cursor', n => {
            if (n.type === 'stage') return 'pointer';
            if (n.type === 'existing_kp' && n.original_kp_id) return 'pointer';
            return 'default';
        })
        .on('click', function(event, n) {
            if (n.type === 'stage') {
                event.stopPropagation(); // 防止事件冒泡
                highlightStageAndChildren(n);
            } else if (n.type === 'existing_kp' && n.original_kp_id) {
                event.stopPropagation(); // 防止事件冒泡
                // 统一走公共函数（与技能树视图同一打开路径）
                openLearningPathNodeDetail(n);
            }
        })
        .on('mouseover', function(event, n) { showLpTooltip(event, lpNodeTipHtml(n)); })
        .on('mousemove', function(event) { moveLpTooltip(event); })
        .on('mouseout', hideLpTooltip);

    nodeGroups.each(function(n) {
        drawLpCard(d3.select(this), n, mainTypes.has(n.type));
    });

    // 图例：HTML 悬浮卡片，语义与卡片样式对齐
    showLearningLegend('linear');
    // 内容尺寸按实际布局登记（全图适配看整体，实际大小模式取景对准主线起点）
    _lpContentSize = { w: contentW, h: 700 };
    _lpContentFocus = mainNodes.length ? { x: mainNodes[0].x, y: MAIN_Y } : { x: PAD_X, y: MAIN_Y };
    applyLpFitView();

    // 保存全局变量供高亮/恢复函数使用（边为解析后的 {s,t,kind} 结构）
    globalNodes = nodes;
    globalEdges = drawEdges;
    globalLinks = links;
    globalNodeGroups = nodeGroups;

    // 添加背景点击事件，点击空白区域恢复正常显示
    svg.on('click', function(event) {
        // 检查点击的是否是背景（不是节点或连线）
        if (event.target === this && currentHighlightedStage) {
            log('🖱️ 点击背景，恢复正常显示');
            resetHighlight();
        }
    });

    log(`✅ 线性学习路径渲染完成: ${nodes.length}个节点, ${drawEdges.length}条连线`);
}

// ==================== 学习路径双视图（线性 / 技能树） ====================

// 当前数据是否带前序依赖信息（新后端生成时必带 prerequisites 数组；老缓存没有该字段）
function hasLearningPathPrerequisites() {
    if (!currentLearningPathData || !Array.isArray(currentLearningPathData.nodes)) return false;
    return currentLearningPathData.nodes.some(n =>
        (n.type === 'existing_kp' || n.type === 'supplement_kp') && Array.isArray(n.prerequisites));
}

// 统一渲染入口：按当前 Tab 模式画对应图（节点集合完全相同，只是组织形式不同）
function renderCurrentLpView() {
    if (currentLpViewMode === 'tree') {
        renderLearningPathTree();
    } else {
        renderLearningPath();
    }
}

// Tab 切换
function switchLpViewMode(mode) {
    log(`🔀 切换学习路径视图模式: ${mode}`);
    hideLpTooltip();  // 兜底：重绘移除旧 DOM 时 mouseout 不一定触发，防 tooltip 残留
    currentLpViewMode = mode;
    updateLpTabStyles();
    
    // A 方案：老缓存缺依赖数据时，首次切到技能树自动触发一次重新生成（消耗一次 LLM 调用，之后两图共用新缓存）
    if (mode === 'tree' && currentLearningPathData && !hasLearningPathPrerequisites()) {
        if (!_lpTreeUpgradeTried) {
            _lpTreeUpgradeTried = true;
            regenerateForTreeMode();
            return;
        }
        // 升级已尝试过仍无依赖数据（LLM 漏输出）：树视图会退化为按阶段串联，不再反复重生成
    }
    renderCurrentLpView();
}

function updateLpTabStyles() {
    const linearBtn = document.getElementById('lpTabLinear');
    const treeBtn = document.getElementById('lpTabTree');
    if (!linearBtn || !treeBtn) return;
    const active = 'bg-white text-gray-800 shadow';
    const inactive = 'text-gray-500 hover:text-gray-700';
    linearBtn.className = `px-3 py-1 rounded-md text-sm font-medium ${currentLpViewMode === 'linear' ? active : inactive}`;
    treeBtn.className = `px-3 py-1 rounded-md text-sm font-medium ${currentLpViewMode === 'tree' ? active : inactive}`;
}

// 首次升级：清旧缓存 → 重新生成（带依赖）→ 按当前模式（tree）渲染
async function regenerateForTreeMode() {
    if (isGeneratingLearningPath) return;
    const loading = document.getElementById('loadingState');
    const loadingText = loading ? loading.querySelector('p') : null;
    const originalLoadingText = loadingText ? loadingText.textContent : '';
    if (loadingText) loadingText.textContent = '正在生成技能树依赖关系（首次需要一次 AI 分析）...';
    if (loading) loading.classList.remove('hidden');
    try {
        if (window.pybridge && window.pybridge.clearLearningPathCache) {
            const clearResp = await window.pybridge.clearLearningPathCache(currentSubjectName);
            log(`🧹 清理旧学习路径缓存: ${clearResp && clearResp.success ? 'ok' : clearResp && clearResp.error}`);
        }
        // generateLearningPath 内部会走 renderCurrentLpView → 技能树
        await generateLearningPath();
        // 评审修复：升级未成功（生成失败/LLM 漏输出依赖/缓存未清掉命中旧数据）时，
        // Tab 回退线性并重绘，避免"技能树高亮但画布仍是旧图"的状态不一致
        if (!hasLearningPathPrerequisites()) {
            log('⚠️ 技能树升级未成功（无依赖数据），回退到线性视图');
            currentLpViewMode = 'linear';
            updateLpTabStyles();
            renderCurrentLpView();
        }
    } catch (e) {
        log(`❌ 技能树依赖升级失败: ${e.message}`);
        alert(`技能树依赖生成失败: ${e.message}`);
    } finally {
        if (loadingText) loadingText.textContent = originalLoadingText;
        if (loading) loading.classList.add('hidden');
    }
}

// 学习路径知识点节点 → 统一跳转知识点落地页（线性/树形两视图共用；P1 落地页统一，抽屉已下线）
function openLearningPathNodeDetail(d) {
    goKnowledgePointLanding(d.original_kp_id, d.name || d.point_name);
}

// 学习路径图例（HTML 悬浮卡片，字号固定不随 viewBox/缩放变小）
function showLearningLegend(mode) {
    const card = document.getElementById('learningLegendCard');
    const itemsBox = document.getElementById('learningLegendItems');
    if (!card || !itemsBox) return;
    
    let items = [];
    if (mode === 'tree') {
        items = [
            { color: '#FDBA74', label: '已学知识点（按熟练度着色，颜色越黄越熟）' },
            { color: '#E5E7EB', label: '未评估/未学知识点（浅灰）' },
            { color: '#81C784', label: 'AI 补充知识点（绿）' },
            { color: '#2196F3', label: '最终掌握目标（最右）' },
            { line: true, label: '连线方向：前序知识点 → 依赖它的知识点' }
        ];
        itemsBox.innerHTML = items.map(it => `
            <div class="flex items-center space-x-2 text-sm text-gray-700">
                ${it.line
                    ? '<span class="inline-block w-4 border-t-2 border-gray-400"></span>'
                    : `<span class="inline-block w-4 h-4 rounded-full border border-white shadow-sm" style="background:${it.color}"></span>`}
                <span>${it.label}</span>
            </div>`).join('') +
            '<div class="text-xs text-gray-500 pt-1">前序全部点亮后，即可去学右侧对应的知识点；悬停节点看全名与前序，点「实际大小」放大到能读字</div>';
    } else {
        items = [
            { color: '#2196F3', label: '起点 / 阶段 / 终点（蓝色主线卡）' },
            { color: '#FDBA74', label: '已有知识点（左侧色条按熟练度着色，越黄越熟）' },
            { color: '#E5E7EB', label: '未评估知识点（浅灰色条）' },
            { color: '#81C784', label: 'AI 补充知识点（绿色色条）' }
        ];
        itemsBox.innerHTML = items.map(it => `
            <div class="flex items-center space-x-2 text-sm text-gray-700">
                <span class="inline-block w-4 h-4 rounded-full border border-white shadow-sm" style="background:${it.color}"></span>
                <span>${it.label}</span>
            </div>`).join('') +
            '<div class="text-xs text-gray-500 pt-1">点阶段卡高亮该组知识点；悬停卡片看全名与掌握度</div>';
    }
    card.classList.remove('hidden');
}

function hideLearningLegend() {
