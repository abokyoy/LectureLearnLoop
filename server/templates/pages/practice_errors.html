<!-- 批4 重设计：基于错题练习（假数据下线，数据源 /api/subjects + /api/kb/errors） -->
<div class="cl-page space-y-6" data-pm-page="practice_errors">

    <div class="flex items-start justify-between gap-4 flex-wrap">
        <div>
            <h1 class="text-[22px] font-bold text-cl-text flex items-center gap-2">
                <svg class="w-6 h-6 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-alert-circle"/></svg>
                错题练习
            </h1>
            <p class="text-sm text-cl-text-2 mt-1">答错的题都会收在这里，点开题目可以对比正确答案</p>
        </div>
        <span class="cl-badge bg-cl-primary-soft text-cl-primary" data-role="count"></span>
    </div>

    <div class="flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-2 flex-1 min-w-0" data-role="subjects"></div>
        <input data-role="search" type="text" placeholder="搜索错题题目…"
            class="h-9 w-56 max-w-full rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
    </div>

    <!-- 错题学习单元升级 P3/P4：科目级练习闭环 + 薄弱点分析工具栏（行级按钮在每条错题上） -->
    <div class="flex items-center gap-2 flex-wrap" data-role="toolbar">
        <button class="cl-btn-primary !h-9 text-xs" data-tb="smart">智能练错题</button>
        <button class="cl-btn-ghost !h-9 text-xs" data-tb="manual">勾选练习</button>
        <button class="cl-btn-ghost !h-9 text-xs" data-tb="analogy">举一反三</button>
        <button class="cl-btn-ghost !h-9 text-xs" data-tb="report">薄弱点分析</button>
    </div>

    <div data-role="main">
        <p class="text-sm text-cl-text-3 py-6">加载中…</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
