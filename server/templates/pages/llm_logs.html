<!-- 批8 重设计：LLM 调用日志查看器（设计系统 cl-* 接管；数据源双通路——桌面端 window.bridge 优先、Web SPA 回落 HTTP /api/llm/logs + /api/llm/stats；全部动态值 esc 防注入；去全局函数与内联事件，改事件委托；渲染令牌 P024） -->
<div class="cl-page space-y-6" data-log-page="llm">

    <div>
        <h1 class="text-[22px] font-bold text-cl-text flex items-center gap-2">
            <svg class="w-6 h-6 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-chart-column"/></svg>
            LLM 调用观测
        </h1>
        <p class="text-sm text-cl-text-2 mt-1">最近 100 次大模型调用的统计与明细，供排查耗时与失败原因</p>
    </div>

    <!-- ============ 统计 ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="cl-section-title">
            <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-chart-column"/></svg>
            调用统计
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
            <div class="rounded-cl bg-cl-bg p-4 text-center">
                <div class="text-2xl font-bold text-cl-primary" id="st-total">--</div>
                <div class="text-[11px] text-cl-text-3 mt-1">总调用次数</div>
            </div>
            <div class="rounded-cl bg-cl-bg p-4 text-center">
                <div class="text-2xl font-bold text-cl-secondary" id="st-ok">--</div>
                <div class="text-[11px] text-cl-text-3 mt-1">成功调用</div>
            </div>
            <div class="rounded-cl bg-cl-bg p-4 text-center">
                <div class="text-2xl font-bold text-cl-text" id="st-rate">--</div>
                <div class="text-[11px] text-cl-text-3 mt-1">成功率</div>
            </div>
            <div class="rounded-cl bg-cl-bg p-4 text-center">
                <div class="text-2xl font-bold text-cl-text" id="st-dur">--</div>
                <div class="text-[11px] text-cl-text-3 mt-1">平均响应</div>
            </div>
            <div class="rounded-cl bg-cl-bg p-4 text-center">
                <div class="text-2xl font-bold text-cl-text" id="st-fbt">--</div>
                <div class="text-[11px] text-cl-text-3 mt-1">平均首字节</div>
            </div>
        </div>
    </div>

    <!-- ============ 日志列表 ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="cl-section-title !mb-0">
                <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-list-tree"/></svg>
                调用日志
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <input type="text" id="filter-input" placeholder="搜索提供商 / 模型 / 上下文 / 时间"
                    class="h-10 w-full sm:w-64 rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
                <button type="button" class="cl-btn-ghost" id="refresh-btn">
                    <svg class="w-4 h-4" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-refresh-cw"/></svg>
                    刷新
                </button>
                <button type="button" class="cl-btn-ghost" id="export-btn">
                    <svg class="w-4 h-4" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-download"/></svg>
                    导出 CSV
                </button>
            </div>
        </div>
        <div id="logs-container" class="overflow-x-auto">
            <div class="py-8 text-center text-cl-text-3 text-sm">加载中…</div>
        </div>
    </div>
</div>

<script src="/static/js/pm_pages.js"></script>
<script>
(function () {
    'use strict';
    var U = window.pmUtil;
    if (!U) { console.error('[llm_logs] pm_pages.js 未加载'); return; }
    var esc = U.esc, getJSON = U.getJSON;

    var renderTk = 0;
    var currentLogs = [];
    var currentFilter = '';
    var $ = function (id) { return document.getElementById(id); };
    var elContainer = $('logs-container');
    var elFilter = $('filter-input');
    var elRefresh = $('refresh-btn');
    var elExport = $('export-btn');

    // ---------------- 数据源：桥优先，HTTP 回落 ----------------
    function fetchLogs() {
        if (window.bridge && typeof window.bridge.getLLMCallLogs === 'function') {
            return Promise.resolve().then(function () {
                return window.bridge.getLLMCallLogs();
            }).then(function (result) {
                var data = result;
                if (typeof data === 'string') data = JSON.parse(data);
                if (!data || !data.success) throw new Error((data && data.error) || '获取日志失败');
                return { records: data.records || [], statistics: data.statistics || {} };
            });
        }
        return Promise.all([
            getJSON('/api/llm/logs?limit=100'),
            getJSON('/api/llm/stats').catch(function () { return {}; }),
        ]).then(function (rs) { return { records: rs[0] || [], statistics: rs[1] || {} }; });
    }

    // ---------------- 统计 ----------------
    function displayStats(stats) {
        stats = stats || {};
        var successRate = stats.success_rate != null ? Number(stats.success_rate).toFixed(1) : '0.0';
        var avgDuration = stats.avg_duration != null ? (Number(stats.avg_duration) * 1000).toFixed(0) : '0';
        var avgFirstByte = stats.avg_first_byte_time != null ? (Number(stats.avg_first_byte_time) * 1000).toFixed(0) : '0';
        $('st-total').textContent = String(stats.total_calls || 0);
        $('st-ok').textContent = String(stats.successful_calls || 0);
        $('st-rate').textContent = successRate + '%';
        $('st-dur').textContent = avgDuration + 'ms';
        $('st-fbt').textContent = avgFirstByte + 'ms';
    }

    // ---------------- 日志表 ----------------
    var TD = 'py-2 pr-4 align-top';
    function durationCls(sec) {
        if (sec > 5) return 'text-cl-danger font-medium';
        if (sec > 2) return 'text-[#B45309] font-medium';
        return 'text-cl-secondary font-medium';
    }
    function emptyState(message) {
        elContainer.innerHTML = '<div class="py-12 text-center text-cl-text-3 text-sm">' +
            '<svg class="w-10 h-10 mx-auto mb-3 opacity-40" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-file-text"/></svg>' +
            esc(message) + '</div>';
    }
    function displayLogs(logs) {
        if (!logs || !logs.length) { emptyState('暂无日志记录'); return; }
        var tableHtml = '<table class="w-full text-[12px]">' +
            '<thead><tr class="text-left text-cl-text-3 border-b border-cl-border">' +
            '<th class="' + TD + '">时间</th><th class="' + TD + '">提供商</th><th class="' + TD + '">模型</th>' +
            '<th class="' + TD + '">上下文</th><th class="' + TD + '">状态</th><th class="' + TD + '">耗时</th>' +
            '<th class="' + TD + '">首字节</th><th class="' + TD + '">提示词长度</th><th class="' + TD + '">响应长度</th>' +
            '<th class="py-2 align-top">详情</th></tr></thead><tbody>';
        logs.forEach(function (log) {
            var statusHtml = log.success
                ? '<span class="cl-badge bg-cl-secondary-soft text-cl-secondary">成功</span>'
                : '<span class="cl-badge bg-[#FEE2E2] text-[#991B1B]">失败</span>';
            var dur = Number(log.total_duration || 0);
            var fbt = Number(log.time_to_first_byte || 0);
            var cid = esc(log.call_id || '');
            tableHtml += '<tr class="border-b border-cl-border/60 hover:bg-cl-bg cursor-pointer" data-call-id="' + cid + '">' +
                '<td class="' + TD + '">' + esc(log.timestamp || '') + '</td>' +
                '<td class="' + TD + '"><span class="cl-badge bg-cl-primary-soft text-cl-primary">' + esc(log.provider || '') + '</span></td>' +
                '<td class="' + TD + '">' + esc(log.model || '') + '</td>' +
                '<td class="' + TD + '">' + esc(log.context || '未知') + '</td>' +
                '<td class="' + TD + '">' + statusHtml + '</td>' +
                '<td class="' + TD + ' ' + durationCls(dur) + '">' + (dur * 1000).toFixed(0) + 'ms</td>' +
                '<td class="' + TD + '">' + (fbt * 1000).toFixed(0) + 'ms</td>' +
                '<td class="' + TD + '">' + esc(log.prompt_length != null ? log.prompt_length : '') + '</td>' +
                '<td class="' + TD + '">' + esc(log.response_length != null ? log.response_length : '') + '</td>' +
                '<td class="py-2 align-top"><span class="text-cl-text-3">展开</span></td></tr>' +
                '<tr id="detail-' + cid + '" class="hidden"><td colspan="10" class="px-1 pb-3">' +
                '<div class="rounded-clbtn bg-cl-bg border border-cl-border p-3 text-[11px] text-cl-text-2 space-y-1">' +
                '<div><b>API端点:</b> ' + esc(log.api_endpoint || '') + '</div>' +
                '<div><b>HTTP状态码:</b> ' + esc(log.status_code != null ? log.status_code : '') + '</div>' +
                '<div><b>提示词预览:</b> ' + esc(log.prompt_preview || '') + '</div>' +
                '<div><b>响应预览:</b> ' + esc(log.response_preview || '') + '</div>' +
                (log.error_message ? '<div class="text-cl-danger"><b>错误信息:</b> ' + esc(log.error_message) + '</div>' : '') +
                '</div></td></tr>';
        });
        tableHtml += '</tbody></table>';
        elContainer.innerHTML = tableHtml;
    }

    // 事件委托：点击行展开/收起详情（不依赖全局函数与内联 onclick）
    elContainer.addEventListener('click', function (ev) {
        var tr = ev.target.closest('tr[data-call-id]');
        if (!tr) return;
        var detail = document.getElementById('detail-' + tr.getAttribute('data-call-id'));
        if (detail) detail.classList.toggle('hidden');
    });

    // ---------------- 过滤 ----------------
    function applyFilter() {
        var f = currentFilter.toLowerCase();
        if (!f) { displayLogs(currentLogs); return; }
        var filtered = currentLogs.filter(function (log) {
            return String(log.provider || '').toLowerCase().indexOf(f) >= 0 ||
                String(log.model || '').toLowerCase().indexOf(f) >= 0 ||
                String(log.context || '').toLowerCase().indexOf(f) >= 0 ||
                String(log.timestamp || '').toLowerCase().indexOf(f) >= 0;
        });
        displayLogs(filtered);
    }

    // ---------------- 加载 ----------------
    function loadLogs(my) {
        elContainer.innerHTML = '<div class="py-8 text-center text-cl-text-3 text-sm">加载中…</div>';
        fetchLogs().then(function (data) {
            if (my !== renderTk) return;
            currentLogs = data.records;
            displayStats(data.statistics);
            applyFilter();
        }).catch(function (e) {
            if (my !== renderTk) return;
            currentLogs = [];
            emptyState('加载日志失败：' + e.message);
        });
    }

    // ---------------- 导出 CSV ----------------
    function csvField(v) {
        // CSV 双引号转义，防字段内引号破坏格式
        var s = String(v == null ? '' : v);
        // CodeReview 批8 m-2：公式注入缓解——以 = + - @ 或制表符开头的字段加前缀单引号，防电子表格求值
        if (/^[=+\-@\t]/.test(s)) s = "'" + s;
        return '"' + s.replace(/"/g, '""') + '"';
    }
    function exportLogs() {
        if (!currentLogs.length) { alert('没有日志数据可以导出'); return; }
        var headers = ['时间', '提供商', '模型', '上下文', '状态', '总耗时(s)', '首字节时间(s)', '提示词长度', '响应长度', 'API端点', '错误信息'];
        var lines = [headers.map(csvField).join(',')];
        currentLogs.forEach(function (log) {
            lines.push([
                log.timestamp, log.provider, log.model, log.context || '',
                log.success ? '成功' : '失败', log.total_duration, log.time_to_first_byte,
                log.prompt_length, log.response_length, log.api_endpoint, log.error_message || ''
            ].map(csvField).join(','));
        });
        var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        var url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', 'llm_call_logs_' + new Date().toISOString().slice(0, 10) + '.csv');
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    }

    // ---------------- 初始化 ----------------
    function init() {
        loadLogs(++renderTk);
        elRefresh.addEventListener('click', function () { loadLogs(++renderTk); });
        elExport.addEventListener('click', exportLogs);
        elFilter.addEventListener('input', function () { currentFilter = elFilter.value; applyFilter(); });
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
    else { init(); }
})();
</script>
