<!-- 批8 重设计：管理后台·积分与系统配置（设计系统 cl-* 接管；复用 pmUtil 公共工具，去自写副本；渲染令牌 P024；全部动态值 esc；按钮防连点。所有数据端点均需管理员 require_admin，非管理员显示 403 提示。） -->
<div class="cl-page space-y-6" data-adm-page="credits">

    <div>
        <h1 class="text-[22px] font-bold text-cl-text flex items-center gap-2">
            <svg class="w-6 h-6 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-settings"/></svg>
            管理后台 · 积分与系统配置
        </h1>
        <p class="text-sm text-cl-text-2 mt-1">
            仅管理员可访问。修改立即生效并记入审计流水。
            <a href="/settings" class="text-cl-primary hover:underline ml-1">← 返回设置</a>
        </p>
    </div>

    <div id="adm-top-msg"></div>

    <!-- ============ 积分业务参数 ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="cl-section-title">
            <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-coins"/></svg>
            积分业务参数
        </div>
        <div id="credit-config-rows"></div>
        <button type="button" class="cl-btn-primary" id="save-credit-cfg-btn">保存积分参数</button>
        <div id="credit-config-msg"></div>
    </div>

    <!-- ============ 系统大模型 ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="cl-section-title">
            <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-sparkles"/></svg>
            系统大模型配置（全体用户回落时使用）
        </div>
        <div class="rounded-clbtn bg-cl-primary-soft text-cl-text-2 text-[13px] px-4 py-3 leading-relaxed">
            密钥以掩码显示；不修改则保持原值（原样保存不会覆盖密钥）。
        </div>
        <div id="llm-config-rows"></div>
        <button type="button" class="cl-btn-primary" id="save-llm-cfg-btn">保存系统大模型配置</button>
        <div id="llm-config-msg"></div>
    </div>

    <!-- ============ 用户积分 ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="cl-section-title">
            <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-user"/></svg>
            用户积分总览
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-[13px]">
                <thead>
                    <tr class="text-left text-cl-text-3 border-b border-cl-border">
                        <th class="py-2 pr-4 font-medium">用户名</th>
                        <th class="py-2 pr-4 font-medium">昵称</th>
                        <th class="py-2 pr-4 font-medium">余额</th>
                        <th class="py-2 pr-4 font-medium">累计充值</th>
                        <th class="py-2 pr-4 font-medium">累计赠送</th>
                        <th class="py-2 pr-4 font-medium">累计消耗</th>
                        <th class="py-2 font-medium">操作</th>
                    </tr>
                </thead>
                <tbody id="users-body"><tr><td colspan="7" class="py-6 text-cl-text-3">加载中…</td></tr></tbody>
            </table>
        </div>
        <div id="adjust-box" class="hidden rounded-cl bg-cl-bg p-4 space-y-3">
            <div class="flex flex-wrap items-center gap-3">
                <label class="w-full sm:w-52 text-sm font-medium text-cl-text-2 shrink-0">调整用户</label>
                <input type="text" id="adjust-user" readonly class="h-10 flex-1 min-w-48 rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <label class="w-full sm:w-52 text-sm font-medium text-cl-text-2 shrink-0">调整积分（正增负减）</label>
                <input type="number" id="adjust-delta" step="0.1" placeholder="如 100 或 -50" class="h-10 flex-1 min-w-48 rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <label class="w-full sm:w-52 text-sm font-medium text-cl-text-2 shrink-0">备注</label>
                <input type="text" id="adjust-note" placeholder="调整原因（写入审计流水）" class="h-10 flex-1 min-w-48 rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
            </div>
            <div class="flex items-center gap-3">
                <button type="button" class="cl-btn-primary" id="adjust-submit-btn">提交调整</button>
                <button type="button" class="cl-btn-ghost" id="adjust-tx-btn">查看该用户流水</button>
            </div>
            <div id="adjust-msg"></div>
            <div id="adjust-tx-wrap" class="hidden overflow-x-auto">
                <table class="w-full text-[13px]">
                    <thead>
                        <tr class="text-left text-cl-text-3 border-b border-cl-border">
                            <th class="py-2 pr-4 font-medium">时间</th>
                            <th class="py-2 pr-4 font-medium">类型</th>
                            <th class="py-2 pr-4 font-medium">场景</th>
                            <th class="py-2 pr-4 font-medium">积分</th>
                            <th class="py-2 font-medium">余额</th>
                        </tr>
                    </thead>
                    <tbody id="adjust-tx-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ============ 卡密管理 ============ -->
    <div class="cl-card p-6 space-y-4">
        <div class="cl-section-title">
            <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-scroll-text"/></svg>
            充值卡密管理
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <label class="w-full sm:w-52 text-sm font-medium text-cl-text-2 shrink-0">单张面额（积分）</label>
            <input type="number" id="code-credits" value="100" min="1" step="1" class="h-10 flex-1 min-w-48 rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <label class="w-full sm:w-52 text-sm font-medium text-cl-text-2 shrink-0">生成数量（1-1000）</label>
            <input type="number" id="code-count" value="10" min="1" max="1000" class="h-10 flex-1 min-w-48 rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
        </div>
        <button type="button" class="cl-btn-primary" id="gen-codes-btn">批量生成卡密</button>
        <div id="gen-codes-msg"></div>
        <div id="gen-codes-out" class="hidden rounded-clbtn bg-cl-bg border border-cl-border font-mono text-[13px] p-3 max-h-52 overflow-y-auto whitespace-pre-wrap"></div>
        <div class="flex flex-wrap items-center gap-3 pt-2">
            <label class="w-full sm:w-52 text-sm font-medium text-cl-text-2 shrink-0">按状态筛选</label>
            <select id="codes-filter" class="h-10 w-full sm:w-40 rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text focus:outline-none focus:ring-2 focus:ring-cl-primary/30">
                <option value="">全部</option>
                <option value="active">未使用</option>
                <option value="used">已兑换</option>
                <option value="voided">已作废</option>
            </select>
            <button type="button" class="cl-btn-ghost" id="refresh-codes-btn">刷新列表</button>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-[13px]">
                <thead>
                    <tr class="text-left text-cl-text-3 border-b border-cl-border">
                        <th class="py-2 pr-4 font-medium">卡密</th>
                        <th class="py-2 pr-4 font-medium">面额</th>
                        <th class="py-2 pr-4 font-medium">状态</th>
                        <th class="py-2 pr-4 font-medium">使用者</th>
                        <th class="py-2 pr-4 font-medium">创建时间</th>
                        <th class="py-2 pr-4 font-medium">兑换时间</th>
                        <th class="py-2 font-medium">操作</th>
                    </tr>
                </thead>
                <tbody id="codes-body"><tr><td colspan="7" class="py-6 text-cl-text-3">加载中…</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/static/js/pm_pages.js"></script>
<script>
(function () {
    'use strict';
    var U = window.pmUtil;
    if (!U) { console.error('[admin_credits] pm_pages.js 未加载'); return; }
    var esc = U.esc, getJSON = U.getJSON, postJSON = U.postJSON;

    // 渲染令牌（P024）：按模块独立，子操作重载只作废本模块旧链
    var creditTk = 0, llmTk = 0, usersTk = 0, txTk = 0, codesTk = 0;
    var $ = function (id) { return document.getElementById(id); };
    // DOM 顶部一次性捕获（P024）
    var elTopMsg = $('adm-top-msg');
    var elCreditRows = $('credit-config-rows'), elCreditMsg = $('credit-config-msg'), elCreditSave = $('save-credit-cfg-btn');
    var elLlmRows = $('llm-config-rows'), elLlmMsg = $('llm-config-msg'), elLlmSave = $('save-llm-cfg-btn');
    var elUsersBody = $('users-body'), elAdjustBox = $('adjust-box'), elAdjustUser = $('adjust-user'),
        elAdjustDelta = $('adjust-delta'), elAdjustNote = $('adjust-note'), elAdjustSubmit = $('adjust-submit-btn'),
        elAdjustTxBtn = $('adjust-tx-btn'), elAdjustMsg = $('adjust-msg'), elAdjustTxWrap = $('adjust-tx-wrap'), elAdjustTxBody = $('adjust-tx-body');
    var elCodeCredits = $('code-credits'), elCodeCount = $('code-count'), elGenBtn = $('gen-codes-btn'),
        elGenMsg = $('gen-codes-msg'), elGenOut = $('gen-codes-out'), elCodesFilter = $('codes-filter'),
        elRefreshCodesBtn = $('refresh-codes-btn'), elCodesBody = $('codes-body');

    function showMsg(el, text, ok) {
        el.className = 'text-[13px] rounded-clbtn px-3 py-2 block';
        el.textContent = text;
        el.style.background = ok ? '#E7F8F1' : '#FEE2E2';
        el.style.color = ok ? '#065F46' : '#991B1B';
        clearTimeout(el._mt);
        el._mt = setTimeout(function () { el.textContent = ''; el.className = ''; el.style.background = ''; el.style.color = ''; }, 6000);
    }

    // ==================== 积分业务参数 ====================
    var CREDIT_KEYS = ['credits_daily_bonus', 'credits_token_ratio', 'credits_asr_per_minute',
                       'credits_per_yuan', 'credits_recharge_text', 'credits_recharge_url'];
    var CREDIT_LABELS = {
        credits_daily_bonus: '每日登录赠送积分',
        credits_token_ratio: '积分换算比例（Token/积分）',
        credits_asr_per_minute: '录音转文字每分钟扣分',
        credits_per_yuan: '1 元兑换积分数',
        credits_recharge_text: '充值引导文案',
        credits_recharge_url: '充值店铺链接',
    };
    var ROW_INP = 'h-10 flex-1 min-w-48 rounded-clbtn border border-cl-border bg-cl-surface px-3 text-sm text-cl-text placeholder:text-cl-text-3 focus:outline-none focus:ring-2 focus:ring-cl-primary/30';

    function loadCreditConfig(my) {
        getJSON('/api/admin/credits/config').then(function (d) {
            if (my !== creditTk) return;
            d = d || {};
            elCreditRows.innerHTML = CREDIT_KEYS.map(function (k) {
                var item = d[k] || { value: '', description: '' };
                return '<div class="flex flex-wrap items-center gap-3 mb-3">' +
                    '<label class="w-full sm:w-52 text-sm font-medium text-cl-text-2 shrink-0">' + esc(CREDIT_LABELS[k]) + '</label>' +
                    '<input data-ckey="' + esc(k) + '" value="' + esc(item.value) + '" class="' + ROW_INP + '">' +
                    '<span class="text-xs text-cl-text-3">' + esc(item.description || '') + '</span></div>';
            }).join('');
        }).catch(function (e) {
            if (my === creditTk) showMsg(elTopMsg, '加载积分参数失败：' + e.message, false);
        });
    }
    function saveCreditConfig() {
        var body = {};
        elCreditRows.querySelectorAll('input[data-ckey]').forEach(function (inp) {
            body[inp.getAttribute('data-ckey')] = inp.value.trim();
        });
        elCreditSave.disabled = true;
        postJSON('/api/admin/credits/config', body).then(function (d) {
            showMsg(elCreditMsg, '已保存：' + (((d && d.updated) || []).join(', ') || '无变更'), true);
            loadCreditConfig(++creditTk);
        }).catch(function (e) {
            showMsg(elCreditMsg, '保存失败：' + e.message, false);
        }).then(function () { elCreditSave.disabled = false; });
    }

    // ==================== 系统大模型 ====================
    var LLM_LABELS = {
        llm_provider: '默认提供商',
        deepseek_api_key: 'DeepSeek API Key', deepseek_model: 'DeepSeek 模型', deepseek_api_url: 'DeepSeek URL',
        gemini_api_key: 'Gemini API Key', gemini_model: 'Gemini 模型',
        qwen_api_key: '通义千问 API Key', qwen_model: '通义千问 模型', qwen_api_url: '通义千问 URL',
        ollama_api_url: 'Ollama URL', ollama_model: 'Ollama 模型',
    };
    function loadLlmConfig(my) {
        getJSON('/api/admin/llm-config').then(function (d) {
            if (my !== llmTk) return;
            d = d || {};
            elLlmRows.innerHTML = Object.keys(d).map(function (k) {
                var isKey = /api_key$/.test(k);
                var label = LLM_LABELS[k] || k;
                return '<div class="flex flex-wrap items-center gap-3 mb-3">' +
                    '<label class="w-full sm:w-52 text-sm font-medium text-cl-text-2 shrink-0">' + esc(label) + '</label>' +
                    '<input data-lkey="' + esc(k) + '" type="text" value="' + esc(d[k]) + '"' +
                    (k === 'llm_provider' ? ' placeholder="DeepSeek / Gemini / Qwen / Ollama"' : '') + ' class="' + ROW_INP + '">' +
                    '<span class="text-xs text-cl-text-3">' + (isKey ? '（掩码显示，不修改请原样保存）' : '') + '</span></div>';
            }).join('');
        }).catch(function (e) {
            if (my === llmTk) showMsg(elTopMsg, '加载系统大模型配置失败：' + e.message, false);
        });
    }
    function saveLlmConfig() {
        var body = {};
        elLlmRows.querySelectorAll('input[data-lkey]').forEach(function (inp) {
            body[inp.getAttribute('data-lkey')] = inp.value.trim();
        });
        elLlmSave.disabled = true;
        postJSON('/api/admin/llm-config', body).then(function (d) {
            showMsg(elLlmMsg, '已保存：' + (((d && d.updated) || []).join(', ') || '无变更（掩码原值已跳过）'), true);
            loadLlmConfig(++llmTk);
        }).catch(function (e) {
            showMsg(elLlmMsg, '保存失败：' + e.message, false);
        }).then(function () { elLlmSave.disabled = false; });
    }

    // ==================== 用户积分 ====================
    var TX_LABEL = { llm: 'AI调用', asr: '录音转文字', recharge: '卡密充值', gift: '每日赠送', admin_adjust: '管理员调整' };
    function loadUsers(my) {
        getJSON('/api/admin/users').then(function (rows) {
            if (my !== usersTk) return;
            rows = rows || [];
            if (!rows.length) {
                elUsersBody.innerHTML = '<tr><td colspan="7" class="py-6 text-cl-text-3">暂无用户</td></tr>';
                return;
            }
            elUsersBody.innerHTML = rows.map(function (u) {
                return '<tr class="border-b border-cl-border/60">' +
                    '<td class="py-2 pr-4">' + esc(u.username) + '</td><td class="py-2 pr-4">' + esc(u.display_name) + '</td>' +
                    '<td class="py-2 pr-4 font-semibold">' + Number(u.balance || 0).toFixed(1) + '</td>' +
                    '<td class="py-2 pr-4">' + Number(u.total_recharged || 0).toFixed(1) + '</td>' +
                    '<td class="py-2 pr-4">' + Number(u.total_granted || 0).toFixed(1) + '</td>' +
                    '<td class="py-2 pr-4">' + Number(u.total_used || 0).toFixed(1) + '</td>' +
                    '<td class="py-2"><button type="button" class="cl-btn-ghost !h-8 !px-3 !text-xs" ' +
                    'data-adj-uid="' + esc(u.user_id) + '" data-adj-name="' + esc(u.username) + '">调整</button></td></tr>';
            }).join('');
        }).catch(function (e) {
            if (my === usersTk) {
                elUsersBody.innerHTML = '<tr><td colspan="7" class="py-6 text-cl-text-3">加载失败（需管理员权限）</td></tr>';
                showMsg(elTopMsg, '加载用户列表失败：' + e.message, false);
            }
        });
    }
    // 事件委托：行内「调整」按钮（重渲染不丢绑定）
    elUsersBody.addEventListener('click', function (ev) {
        var b = ev.target.closest('button[data-adj-uid]');
        if (!b) return;
        // CodeReview 批8 M-1：换选用户时作废在途流水链，防旧用户响应回来后冒充展示
        ++txTk;
        elAdjustTxBody.innerHTML = '';
        elAdjustUser.value = b.getAttribute('data-adj-name') + '（' + b.getAttribute('data-adj-uid') + '）';
        elAdjustUser.setAttribute('data-uid', b.getAttribute('data-adj-uid'));
        elAdjustBox.classList.remove('hidden');
        elAdjustTxWrap.classList.add('hidden');
        elAdjustDelta.value = '';
        elAdjustNote.value = '';
    });
    function submitAdjust() {
        var uid = elAdjustUser.getAttribute('data-uid');
        if (!uid) { showMsg(elAdjustMsg, '请先在列表中点击「调整」选择用户', false); return; }
        var delta = parseFloat(elAdjustDelta.value);
        if (isNaN(delta) || delta === 0) { showMsg(elAdjustMsg, '调整积分需为非零数字', false); return; }
        elAdjustSubmit.disabled = true;
        postJSON('/api/admin/adjust', { user_id: uid, delta: delta, note: elAdjustNote.value }).then(function () {
            showMsg(elAdjustMsg, '调整成功，' + (delta > 0 ? '增加' : '扣减') + ' ' + Math.abs(delta) + ' 积分', true);
            loadUsers(++usersTk);
            // CodeReview 批8 m-3：流水面板正展开时同步重拉，避免展示缺最新一笔的过期数据
            if (!elAdjustTxWrap.classList.contains('hidden')) showUserTx();
        }).catch(function (e) {
            showMsg(elAdjustMsg, '调整失败：' + e.message, false);
        }).then(function () { elAdjustSubmit.disabled = false; });
    }
    function showUserTx() {
        var uid = elAdjustUser.getAttribute('data-uid');
        if (!uid) return;
        var my = ++txTk;
        getJSON('/api/admin/transactions/' + encodeURIComponent(uid) + '?limit=50').then(function (rows) {
            if (my !== txTk) return;
            rows = rows || [];
            elAdjustTxBody.innerHTML = rows.length ? rows.map(function (t) {
                return '<tr class="border-b border-cl-border/60">' +
                    '<td class="py-2 pr-4">' + esc((t.created_at || '').replace('T', ' ').substring(0, 19)) + '</td>' +
                    '<td class="py-2 pr-4">' + esc(TX_LABEL[t.type] || t.type || '') + '</td>' +
                    '<td class="py-2 pr-4">' + esc(t.scene || t.note || '') + '</td>' +
                    '<td class="py-2 pr-4">' + Number(t.credits_delta || 0).toFixed(1) + '</td>' +
                    '<td class="py-2">' + Number(t.credits_after || 0).toFixed(1) + '</td></tr>';
            }).join('') : '<tr><td colspan="5" class="py-6 text-cl-text-3">暂无流水</td></tr>';
            elAdjustTxWrap.classList.remove('hidden');
        }).catch(function (e) {
            if (my === txTk) showMsg(elAdjustMsg, '加载流水失败：' + e.message, false);
        });
    }

    // ==================== 卡密 ====================
    function genCodes() {
        var each = parseFloat(elCodeCredits.value);
        var count = parseInt(elCodeCount.value);
        if (!(each > 0) || !(count >= 1 && count <= 1000)) { showMsg(elGenMsg, '面额需>0，数量范围 1-1000', false); return; }
        elGenBtn.disabled = true;
        postJSON('/api/admin/codes/generate', { credits: each, count: count }).then(function (d) {
            showMsg(elGenMsg, '已生成 ' + d.batch_count + ' 张卡密（可全选复制后上架）', true);
            elGenOut.textContent = (d.codes || []).join('\n');
            elGenOut.classList.remove('hidden');
            loadCodes(++codesTk);
        }).catch(function (e) {
            showMsg(elGenMsg, '生成失败：' + e.message, false);
        }).then(function () { elGenBtn.disabled = false; });
    }
    var ST_LABEL = { active: '未使用', used: '已兑换', voided: '已作废' };
    var ST_BADGE = {
        active: '<span class="cl-badge bg-cl-secondary-soft text-cl-secondary">未使用</span>',
        used: '<span class="cl-badge bg-cl-bg text-cl-text-2">已兑换</span>',
        voided: '<span class="cl-badge bg-[#FEE2E2] text-[#991B1B]">已作废</span>',
    };
    function loadCodes(my) {
        var st = elCodesFilter.value;
        getJSON('/api/admin/codes?limit=200' + (st ? ('&status=' + st) : '')).then(function (rows) {
            if (my !== codesTk) return;
            rows = rows || [];
            if (!rows.length) {
                elCodesBody.innerHTML = '<tr><td colspan="7" class="py-6 text-cl-text-3">暂无卡密</td></tr>';
                return;
            }
            elCodesBody.innerHTML = rows.map(function (c) {
                return '<tr class="border-b border-cl-border/60">' +
                    '<td class="py-2 pr-4 font-mono">' + esc(c.code) + '</td>' +
                    '<td class="py-2 pr-4">' + Number(c.credits || 0).toFixed(0) + '</td>' +
                    '<td class="py-2 pr-4">' + (ST_BADGE[c.status] || '<span class="cl-badge bg-cl-bg text-cl-text-2">' + esc(c.status || '') + '</span>') + '</td>' +
                    '<td class="py-2 pr-4">' + esc(c.used_by || '') + '</td>' +
                    '<td class="py-2 pr-4">' + esc((c.created_at || '').replace('T', ' ').substring(0, 19)) + '</td>' +
                    '<td class="py-2 pr-4">' + esc((c.used_at || '').replace('T', ' ').substring(0, 19)) + '</td>' +
                    '<td class="py-2">' + (c.status === 'active'
                        ? '<button type="button" class="cl-btn-ghost !h-8 !px-3 !text-xs !text-[#991B1B]" data-void-code="' + esc(c.code) + '">作废</button>'
                        : '') + '</td></tr>';
            }).join('');
        }).catch(function (e) {
            if (my === codesTk) {
                elCodesBody.innerHTML = '<tr><td colspan="7" class="py-6 text-cl-text-3">加载失败（需管理员权限）</td></tr>';
                showMsg(elTopMsg, '加载卡密列表失败：' + e.message, false);
            }
        });
    }
    // 事件委托：作废按钮（confirm 后单次锁闭该按钮防连点）
    elCodesBody.addEventListener('click', function (ev) {
        var b = ev.target.closest('button[data-void-code]');
        if (!b || b.disabled) return;
        var code = b.getAttribute('data-void-code');
        if (!confirm('确认作废卡密 ' + code + ' ？')) return;
        b.disabled = true;
        postJSON('/api/admin/codes/void', { code: code }).then(function () {
            loadCodes(++codesTk);
        }).catch(function (e) {
            b.disabled = false;
            showMsg(elGenMsg, '作废失败：' + e.message, false);
        });
    });

    // ==================== 初始化 ====================
    function init() {
        loadCreditConfig(++creditTk);
        loadLlmConfig(++llmTk);
        loadUsers(++usersTk);
        loadCodes(++codesTk);
        elCreditSave.addEventListener('click', saveCreditConfig);
        elLlmSave.addEventListener('click', saveLlmConfig);
        elAdjustSubmit.addEventListener('click', submitAdjust);
        elAdjustTxBtn.addEventListener('click', showUserTx);
        elGenBtn.addEventListener('click', genCodes);
        elRefreshCodesBtn.addEventListener('click', function () { loadCodes(++codesTk); });
        elCodesFilter.addEventListener('change', function () { loadCodes(++codesTk); });
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
    else { init(); }
})();
</script>
