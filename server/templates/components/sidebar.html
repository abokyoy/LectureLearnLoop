<!-- 批1 壳层重构：72px 窄图标侧边栏（DESIGN.md §6），Lucide sprite 图标，父项直达落地页；二级菜单用 hover flyout（练/记子功能，恢复 Qt menuState 二级语义） -->
<aside id="sidebar" class="w-[72px] shrink-0 flex flex-col items-center py-4 bg-cl-surface border-r border-cl-border z-30">
    <!-- Logo -->
    <div class="w-10 h-10 rounded-full bg-cl-primary-soft flex items-center justify-center mb-6" title="柯基学习小助手">
        <svg class="w-6 h-6 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-dog"/></svg>
    </div>

    <!-- 主导航（点击直达各模块落地页） -->
    <nav id="navigation" class="flex-1 flex flex-col items-center gap-1">
        <a class="cl-nav-item" data-cid="dashboard" title="工作台" onclick="handleMenuClick('dashboard')">
            <svg class="w-5 h-5" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-layout-dashboard"/></svg>
            <span class="text-xs">工作台</span>
        </a>
        <a class="cl-nav-item" data-cid="online_course_notes" title="学 · 网课笔记" onclick="handleMenuClick('online_course_notes')">
            <svg class="w-5 h-5" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-graduation-cap"/></svg>
            <span class="text-xs">学</span>
        </a>
        <!-- 练（u8）：父项直达科目统计总览；hover 展开全部练习模式 -->
        <div class="relative group">
            <a class="cl-nav-item" data-cid="practice_overview" title="练 · 练习总览" tabindex="0" onclick="handleMenuClick('practice_overview')">
                <svg class="w-5 h-5" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-dumbbell"/></svg>
                <span class="text-xs">练</span>
            </a>
            <!-- CodeReview 批9 m-1：hover 或键盘 focus-within 均可展开，二级项可达 -->
            <div class="hidden group-hover:flex group-focus-within:flex absolute left-full top-0 flex-col gap-0.5 min-w-[176px] rounded-cl border border-cl-border bg-cl-surface p-1.5 shadow-lg">
                <a class="flex items-center gap-2 px-3 py-2 rounded-clbtn text-[13px] text-cl-text hover:bg-cl-primary-soft cursor-pointer" onclick="handleMenuClick('practice_overview')">
                    <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-layout-dashboard"/></svg>
                    练习总览
                </a>
                <a class="flex items-center gap-2 px-3 py-2 rounded-clbtn text-[13px] text-cl-text hover:bg-cl-primary-soft cursor-pointer" onclick="handleMenuClick('practice_knowledge')">
                    <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-target"/></svg>
                    从知识点练
                </a>
                <a class="flex items-center gap-2 px-3 py-2 rounded-clbtn text-[13px] text-cl-text hover:bg-cl-primary-soft cursor-pointer" onclick="handleMenuClick('practice_materials')">
                    <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-layers"/></svg>
                    从脑图练
                </a>
                <a class="flex items-center gap-2 px-3 py-2 rounded-clbtn text-[13px] text-cl-text hover:bg-cl-primary-soft cursor-pointer" onclick="handleMenuClick('practice_errors')">
                    <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-alert-circle"/></svg>
                    从错题练
                </a>
            </div>
        </div>
        <!-- 记：父项直达记忆总览（u9 科目统计首页）；hover 展开全部记忆模式 -->
        <div class="relative group">
            <a class="cl-nav-item" data-cid="memory_overview" title="记 · 记忆总览" tabindex="0" onclick="handleMenuClick('memory_overview')">
                <svg class="w-5 h-5" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-brain"/></svg>
                <span class="text-xs">记</span>
            </a>
            <div class="hidden group-hover:flex group-focus-within:flex absolute left-full top-0 flex-col gap-0.5 min-w-[176px] rounded-cl border border-cl-border bg-cl-surface p-1.5 shadow-lg">
                <a class="flex items-center gap-2 px-3 py-2 rounded-clbtn text-[13px] text-cl-text hover:bg-cl-primary-soft cursor-pointer" onclick="handleMenuClick('memory_overview')">
                    <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-layout-dashboard"/></svg>
                    记忆总览
                </a>
                <a class="flex items-center gap-2 px-3 py-2 rounded-clbtn text-[13px] text-cl-text hover:bg-cl-primary-soft cursor-pointer" onclick="handleMenuClick('memory_knowledge')">
                    <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-brain"/></svg>
                    记知识点
                </a>
                <a class="flex items-center gap-2 px-3 py-2 rounded-clbtn text-[13px] text-cl-text hover:bg-cl-primary-soft cursor-pointer" onclick="handleMenuClick('memory_errors')">
                    <svg class="w-4 h-4 text-cl-primary" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-history"/></svg>
                    记错题（复练）
                </a>
            </div>
        </div>
        <a class="cl-nav-item" data-cid="knowledge_base" title="知识库" onclick="handleMenuClick('knowledge_base')">
            <svg class="w-5 h-5" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-library"/></svg>
            <span class="text-xs">知识库</span>
        </a>
    </nav>

    <!-- 底部：设置 + 用户头像（点击打开用户设置） -->
    <div class="mt-auto flex flex-col items-center gap-1">
        <a class="cl-nav-item" data-cid="settings" title="设置" onclick="handleMenuClick('settings')">
            <svg class="w-5 h-5" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-settings"/></svg>
            <span class="text-xs">设置</span>
        </a>
        <button id="user-avatar-btn" class="w-11 h-11 mt-2 rounded-full bg-cl-secondary-soft text-cl-secondary flex items-center justify-center cursor-pointer hover:opacity-90 focus:outline-none transition-opacity" title="用户设置">
            <svg class="w-5 h-5" aria-hidden="true"><use href="/static/icons/lucide-sprite.svg#li-user"/></svg>
        </button>
    </div>
</aside>
