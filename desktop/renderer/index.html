<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>LectureLearnLoop</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #f6f8f7; color: #2d3a36; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #fff; border-radius: 12px; padding: 32px 48px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
    .ok { color: #16a34a; } .bad { color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🐾 LectureLearnLoop 桌面端</h2>
    <p id="status">正在检测服务端……</p>
  </div>
  <script>
    (async () => {
      const base = await window.llShell.getServerBase();
      const el = document.getElementById('status');
      try {
        const r = await fetch(base + '/api/health');
        const j = await r.json();
        el.innerHTML = '<span class="ok">✔ 服务端连通</span> ' + base +
          ' · service=' + j.data.service +
          '<br/><small>P0 引导页：P2 将在此挂载完整 SPA</small>';
        fetch(base + '/api/debug/log', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ logs: [{ module: 'electron', action: 'boot_ok', status: 'success', data: { base } }] }),
        }).catch(() => {});
      } catch (e) {
        el.innerHTML = '<span class="bad">✘ 服务端不可达：' + e.message + '</span>';
      }
    })();
  </script>
</body>
</html>
